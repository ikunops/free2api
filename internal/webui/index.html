<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free2API · WorkBuddy 网关控制台</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#fff; --side:#fbfbfa; --line:#ececea; --line2:#f2f2f0;
  --fg:#1a1a18; --fg2:#5c5c58; --fg3:#8a8a86; --fg4:#a3a3a0;
  --acc:#10b981; --acc-bg:#e9f7f1; --dark:#1a1a18; --danger:#e5484d;
  --warn:#b7791f; --warn-bg:#fdf6e3; --err-bg:#fdecec;
  --r:14px; --r2:10px; --r3:8px;
  --sh:0 1px 2px rgba(16,16,16,.04);
}
*{box-sizing:border-box}
svg{width:16px;height:16px;flex:0 0 auto}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:inherit}

.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}

.side{background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px}
.logo{width:34px;height:34px;border-radius:9px;flex:0 0 34px;
  background:linear-gradient(140deg,#34d399,#0ea5e9);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
  box-shadow:0 1px 3px rgba(16,185,129,.28)}
.brand b{display:block;font-size:14px;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--fg3);margin-top:1px}
nav{padding:6px 8px;overflow:auto;flex:1}
.ngroup{margin:10px 0 4px;padding:0 8px;font-size:11px;color:var(--fg4);letter-spacing:.4px}
.nitem{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:var(--r3);
  color:var(--fg2);cursor:pointer;font-size:13px;user-select:none;margin:1px 0}
.nitem:hover{background:#f1f1ef}
.nitem.on{background:#ececea;color:var(--fg);font-weight:500}
.nitem svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nitem .cnt{margin-left:auto;font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:7px;
  align-items:center;font-size:12px;color:var(--fg3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:0 0 7px}
.dot.off{background:#d4d4d0}

/* min-width:0：grid 子项默认 min-width:auto，会被内容顶宽（表格一宽整页就横向滚动），
   显式归零后宽度由网格列决定，宽表交给 .tablewrap 卡内滚动。 */
.main{padding:26px 40px 64px;width:100%;min-width:0}
@media(min-width:1600px){.main{padding-left:56px;padding-right:56px}}
@media(min-width:2200px){.main{padding-left:80px;padding-right:80px}}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.ic{width:34px;height:34px;border-radius:var(--r3);border:1px solid var(--line);
  background:#fff;color:var(--fg2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;box-shadow:var(--sh)}
.ic:hover{border-color:#dcdcd8;color:var(--fg)}
.ic svg{width:16px;height:16px}
.ic.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-size:34px;line-height:1.2;font-weight:800;margin:6px 0 10px;letter-spacing:-.6px}
h2{font-size:16px;font-weight:650;margin:0 0 3px}
.meta{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg3);
  margin:0 0 24px;flex-wrap:wrap}
.meta .vbar{width:3px;height:15px;border-radius:2px;background:var(--acc);flex:0 0 3px}
.sub{font-size:12.5px;color:var(--fg3);margin:2px 0 16px;line-height:1.7}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;box-shadow:var(--sh);margin-bottom:16px}
.card.pad0{padding:14px 20px}
.card-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.card-head .grow{flex:1}
.sep{height:1px;background:var(--line2);margin:16px 0}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:1000px){.grid4,.grid3,.grid2{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.grid4,.grid3,.grid2{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}.side{position:static;height:auto}.main{padding:20px}}

.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;box-shadow:var(--sh)}
.stat .k{font-size:12px;color:var(--fg3);display:flex;align-items:center;gap:6px}
.stat .v{font-size:29px;font-weight:750;line-height:1.25;margin:4px 0 2px;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .n{font-size:11.5px;color:var(--fg4)}

.mini{border:1px solid var(--line2);border-radius:var(--r2);padding:13px 15px;cursor:pointer;
  background:#fff;transition:border-color .12s}
.mini:hover{border-color:#d8d8d4}
.mini .t{font-size:13px;font-weight:600}
.mini .c{font-size:24px;font-weight:700;margin:6px 0 3px;font-variant-numeric:tabular-nums}
.mini .d{font-size:11.5px;color:var(--fg3);line-height:1.6}
.bar-track{height:4px;border-radius:3px;background:#f1f1ef;overflow:hidden;margin-top:9px}
.bar-fill{height:100%;background:var(--acc);border-radius:3px}

button{background:#fff;border:1px solid var(--line);color:var(--fg);
  border-radius:var(--r3);padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled):not(.chip){border-color:#d8d8d4;background:#fcfcfb}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:500}
button.pri:hover:not(:disabled){background:#2c2c29;border-color:#2c2c29}
button.gh{background:#fff}
button.tiny{padding:4px 9px;font-size:12px}

input,select,textarea{border:1px solid var(--line);border-radius:var(--r3);
  padding:7px 10px;font-size:13px;color:var(--fg);background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#b9b9b4}
textarea{min-height:104px;resize:vertical;font-family:Consolas,"Cascadia Mono",monospace;
  font-size:12px;line-height:1.65}
label.f{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:5px}
.field{margin-bottom:13px}
.hint{font-size:11.5px;color:var(--fg4);margin-top:5px;line-height:1.65}

.seg{display:inline-flex;background:#f5f5f3;border:1px solid var(--line);
  border-radius:10px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:7px;
  font-size:13px;color:var(--fg2)}
.seg button.on{background:#fff;color:var(--fg);font-weight:550;
  box-shadow:0 1px 2px rgba(16,16,16,.07)}
.seg button .b{font-size:11px;color:var(--fg4);margin-left:6px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;
  font-size:12.5px;color:var(--fg2);cursor:pointer}
.chip:hover{border-color:#d8d8d4}
/* .chip.on 要压过上面的全局 button:hover（那条特异性 0,2,1 比 .chip.on 的 0,2,0 高），
   否则鼠标停在选中的 chip 上时深色底被换成近白底、而 color:#fff 还在 —— 白字白底看不见。 */
.chip.on,.chip.on:hover{background:var(--dark);border-color:var(--dark);color:#fff}

/* 列多的表放在会横向滚动的容器里：整页不出现横向滚动条，列宽也不被压扁 */
.tablewrap{overflow-x:auto;margin:0 -2px}
.tablewrap table{min-width:100%}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line2);
  vertical-align:middle;font-size:13px}
th{font-size:11.5px;color:var(--fg3);font-weight:500;padding-top:4px;padding-bottom:8px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.dim td{opacity:.55}
td.num{font-variant-numeric:tabular-nums}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}

.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--fg2);white-space:nowrap}
.tag.ok{color:#0f7a5a;border-color:#cdeade;background:var(--acc-bg)}
.tag.warn{color:var(--warn);border-color:#f0e2bd;background:var(--warn-bg)}
.tag.err{color:#c0392b;border-color:#f3d3d4;background:var(--err-bg)}
.tag.mut{color:var(--fg4)}

.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 14px;font-size:13px}
.kv>div:nth-child(odd){color:var(--fg3);font-size:12.5px}
/* codebox：Codex 配置改前/改后对照。等宽、可滚、限高，避免长配置把页面撑爆。 */
.codebox{background:var(--bg2,#f6f7f9);border:1px solid var(--line,#e3e5e8);border-radius:6px;padding:9px 11px;font-size:12px;line-height:1.5;white-space:pre;overflow:auto;max-height:300px;margin:0}
.empty{border:1px dashed #dcdcd8;border-radius:var(--r2);padding:26px 20px;
  text-align:center;color:var(--fg3);font-size:13px;background:#fdfdfc}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:12px;color:var(--fg3);line-height:1.85}
.note b{color:var(--fg2);font-weight:600}
/* .link：正文里的可点跳转（帮助页四步走 → 对应页签）。 */
.link{color:var(--acc);cursor:pointer;border-bottom:1px dashed currentColor}
.link:hover{color:#0f7a5a}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
/* 工具栏里的行内复选框标签：整块占位、绝不换行。
   flex 子项默认 flex-shrink:1，中文又能逐字断行 —— 不给 nowrap 就会被压成竖排三行。 */
.inlinechk{display:inline-flex;align-items:center;gap:6px;margin:0;flex:0 0 auto;
  white-space:nowrap;cursor:pointer;font-size:11.5px;color:var(--fg4);line-height:1.65}
.inlinechk input{width:14px;height:14px;margin:0;accent-color:var(--acc);cursor:pointer}
.hidden{display:none}
.copy{cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.copy svg{width:13px;height:13px;opacity:.5}
.copy:hover{color:var(--acc)}
ol.steps{margin:0;padding-left:20px;font-size:13px;color:var(--fg2);line-height:2}
ol.steps code{background:#f5f5f3;padding:1px 5px;border-radius:4px;font-size:12px}

#toast{position:fixed;right:24px;bottom:22px;z-index:40;display:flex;flex-direction:column;
  gap:9px;align-items:flex-end}
.toast{background:#fff;border:1px solid var(--line);border-radius:var(--r2);
  padding:10px 14px;font-size:13px;box-shadow:0 6px 22px rgba(16,16,16,.10);
  max-width:440px;line-height:1.65}
.toast.ok{border-left:3px solid var(--acc)}
.toast.err{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid #9aa0a6}
.pop{position:absolute;right:40px;top:66px;z-index:30;background:#fff;
  border:1px solid var(--line);border-radius:var(--r2);padding:14px;width:330px;
  box-shadow:0 10px 30px rgba(16,16,16,.12)}
/* 输出白名单：可勾选的模型清单（每行 勾选框 / 客户端看到的模型名 / 上游名 / 标位） */
.mlist{border:1px solid var(--line2);border-radius:var(--r2);max-height:470px;overflow:auto}
/* 第二列按实测最长 id（205px）定，留 11px 余量：原来 minmax(150px,300px) 在空间充足时
   一律取上限 300px，正文只用到 205px，右边就空出一大块。
   min-height + align-items:center 让带费率标签的行与不带的行等高（原来 41 / 36 参差）。 */
.mrow{display:grid;grid-template-columns:18px minmax(150px,216px) minmax(0,1fr) auto;align-items:center;
  min-height:41px;gap:10px;padding:8px 13px;border-bottom:1px solid var(--line2);font-size:12.5px;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:#fafaf8}
.mrow.off{opacity:.5}
/* 未授权：上游目录里有、号池里没有任何号有额度跑它。看得见、能勾，但默认收起。 */
.mrow.unent{opacity:.62}
.mlist.hideunent .mrow.unent{display:none}
.mrow input{width:15px;height:15px;margin:0;accent-color:var(--acc);cursor:pointer}
.mrow .mid{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mname{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mbits{display:flex;gap:5px;justify-content:flex-end}
/* 输出白名单的 producer 分组表头（workbuddy / zcode 各一段） */
.mgroup{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:7px 13px;background:#fafaf8;border-bottom:1px solid var(--line2);
  font-size:12px;color:var(--fg2);position:sticky;top:0;z-index:1}
@media(max-width:860px){.mrow{grid-template-columns:18px minmax(0,1fr) auto}.mrow .mname{display:none}}
/* 多出口：每个出口一块；「服务来源」用圆角标签勾选 */
.chan{border:1px solid var(--line2);border-radius:var(--r2);padding:13px 15px;margin-bottom:12px}
.chan-head{display:flex;gap:10px;align-items:center;margin-bottom:11px}
.chan-head input{font-weight:600}
.chan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chan-grid .field{margin-bottom:0}
@media(max-width:1000px){.chan-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.chan-grid{grid-template-columns:1fr}}
.ptog{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:var(--fg2);cursor:pointer;background:#fff}
.ptog input{width:13px;height:13px;margin:0;accent-color:var(--acc);cursor:pointer}
.ptog.on{border-color:#cdeade;background:var(--acc-bg);color:#0f7a5a}
.chan-url{font-size:12px;color:var(--fg3);margin-top:11px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 出口的共享字段收进折叠区：默认只看「端口 + 服务来源」，要覆盖主口参数时才展开。 */
.chan-adv{margin-top:11px;border-top:1px dashed var(--line2);padding-top:9px}
.chan-adv>summary{cursor:pointer;font-size:12px;color:var(--fg2);list-style:none;display:flex;gap:8px;align-items:center}
.chan-adv>summary::-webkit-details-marker{display:none}
.chan-adv>summary::before{content:"\25B8";color:var(--fg3);font-size:10px}
.chan-adv[open]>summary::before{content:"\25BE"}
.chan-adv .chan-grid{margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">Wb</div>
      <div><b>Free2API</b><span>WorkBuddy 网关控制台</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span class="dot" id="svcDot"></span>
      <span id="svcText">连接中…</span>
    </div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <button class="ic" id="btnKey" title="设置网关密钥"></button>
      <button class="ic" id="btnRefresh" title="刷新"></button>
    </div>
    <div id="keyPop" class="pop hidden">
      <h2 style="font-size:14px">网关密钥（api_key）</h2>
      <div class="sub" style="margin:6px 0 10px">
        只在网关配了 <span class="mono">api_key</span> 时才需要填。默认不配：本机直连免密钥。
      </div>
      <input id="keyInput" type="password" placeholder="留空 = 不使用密钥">
      <div class="row" style="margin-top:10px">
        <button class="pri tiny" id="btnKeySave">保存并刷新</button>
        <button class="tiny" id="btnKeyClose">关闭</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- 基础工具 ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const ICON = {
  grid: "M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z",
  inbox: "M3 13l3-8h12l3 8v6H3zM3 13h5l1.5 2.5h5L16 13h5",
  layers: "M12 3l9 5-9 5-9-5zM3 13.5l9 5 9-5",
  plug: "M9 3v4M15 3v4M6 7h12v3a6 6 0 11-6 6 6 6 0 11-6-6zM12 19v1.5",
  help: "M12 21a9 9 0 100-18 9 9 0 000 18zM9.6 9.3a2.5 2.5 0 114.4 1.6c-.8.9-2 1.2-2 2.6M12 17h.01",
  refresh: "M21 12a9 9 0 11-2.6-6.4M21 3v6h-6",
  key: "M7 11V8a5 5 0 0110 0v3M5 11h14v9H5zM12 15v2",
  copy: "M9 9h10v11H9zM5 15V4h10",
  chart: "M4 20V10M10 20V4M16 20v-7M22 20H2",
  pulse: "M2 12h4l2.5-6 3.5 12 3-8 2 2h5",
  clock: "M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3.5 2",
  trash: "M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6",
  warn: "M12 3l9.5 17H2.5zM12 10v4M12 17h.01"
};
function svg(k, cls){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round"' + (cls ? ' class="' + cls + '"' : '') +
    '><path d="' + ICON[k] + '"/></svg>';
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
function fmtTime(t){
  var n = Number(t) || 0; if (!n) return "—";
  if (n > 1e12) n = Math.floor(n / 1000);
  var d = new Date(n * 1000);
  var p = function(x){ return (x < 10 ? "0" : "") + x; };
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function futureTime(t){
  if (!t) return false;
  var d = new Date(t);
  if (isNaN(d.getTime())) return false;
  return d.getTime() > Date.now() + 1000;
}
function durNum(s){
  s = Number(s) || 0;
  if (s <= 0) return "—";
  if (s < 60) return s + " 秒";
  if (s < 3600) return Math.round(s / 60) + " 分钟";
  return (s / 3600).toFixed(1) + " 小时";
}
function toast(kind, text, ms){
  var box = $("#toast"), el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = text;
  box.appendChild(el);
  setTimeout(function(){
    el.style.transition = "opacity .3s"; el.style.opacity = "0";
    setTimeout(function(){ el.remove(); }, 320);
  }, ms || 3600);
}
function ApiErr(m){ this.message = m; }
ApiErr.prototype = Object.create(Error.prototype);
async function api(path, opt){
  var o = Object.assign({}, opt || {});
  o.headers = Object.assign({ "Accept": "application/json" }, o.headers || {});
  if (o.body && typeof o.body !== "string"){ o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(o.body); }
  if (S.apiKey) o.headers["Authorization"] = "Bearer " + S.apiKey;
  var r;
  try { r = await fetch(path, o); }
  catch (e) { throw new ApiErr("连不上网关（" + e.message + "）"); }
  var raw = await r.text(), j = null;
  try { j = raw ? JSON.parse(raw) : null; } catch (e) {}
  if (!r.ok){
    var m = (j && ((j.error && j.error.message) || j.message)) || ("HTTP " + r.status);
    if (r.status === 401) throw new ApiErr("401 未授权：本网关配了 api_key。点右上角钥匙图标填入密钥后重试。");
    if (r.status === 404) throw new ApiErr("404 未找到：" + m + "（管理端点要求 config.json 里 admin.enabled=true）");
    throw new ApiErr(m);
  }
  return j;
}

/* ---------- zcode 候选（这个账号当前能用什么、还剩多少，都在这里看） ---------- */
/* 与 workbuddy 候选的区别：zcode 的凭据不同构、上游不同，所以这张表多三列
   「可用模型 / 探活 / 额度」。探活与读额度都是**按需**触发（每号一次外网往返），
   不在打开页面时静默发生，也不做任何自动轮询。
   注意「可用模型」的判据是套餐/额度的 capabilities，不是 /models 能列出什么：
   周末活动的号 /models 能列 11 个，但只有 glm-5.3-flash 走额度覆盖。 */
var ZCODE_PROBE_VIEW = {
  ok:          { cls: "ok",   txt: "可用" },
  no_balance:  { cls: "warn", txt: "无额度" },
  bad_key:     { cls: "err",  txt: "凭据失效" },
  unreachable: { cls: "mut",  txt: "连不上" },
  error:       { cls: "err",  txt: "探活出错" }
};
function zcodeProbeTag(pr){
  if (!pr) return '<span class="tag mut">未探</span>';
  var v = ZCODE_PROBE_VIEW[pr.status] || { cls: "mut", txt: (pr.status || "未知") };
  var t = pr.msg || "";
  var bits = '<span class="tag ' + v.cls + '">' + esc(v.txt) + '</span>' +
    (pr.http ? ' <span class="tag mut">' + esc(String(pr.http)) + '</span>' : "");
  if (!t) return bits;
  var short = t.length > 42 ? t.slice(0, 42) + "…" : t;
  return '<span title="' + esc(t) + '">' + bits + '</span>' +
    '<div class="hint" style="margin:2px 0 0">' + esc(short) + '</div>';
}
function zcodeModelsCell(x){
  var ent  = (x.entitled_models && x.entitled_models.length) ? x.entitled_models : null;
  var live = (x.live_models && x.live_models.length) ? x.live_models : null;
  var snap = (x.model_ids && x.model_ids.length) ? x.model_ids : null;

  // 读过户/额度的号：以套餐覆盖为准（这才是上游真正放行的模型）。
  if (ent){
    var chips = ent.map(function(id){
      return '<span class="chip" style="cursor:default;padding:4px 11px;font-size:12px">' + esc(id) + '</span>';
    }).join("");
    var listable = (live || snap || []).length;
    var extra = listable > ent.length
      ? '<div class="hint" style="margin:6px 0 0">凭据另可列出 ' + listable + ' 个，但不在套餐覆盖内（调用会被上游拒）</div>'
      : "";
    return '<span class="tag ok">套餐覆盖</span> <b>' + ent.length + '</b> 个' +
      (x.plan_summary ? '<div class="hint" style="margin:3px 0 0">' + esc(x.plan_summary) + '</div>' : "") +
      '<div class="chips" style="margin:6px 0 0">' + chips + '</div>' + extra;
  }

  // 额度读了但没有任何权益（capabilities 为空）：说明上游没给这个号可用范围，
  // 别再说「未读额度」，那是两回事。
  if (x.quota){
    var ids0 = live || snap || [];
    return '<span class="tag warn">上游未给可用范围</span>' +
      (ids0.length ? '<div class="hint" style="margin:4px 0 0">凭据能列出 ' + ids0.length + ' 个，但套餐没说明覆盖哪些，调用能否通过要试</div>' : "") +
      '<div class="hint" style="margin:4px 0 0">额度已读：上游未返回任何权益条目</div>';
  }

  // 还没读额度：只能退到「凭据能列出什么」，明确标注这是弱证据。
  var ids = live || snap || [];
  if (!ids.length){
    return x.usable
      ? '<span class="hint" style="margin:0">未读额度，点「读全部额度」才准</span>'
      : '<span class="hint" style="margin:0">—</span>';
  }
  var show = ids.slice(0, 3).join(" · ") + (ids.length > 3 ? " …" : "");
  return '<b>' + ids.length + '</b> 个' +
    (live ? ' <span class="tag">实时列出</span>' : ' <span class="tag mut">账号快照</span>') +
    '<div class="hint mono" style="margin:2px 0 0;word-break:break-all">' + esc(show) + '</div>' +
    '<div class="hint" style="margin:3px 0 0">未读额度：这只是凭据能列出的，不保证套餐覆盖</div>';
}
function zcodeQuotaCell(x){
  if (x.quota_error) {
    return '<span class="tag err">读失败</span><div class="hint" style="margin:2px 0 0">' +
      esc(String(x.quota_error).slice(0, 42)) + '</div>';
  }
  var q = x.quota;
  if (!q) return '<span class="tag mut">未读</span>';
  var bs = q.balances || [];
  if (!bs.length) return '<span class="tag mut">上游未返回额度</span>';

  }).join("");
}

    '<span class="hint" style="margin:0">可取用 ' + usable + ' / ' + c.length + ' 个存档</span>' +

/* ---------- 账号池 ---------- */
/* loadCredits 拉余额快照。后端是「先返回旧值 + 后台重查」的形态，所以
   refreshing 为真时再隔 3 秒看一次（最多 6 次，不做无限轮询）。
   和池里那个 credits 字段的区别：池内值是每日签到时写的，这里是按需直查上游。 */
async function loadCredits(force){
  if (S.creditsBusy) return;
  S.creditsBusy = true;
  try {
    S.credits = force
      ? await api("/admin/credits/refresh", { method: "POST", body: {} })
      : await api("/admin/credits");
  } catch (e) { S.credits = null; }
  finally { S.creditsBusy = false; }
  render();
  if (S.credits && S.credits.refreshing && S.creditsPolls < 6){
    S.creditsPolls += 1;
    setTimeout(function(){ loadCredits(false); }, 3000);
  } else if (S.credits && !S.credits.refreshing){
    S.creditsPolls = 0;
  }
}
function creditRowOf(uid){
  var list = (S.credits && S.credits.accounts) || [];
  for (var i = 0; i < list.length; i++){ if (list[i].uid === uid) return list[i]; }
  return null;
}
/* creditCell 余额单元格：优先用直查结果（权威），查不到才回落到池内值并标明。 */
function fmtNum(n, unit){
  n = Number(n) || 0;
  if (unit !== "token") return String(n);
  // token 数动辄上亿，按原样报会看错数量级；换中文单位。
  if (n >= 1e8) return (n / 1e8).toFixed(2) + " 亿";
  if (n >= 1e4) return (n / 1e4).toFixed(1) + " 万";
  return String(n);
}
function creditCell(a){
  var c = creditRowOf(a.uid);
  if (c && c.ok){
    var sub = [];
    if (c.total) sub.push("总量 " + fmtNum(c.total, c.unit));
    if (c.used) sub.push("已用 " + fmtNum(c.used, c.unit));
    if (c.expiring) sub.push("快过期 " + fmtNum(c.expiring, c.unit));
    // 读到额度用的是哪一层凭据（号池文件 / zcode 账本 / ZCode 应用登录态）。
    // 后两层是兜底，运维要知道这个数字是不是随号池文件走的那一份。
    if (c.cred_source) sub.push("凭据 " + c.cred_source);
    if (c.note) sub.push(c.note);
    return '<div style="font-weight:600">' + fmtNum(c.remain, c.unit) +
      (c.unit === "token" ? ' <span class="hint" style="font-weight:400">token</span>' : '') + '</div>' +
      (sub.length ? '<div class="hint" style="margin:2px 0 0">' + esc(sub.join(" · ")) + '</div>' : '');
  }
  if (c && c.note){
    return '<span class="hint">上游未给可用范围</span>' +
      (a.credits ? '<div class="hint" style="margin:2px 0 0">池内 ' + esc(a.credits) + '</div>' : '');
  }
  if (c && c.error){
    return '<span class="hint" title="' + esc(c.error) + '">查不到</span>' +
      (a.credits ? '<div class="hint" style="margin:2px 0 0">池内 ' + esc(a.credits) + '</div>' : '');
  }
  if (a.credits) return a.credits + '<div class="hint" style="margin:2px 0 0">池内值</div>';
  return '<span class="hint">—</span>';
}
/* modelCell 账号池的「可用模型」列：先把该号**当前真正能用**的模型亮出来。
读得到权益就列（zcode 由套餐 capabilities 决定），读不到就说清楚为什么。
workbuddy 侧没有逐号模型权益——它的目录是所有同构号共享的，去「输出 API」看。 */
function modelCell(a){
  var c = creditRowOf(a.uid);
  var ms = (c && c.entitled_models) || [];
  if (ms.length){
    return '<span class="tag ok">' + ms.length + ' 个</span>' +
      (c.plan_summary ? ' <span class="hint">' + esc(c.plan_summary) + '</span>' : '') +
      '<div class="hint" style="margin:2px 0 0;word-break:break-all">' +
      esc(ms.slice(0, 3).join(" · ")) + (ms.length > 3 ? " …" : "") + '</div>';
  }
  if (c && c.note) return '<span class="hint">上游未给范围</span>';
  if (c && c.error) return '<span class="hint" title="' + esc(c.error) + '">依赖额度</span>';
  if ((a.producer || "") === "zcode") return '<span class="hint" title="点右上角「刷新」读该号的套餐权益">待读权益</span>';
  return '<span class="hint" title="workbuddy 侧模型目录按客户端共享，去「输出 API」看清单">按客户端目录</span>';
}
/* expCell 账号 access token 的到期呈现：绝对时间 + 剩余天数。0 = 号池里没记，
   不编造（不是"永不过期"，只是这份 auth 文件没写 expiresAt）。 */
function expCell(a){
  var c = creditRowOf(a.uid);
  // zcode 号没有 refresh token（凭据是长期密钥），能回答"用到什么时候"的只有套餐到期，
  // 所以这里回落到额度那一路拿到的 expires_at，并标明这是套餐口径。
  var planTs = (!a.expires_at && c && c.expires_at) ? c.expires_at : 0;
  var ts = a.expires_at || planTs;
  if (!ts) return '<span class="hint">—</span>';
  var days = Math.floor((ts * 1000 - Date.now()) / 86400000);
  var tone = days < 0 ? "err" : (days <= 7 ? "warn" : "");
  var label = days < 0 ? "已过期 " + (-days) + " 天" : ("剩 " + days + " 天");
  return '<span class="mono">' + esc(fmtTime(ts)) + '</span>' +
    '<div class="hint" style="margin:2px 0 0"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' +
    label + (planTs ? " · 套餐" : "") + '</div>';
}
/* failCell 池表「成功/连败」列的第二格：连败（consecutive_fails）是账号当前真实信号，
   熔断失败数（breaker_fails）另计。原来这一格取的是不存在的 err_total，恒为 0，
   看着像「从没失败过」，会误导排障。连败为 0 时退回显示熔断失败数（有则显示）。 */
function failCell(a){
  var cf = a.consecutive_fails || 0;
  if (cf) return '<span style="color:var(--warn)">' + cf + '</span>';
  var bf = a.breaker_fails || 0;
  if (bf) return bf;
  return "0";
}
function failTitle(a){
  var parts = [];
  parts.push("成功 " + (a.success_count || 0) + " 次");
  parts.push("连续失败 " + (a.consecutive_fails || 0) + " 次");
  if (a.breaker_fails) parts.push("熔断累计失败 " + a.breaker_fails + " 次");
  if (a.in_flight) parts.push("在飞 " + a.in_flight);
  return parts.join(" · ");
}
function acctState(a){
  if (a.disabled) return '<span class="tag err">已禁用</span>';
  if (a.manual_disabled) return '<span class="tag warn">手动停用</span>';

function sameChanList(a, b){

function chanReadDom(prev){
  var rows = $$("[data-chan-row]");
  if (!rows.length) return null;

  return rows.map(function(row){
    var idx = row.getAttribute("data-chan-row");
    var cur = prev[Number(idx)] || {};

    var producers = $$('[data-ckp="' + idx + '"]', row).filter(function(cb){ return cb.checked; })
      .map(function(cb){ return cb.getAttribute("data-ckv"); });

        .map(function(cb){ return cb.getAttribute("data-ckv"); }) : [];

  cbs.forEach(function(cb){
    if (cb.checked) n++;
    if (cb.hasAttribute("data-cmi") !== cb.checked) over = true;
  });
  if (over) own.push("发布清单 " + n + " 个");
  return {
    label: own.length ? ("已单独覆盖：" + own.join(" · ")) : "继承主口的输出参数",
    count: !cbs.length ? "" : (over ? ("已单独勾选 " + n + " / " + cbs.length)
                                   : ("继承主口（" + cbs.length + " 个）"))
  };
}
/* updChanRow 就地把摘要与计数刷新成当前 DOM 的状态（不整页重渲染，勾一下不会丢别的输入）。 */

/* chanModelToggle 出口发布清单的三个批量动作：只动 DOM 再刷摘要。 */
function chanModelToggle(i, fn){

/* ---------- 出口自己的发布清单 ---------- */
/* chanScopeModels 一个出口「服务来源」范围内的候选模型。出口只发自己来源的模型
   （拿别家的名字调它，后端按来源直接 404），勾选列表也按来源收窄，不摆陷阱。 */
function chanScopeModels(c){
  var avail = (S.out && S.out.available_models) || [];
  var scope = c.producers || [];
  return avail.filter(function(m){
    return !scope.length || scope.indexOf(m.producer || "workbuddy") >= 0;
  });
}
/* parentModelKeys 主口当前发布的键集合。空名单 = 没设白名单（全量放开），
   折成「全部可用键」再比——出口留空时继承到的正是这一份。 */
function parentModelKeys(){
  var avail = (S.out && S.out.available_models) || [];
  var list = ((S.out && S.out.output && S.out.output.models) || []);
  if (list.length) return list;
  return avail.map(function(m){ return m.key || m.id; });
}
/* chanModelBodyHtml 出口的发布清单编辑器，复用主口那套 .mlist/.mrow/.mgroup。
   勾选态 = 自己的名单（有）否则继承主口；与继承结果完全一致的勾选在保存时折回空名单，
   所以点开看一眼、随手全选再取消，不会把这个口从「跟随主口」变成「单独一份清单」。 */
function chanModelBodyHtml(c, i){
  var avail = (S.out && S.out.available_models) || [];
  if (!avail.length){
    return '<div class="sep"></div><div class="empty">暂时没有可勾的模型：池里要有健康账号，' +
      '网关才能带上账号的 token 从上游拉到模型表。</div>';
  }
  var cells = chanScopeModels(c);
  if (!cells.length){
    return '<div class="sep"></div><div class="empty">勾上的服务来源里还没有可用模型。</div>';
  }
  var inScope = {};
  cells.forEach(function(m){ inScope[m.key || m.id] = 1; });
  var inhSet = {};
  // 继承到的那一份 = 主口名单 ∩ 本口来源范围（主口全放时就是本口范围内的全部）。
  parentModelKeys().filter(function(k){ return inScope[k]; }).forEach(function(k){ inhSet[k] = 1; });
  var own = (c.models || []).filter(function(k){ return inScope[k]; });
  var want = {};
  (own.length ? own : Object.keys(inhSet)).forEach(function(k){ want[k] = 1; });
  var order = [], groups = {};
  cells.forEach(function(m){
    // 同主口：分组键带 realm，workbuddy 的 CN 版 / 国际版 wba 分开列。
    var p = (m.producer || "workbuddy") + (m.realm ? "/" + m.realm : "");
    if (!groups[p]){ groups[p] = []; order.push(p); }
    groups[p].push(m);
  });
  var rows = order.map(function(pk){
    var g = groups[pk];
    var p = pk.split("/")[0];
    var realm = pk.split("/")[1] || "";
    var gname = producerName(p) + (realm === "global" ? " · 国际版 wba" : "");
    var gsel = g.filter(function(m){ return want[m.key || m.id]; }).length;
    var head = '<div class="mgroup"><span><b>' + esc(gname) + '</b> · 本口可勾 ' + g.length +
      ' 个</span><span class="hint" style="margin:0">已勾 ' + gsel + ' / ' + g.length + '</span></div>';
    return head + g.map(function(m){
      var key = m.key || m.id;
      var on = !!want[key];
      var bits = [];
      if (m.suffix) bits.push('<span class="tag ' + (m.suffix === "-free" ? "ok" : "warn") + '">' +
        esc(m.suffix.replace(/^-/, "")) + '</span>');
      else if (m.credits) bits.push('<span class="tag warn">' + esc(m.credits) + '</span>');
      if (m.is_default) bits.push('<span class="tag ok">默认</span>');
      return '<label class="mrow' + (on ? "" : " off") + '">' +
        '<input type="checkbox" data-cmk="' + i + '" data-ckv="' + esc(key) + '"' + (on ? " checked" : "") +
        (inhSet[key] ? ' data-cmi="1"' : '') + '>' +
        '<span class="mid mono">' + esc(m.full_id) + '</span>' +
        '<span class="mname hint">' + esc(m.name || "") + '</span>' +
        '<span class="mbits">' + bits.join("") + '</span></label>';
    }).join("");
  }).join("");
  return '<div class="sep"></div>' +
    '<div class="row">' +
      '<span class="f" style="margin:0">发布清单</span>' +
      '<button class="tiny" data-action="chan-model-all" data-i="' + i + '">全选</button>' +
      '<button class="tiny" data-action="chan-model-none" data-i="' + i + '">全不选</button>' +
      '<button class="tiny" data-action="chan-model-inherit" data-i="' + i + '">按主口</button>' +
      '<span class="grow"></span>' +
      '<span class="hint" style="margin:0" data-cmcount="' + i + '"></span>' +
    '</div>' +
    '<div class="mlist">' + rows + '</div>' +
    '<div class="hint">只列<b>本口来源范围</b>内的模型。不动它 = 跟随主口（主口改清单，这个口跟着变）；' +
    '单独勾了就固定成你勾的这几个（勾回与主口一致会自动折回「跟随」）。</div>';
}

        '<div class="field"><label class="f">费率后缀</label><select data-ck="rate_hint">' +

/* codexCard —— Codex 一键接入。
   Codex CLI / 桌面端没有「自定义供应商」入口，只能改 ~/.codex/config.toml。
   这张卡片负责：读现状 → 预览改前改后 → 用户确认后落盘（先备份）。
   其它客户端（ZCode / OpenCode / Qoder / Cherry Studio）有 UI 入口，只需抄上面
   「接入信息」里的 Base URL，不走这张卡。 */
function codexCard(){
  var c = S.codex;
  if (!c) return card("Codex 一键接入", "正在读取 Codex 配置…", '<div class="empty">读取中…</div>');
  var body = "";
  // 现状
  var rows = [
    ["配置文件", '<span class="mono">' + esc(c.path) + "</span>"],
    ["状态", c.read_error ? '<span class="tag warn">读取失败</span>' : (c.exists ? '<span class="tag ok">已存在</span>' : '<span class="tag mut">尚未创建</span>')]
  ];
  if (c.read_error) rows.push(["错误", '<span class="tag warn">' + esc(c.read_error) + "</span>"]);
  if (c.exists){
    rows.push(["当前默认模型", c.current_model ? '<span class="mono">' + esc(c.current_model) + "</span>" : "（未设置）"]);
    rows.push(["当前供应商", c.current_provider ? '<span class="mono">' + esc(c.current_provider) + "</span>" : "（未设置）"]);
    if (c.current_base_url) rows.push(["当前指向", '<span class="mono">' + esc(c.current_base_url) + "</span>"]);
    rows.push(["已写过本网关的段", c.has_our_section ? '<span class="tag ok">是</span>' : '<span class="tag mut">否</span>']);
  }
  rows.push(["密钥环境变量", '<span class="mono">' + esc(c.env_key) + "</span> " + (c.env_key_set ? '<span class="tag ok">已设置</span>' : '<span class="tag warn">未设置</span>')]);
  body += kv(rows);

  // 选模型
  var ms = c.suggested_models || [];
  var curModel = S.codexModel || (ms.length ? ms[0] : "");
  body += '<div class="sep"></div><div class="grid2">' +
    '<div class="field"><label class="f">写为默认模型</label>' +
    (ms.length
      ? '<select id="codexModel">' + ms.map(function(m){ return '<option value="' + esc(m) + '"' + (m === curModel ? " selected" : "") + ">" + esc(m) + "</option>"; }).join("") + "</select>"
      : '<input id="codexModel" value="' + esc(curModel) + '" placeholder="例如 cn:auto">') +
    '<div class="hint">' + (ms.length ? "来自「发布清单」里已勾选的模型。" : "发布清单为空——先去下面勾模型，或手填一个。") + "</div></div>" +
    '<div class="field"><label class="f">Base URL</label><input id="codexBase" value="' + esc(c.suggested_base_url || "") + '">' +
    '<div class="hint">主口地址（含 /v1）。想给 Codex 单独开出口，就把出口地址填这里。</div></div>' +
    "</div>";

  // 提示
  var notes = [];
  if (c.models_cache_path) notes.push("检测到模型缓存 " + c.models_cache_path + "：换网关后建议删掉，让 Codex 重新拉模型列表（否则选择器可能还显示旧模型）。");
  if (!c.env_key_set) notes.push("环境变量 " + c.env_key + " 当前未设置。Codex 要求它存在（值可以是任意占位串，网关不鉴权时也一样）。");
  if (notes.length) body += '<div class="sep"></div>' + notes.map(function(t){ return '<div class="hint">· ' + esc(t) + "</div>"; }).join("");

  // 预览
  if (S.codexPlan){
    var pl = S.codexPlan;
    body += '<div class="sep"></div><div class="f"><label class="f">改动预览</label>' +
      (pl.changed
        ? '<div class="hint">下面是要写进去的内容（左边是现状，右边是改后；只动我们的段 + 顶层 model/model_provider 两行，其它内容原样保留）。</div>' +
          '<div class="grid2" style="margin-top:6px">' +
          '<pre class="mono codebox">' + esc(pl.before || "（文件不存在，将新建）") + "</pre>" +
          '<pre class="mono codebox">' + esc(pl.after) + "</pre></div>"
        : '<div class="hint">配置已是目标状态，无需写入。</div>') +
      (pl.backup_path ? '<div class="hint">落盘前会先备份到 ' + esc(pl.backup_path) + "</div>" : "") +
      "</div>";
  }

  body += '<div class="sep"></div><div class="row">' +
    '<button data-action="codex-preview">预览改动</button>' +
    (S.codexPlan && S.codexPlan.changed ? '<button class="pri" data-action="codex-apply">确认写入</button>' : "") +
    '<span class="hint" style="margin:0">只写 Codex 的 config.toml，改前自动备份。</span></div>';

  // 反向操作：还原官方默认（与 cmd/attach detach 同语义）
  body += '<div class="sep"></div><div class="row">' +
    '<button class="tiny" data-action="codex-detach-preview" ' +
    'title="删掉顶层 model_provider（网关模型名一并删），回到 Codex 官方 provider。我们的 provider 段保留，随时可再挂。">' +
    '还原官方默认</button>' +
    '<span class="hint" style="margin:0">卸载本网关的接入，不影响其它 provider。改前同样先备份。</span></div>';
  if (S.codexDetachPlan){
    var dp = S.codexDetachPlan;
    body += '<div style="margin-top:6px">' +
      (dp.changed
        ? '<div class="hint">将删除：' + (dp.removed_provider ? '顶层 model_provider；' : '') +
            (dp.removed_model ? ('顶层 model（' + esc(dp.current_model) + '）') : '（顶层 model 保持不动）') + '</div>' +
          '<div class="grid2" style="margin-top:6px">' +
          '<pre class="mono codebox">' + esc(dp.before || "") + "</pre>" +
          '<pre class="mono codebox">' + esc(dp.after || "") + "</pre></div>"
        : ('<div class="hint">' + (dp.kept_model ? ('顶层 model（' + esc(dp.kept_model) + '）是官方名，保留；') : "") +
            "已经是官方默认形态，无需改动。</div>")) +
      (dp.has_our_section ? '<div class="hint">[model_providers.free2api] 段保留，不影响官方使用。</div>' : "") +
      (dp.changed ? '<div class="row" style="margin-top:8px"><button class="pri tiny" data-action="codex-detach-apply">确认还原</button>' +
        (dp.backup_path ? '<span class="hint" style="margin:0">备份到 ' + esc(dp.backup_path) + '</span>' : "") + '</div>' : "") +
      "</div>";
  }

  return card("Codex 一键接入",
    "Codex 没有「自定义供应商」入口，只能改它的 config.toml。这里代你改，并且只动我们那一段。",
    body);
}

      '<span class="hint" style="margin:0">配置文件：' + esc(o.config_path || "（未记录）") + '</span></div>');
  html += chanCard();
  html += codexCard();
  var avail = o.available_models || [];
  var entAvail = entitledOf(avail);
  var sel = S.modelSel || {};
  var unentAvail = avail.filter(function(m){ return m.entitled === false; });
  var modelBody;
  if (!avail.length){
    modelBody = '<div class="empty">暂时没有可勾的模型：池里需要有健康账号，网关才能从上游拉到模型表。</div>';
  } else {
    // 按 producer 分组：两家的模型名可能重名（workbuddy 有 cn:glm-4.6，zcode 也有
    // glm-4.6），混在一张平表里看就分不清哪一行是谁家的能力。键用 m.key
    // （后端给：workbuddy = 裸 id，其余 = "<producer>:<裸 id>"），所以重名互不串台。
    var order = [], groups = {};
    avail.forEach(function(m){
      // 分组键带上 realm：workbuddy 底下 CN 版与 wba（国际版）的型号**不是同一批**
      // （wba 独有 gpt-6-astra / gemini-3.5-flash / grok-4.7 等），得分开列。
      var p = (m.producer || "workbuddy") + (m.realm ? "/" + m.realm : "");
      if (!groups[p]){ groups[p] = []; order.push(p); }
      groups[p].push(m);
    });
    var rows = order.map(function(pk){
      var g = groups[pk];
      var p = pk.split("/")[0];
      var realm = pk.split("/")[1] || "";
      var groupName = producerName(p) + (realm === "global" ? " · 国际版 wba" : "");
      // entitled === false：上游目录里有、但号池里没有任何号**有额度**跑它（zcode 周末
      // 活动只送 glm-5.3-flash，可上游 /models 照样列 11 个 GLM）。默认收进折叠区：
      // 「可用模型 N 个」数的是真有额度的那些，未授权的另标一个数，想看能展开。
      var ent = entitledOf(g);
      var unent = g.filter(function(m){ return m.entitled === false; });
      var head = '<div class="mgroup"><span><b>' + esc(groupName) + '</b> · 可用模型 ' +
        ent.length + ' 个' + (unent.length ? '<span class="tag mut" style="margin-left:6px">另有 ' +
        unent.length + ' 个未授权</span>' : "") +
        '</span><span class="hint" style="margin:0" data-gcount="' + esc(pk) + '">' +
        gcountText(ent, unent, sel) + '</span></div>';
      var rowOf = function(m){
        var bits = [];
        // 费率：优先后端给的后缀标签（与模型名尾巴上的一致），退化到 credits 原文。
        if (m.suffix) bits.push('<span class="tag ' + (m.suffix === "-free" ? "ok" : "warn") + '">' +
          esc(m.suffix.replace(/^-/, "")) + '</span>');
        else if (m.credits) bits.push('<span class="tag warn">' + esc(m.credits) + '</span>');
        if (m.is_default) bits.push('<span class="tag ok">默认</span>');
        var un = m.entitled === false;
        if (un) bits.push('<span class="tag mut">未授权</span>');
        var key = m.key || m.id;
        var on = !!sel[key];
        return '<label class="mrow' + (on ? "" : " off") + (un ? " unent" : "") + '">' +
          '<input type="checkbox" data-model="' + esc(key) + '"' + (on ? " checked" : "") + '>' +
          '<span class="mid mono">' + esc(m.full_id) + '</span>' +
          '<span class="mname hint">' + esc(m.name || "") + '</span>' +
          '<span class="mbits">' + bits.join("") + '</span></label>';
      };
      return head + ent.map(rowOf).join("") + unent.map(rowOf).join("");
    }).join("");
    modelBody =
      '<div class="row" style="margin-bottom:9px">' +
        '<button class="tiny" data-action="model-all">全选</button>' +
        '<button class="tiny" data-action="model-none">全不选</button>' +
        '<button class="tiny" data-action="model-default">只留默认</button>' +
        '<button class="tiny" data-action="model-reset">恢复为全部放开</button>' +
        '<label class="inlinechk" title="上游目录里有、号池任何号都没额度的模型（默认收起）">' +
          '<input type="checkbox" id="showUnent"' + (S.showUnent ? ' checked' : '') + '>显示未授权</label>' +
        '<label class="inlinechk" title="勾上：国内版与国际版（wba）各用一把开关，同名型号互不影响；取消：裸名字一把开关同时管两域（旧清单语义）">' +
          '<input type="checkbox" id="realmScoped"' + (S.realmScoped ? ' checked' : '') + '>国际版单独控制</label>' +
        '<span class="grow"></span>' +
        '<span class="hint" style="margin:0" id="mSelCount">' + gcountText(entAvail, unentAvail, sel) + '</span>' +
        '<button class="pri tiny" data-action="save-models">保存发布清单</button>' +
      '</div>' +
      '<div class="mlist' + (S.showUnent ? '' : ' hideunent') + '" id="mList">' + rows + '</div>' +
      '<div class="hint" style="margin-top:9px">勾上的才会出现在客户端的 <span class="mono">GET /v1/models</span> 里；' +
      '没勾的拿旧名字调也会被 <span class="mono">404 model_not_found</span> 挡回去（清单为空 = 全放）。' +
      '一个都不勾 = 全部放开（等于不过滤）。改完要点「保存发布清单」。<br>' +
      '没勾时 <span class="mono">/v1/models</span> 只列<b>号池真有额度</b>的模型（zcode 的上游目录是整家厂商的，' +
      '很多型号这个号的套餐并没有）；「未授权」那些勾上了才会发出去（明知会失败才勾）。<br>' +
      '<b>上游有什么</b>由账号自己决定（网关带账号 token 去上游拉，不读本机任何 agent 的配置）；' +
      '<b>对外发哪些</b>由你在这里勾。</div>';
  }
  var pt2 = (S.status && S.status.producer_totals) || [];
  var servable = pt2.filter(function(x){ return x.servable; });
  var readonly = pt2.filter(function(x){ return !x.servable; });
  var clientNote = servable.length
    ? "承接流量的客户端：" + servable.map(function(x){ return (x.name || producerName(x.producer)) + "（" + x.total + " 号）"; }).join("、")
    : "当前没有已接入上游反代的客户端，上游模型表拉不到。";
  if (readonly.length){
    clientNote += "；另有 " + readonly.map(function(x){ return (x.name || producerName(x.producer)) + "（" + x.total + " 号）"; }).join("、") + " 只可查看，不承接流量。";
  }
  html += card("模型发布清单（上游可勾 " + avail.length + " 个 · 当前对外 " + models.length + " 个）",
    "账号自己携带的模型能力由网关从上游拉取；默认全量放开，想收窄就在下面勾。" + clientNote,
    modelBody +
    '<div class="note" style="margin-top:10px">' +
    '<b>清单从哪来</b>：网关带账号自己的 token 去上游读模型目录（/v3/config 全量口径，按 id 去重），' +
    '不读本机任何 agent 的自定义模型——所以这里看到的都是<b>账号本身携带</b>的能力。<br>' +
    '<b>为什么是 44~45 个</b>：上游目录里的 cli 面（16 个）是它的子集，另外那些是 web/console 面的条目；' +
    '默认全量发布，不需要的在这里取消勾选即可（一个都不勾 = 全部放开）。<br>' +
    '<b>名字尾巴上的 -free / -x0.11</b>：就是费率档位落在模型名上的样子（免费 -free，收费按自身倍率 -x0.11）。' +
    '客户端拉到的模型名带这个尾巴，请求带回来网关会自动剥掉再路由，所以带不带都能调。<br>' +
    '<b>国际版（wba）为什么单列一组</b>：它的型号和国内版<b>不是同一批</b>（gpt-6-astra / ' +
    'gemini-3.5-flash / grok-4.7 等只有国际版有）。清单里国际版的键是 ' +
    '<span class="mono">global:&lt;裸 id&gt;</span>，与国内版同名的（fast-model、glm-5.3 等）各占一把开关；' +
    '工具栏「国际版单独控制」：勾上 = 两域各一把开关；取消勾选 = 裸名字同时管两域（旧清单兼容）。' +
    '它<b>切换即时生效</b>（直接写进配置，不用点保存、不用重启）——关掉它再勾一个 CN 型号，' +
    '国际版的同名型号会立刻跟着开。<br>' +
    '<b>zcode 段按套餐额度收敛</b>：zcode 的 /models 是<b>整家厂商的目录</b>（列了 11 个 GLM 型号），真正能调用的只有' +
    '该号<b>套餐覆盖</b>的那些（周末活动的号只有 glm-5.3-flash）——在「获取源 → switch 账本 → zcode 卡片 → 看候选 → 读全部额度」' +
    '里能看到每个号实际覆盖哪些。有额度的算「可用」，目录里其余标「未授权」并默认收起；对外 /v1/models 也不发未授权的' +
    '（列出去就等于承诺能调），要强行发就勾上那几条。' +
    '</div>');
  return html;
}
/* ---------- 请求统计（/v1/stats） ---------- */
function fmtInt(n){
  n = Number(n) || 0;
  return n.toLocaleString("en-US");
}
function fmtDur(ms){
  ms = Number(ms) || 0;
  if (ms <= 0) return "—";
  if (ms < 1000) return Math.round(ms) + " ms";
  return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + " s";
}
function fmtPct(x){
  if (x === null || x === undefined || isNaN(x)) return "—";
  return (Number(x) * 100).toFixed(1) + "%";
}
/* statRow 统计页用的一行：把 snapshot 的字段映射成中文标签。 */
function viewStats(){
  var html = head("请求统计", "本进程启动以来按模型累计的请求观测（重启清零）。数据源 /v1/stats。");
  var st = S.stats;
  if (!st) return html + card("正在读取", "", '<div class="empty">读取中…</div>');
  var t = st.total || {};
  var up = Number(st.uptime_sec) || 0;
  var upText = up >= 86400 ? (up/86400).toFixed(1) + " 天"
    : up >= 3600 ? (up/3600).toFixed(1) + " 小时"
    : up >= 60 ? Math.round(up/60) + " 分钟" : up + " 秒";
  html += '<div class="grid4">' +
    statBox("请求总数", fmtInt(t.requests), "成功 " + fmtInt(t.success) + " · 失败 " + fmtInt(t.failed)) +
    statBox("成功率", (t.requests ? fmtPct(t.success / t.requests) : "—"), "失败 " + fmtInt(t.failed) + " 次") +
    statBox("流式占比", (t.requests ? fmtPct(t.streaming / t.requests) : "—"), "流式 " + fmtInt(t.streaming) + " 次") +
    statBox("运行时长", upText, "统计起始 " + esc(fmtTime(st.since))) +
    '</div>';
  html += '<div class="grid4">' +
    statBox("首字延迟", fmtDur(t.avg_ttfb_ms), "平均 TTFB（流式首帧）") +
    statBox("端到端延迟", fmtDur(t.avg_latency_ms), "平均总耗时") +
    statBox("生成速度", (t.tokens_per_sec ? Number(t.tokens_per_sec).toFixed(1) + " tok/s" : "—"), "纯生成阶段吞吐") +
    statBox("缓存命中率", fmtPct(t.cache_hit_rate), "命中 " + fmtInt(t.cache_hit_tokens) + " / 未命中 " + fmtInt(t.cache_miss_tokens)) +
    '</div>';
  var models = (st.models || []).slice();
  if (!models.length){
    html += card("按模型", "", '<div class="empty">还没有请求观测。跑一次对话后回来刷新。</div>');
  } else {
    models.sort(function(a, b){ return (b.requests || 0) - (a.requests || 0); });
    var rows = models.map(function(m){
      var rate = m.credits || "";
      return '<tr>' +
        '<td><span class="mono">' + esc(m.model) + '</span></td>' +
        '<td class="num">' + fmtInt(m.requests) + '</td>' +
        '<td class="num">' + fmtInt(m.success) + '</td>' +
        '<td class="num">' + (m.failed ? '<span style="color:var(--danger)">' + fmtInt(m.failed) + '</span>' : "0") + '</td>' +
        '<td class="num">' + fmtDur(m.avg_ttfb_ms) + '</td>' +
        '<td class="num">' + fmtDur(m.avg_latency_ms) + '</td>' +
        '<td class="num">' + fmtInt(m.total_tokens) + '</td>' +
        '<td class="num">' + fmtPct(m.cache_hit_rate) + '</td>' +
        '<td>' + (rate ? '<span class="tag mut">' + esc(rate) + '</span>' : "—") + '</td>' +
        '<td class="hint" style="white-space:nowrap">' + esc(fmtTime(m.last_seen)) + '</td></tr>';
    }).join("");
    html += card("按模型（" + models.length + " 个）", "token 与缓存数来自上游 usage；缺观测的请求不计入均值分母。",
      '<div class="tablewrap"><table><thead><tr>' +
      '<th>模型</th><th class="num">请求</th><th class="num">成功</th><th class="num">失败</th>' +
      '<th class="num">TTFB</th><th class="num">延迟</th><th class="num">Tokens</th><th class="num">缓存命中</th>' +
      '<th>费率</th><th>最近</th></tr></thead><tbody>' + rows + '</tbody></table></div>');
  }
  html += card("token 总量", "",
    kv([
      ["提示词 tokens", fmtInt(t.prompt_tokens)],
      ["生成 tokens", fmtInt(t.completion_tokens)],
      ["合计 tokens", fmtInt(t.total_tokens)],
      ["缓存写入 tokens", fmtInt(t.cache_write_tokens)]
    ]));
  html += '<div class="row"><button class="tiny" data-action="stats-reset" ' +
    'title="清空本进程的累计统计，便于观察增量。不影响账号池与请求处理。">重置统计</button>' +
    '<span class="hint" style="margin:0">重置只清这份观测，网关照常跑。</span></div>';
  return html;
}

/* ---------- 运行态（/status 里未在别处展示的字段 + /admin/schedule + modeldead） ---------- */
function viewRuntime(){
  var st = S.status;
  var html = head("运行态", "网关内部状态：粘性会话、并发水位、成本探索、定时任务、死信模型。");
  if (!st) return html + card("正在读取", "", '<div class="empty">读取中…</div>');
  var sticky = st.sticky_sessions || 0;
  var redisMode = st.redis_mode || "noop";
  var ce = st.cost_explore || {};
  var inFull = st.in_flight_full || 0;
  var accounts = st.accounts || [];
  var inFlight = 0, breaker = 0, consecutive = 0;
  accounts.forEach(function(a){
    inFlight += (a.in_flight || 0);
    breaker += (a.breaker_fails || 0);
    consecutive += (a.consecutive_fails || 0);
  });
  html += '<div class="grid4">' +
    statBox("粘性会话", fmtInt(sticky), "同会话固定打同一个号") +
    statBox("在飞请求", fmtInt(inFlight), "全池当前占用") +
    statBox("并发占满", fmtInt(inFull), inFull ? "有账号已达在飞上限" : "未触顶") +
    statBox("会话存储", redisMode === "noop" ? "进程内存" : redisMode, redisMode === "noop" ? "未配 Upstash，重启即失效" : "Upstash Redis") +
    '</div>';
  html += '<div class="grid4">' +
    statBox("熔断计数合计", fmtInt(breaker), "各号熔断失败数之和") +
    statBox("连败计数合计", fmtInt(consecutive), "各号连续失败之和") +
    statBox("成本探索事件", fmtInt(ce.events_total), "选号用的探索采样次数") +
    statBox("模型死信", fmtInt(((S.modeldead && S.modeldead.entries) ? Object.keys(S.modeldead.entries).length : 0)), "上游判「无此模型」的负缓存") +
    '</div>';

  // 定时任务
  var sc = S.schedule;
  if (!sc){
    html += card("定时任务", "正在读取 config.json 的 schedule 段…", '<div class="empty">读取中…</div>');
  } else {
    var tasks = sc.tasks || [];
    var rows = tasks.map(function(t){
      var sw = '<button class="tiny" data-action="sched-toggle" data-key="' + esc(t.key) + '" data-next="' + (t.enabled ? "0" : "1") + '">' +
        (t.enabled ? '<span class="tag ok">已启用</span>' : '<span class="tag mut">已停用</span>') + '</button>';
      return '<tr class="' + (t.enabled ? "" : "dim") + '">' +
        '<td><b>' + esc(t.name) + '</b></td>' +
        '<td>' + sw + '</td>' +
        '<td class="num">' + ((t.hours && t.hours.length) ? t.hours.map(function(h){ return (h < 10 ? "0" : "") + h + ":00"; }).join(" / ") : "—") + '</td>' +
        '<td class="hint">' + esc(t.note || "") + (t.report_count ? ("（每号 " + t.report_count + " 条）") : "") + '</td></tr>';
    }).join("");
    var head2 = sc.readable
      ? (sc.explicit ? "来自 config.json 的 schedule 段" : "config.json 没有 schedule 段，显示内置默认")
      : "读不到 config.json：" + esc(sc.read_error || "");
    html += card("定时任务（" + tasks.filter(function(t){ return t.enabled; }).length + "/" + tasks.length + " 启用）", head2,
      '<div class="tablewrap"><table><thead><tr><th style="width:150px">任务</th><th style="width:110px">开关</th>' +
      '<th class="num" style="width:150px">触发整点</th><th>说明</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="hint" style="margin-top:9px">' + esc(sc.restart_note || "") + '<br>' + esc(sc.source_hint || "") +
      (sc.config_path ? ('<br>配置文件：<span class="mono">' + esc(sc.config_path) + '</span>') : "") + '</div>');
  }

  // 死信模型
  var md = (S.modeldead && S.modeldead.entries) || {};
  var mdKeys = Object.keys(md);
  if (mdKeys.length){
    var mdRows = mdKeys.map(function(k){
      var e = md[k] || {};
      return '<tr><td><span class="mono">' + esc(k) + '</span></td>' +
        '<td class="hint">' + esc(e.reason || "") + '</td>' +
        '<td class="hint" style="white-space:nowrap">' + esc(fmtTime(e.until)) + '</td></tr>';
    }).join("");
    html += card("模型死信台账（" + mdKeys.length + " 条）",
      "上游权威答复「无此模型」的负缓存，TTL 到期自动复测；误杀可手动清空。",
      '<div class="tablewrap"><table><thead><tr><th style="width:280px">键</th><th>原因</th><th style="width:150px">到期</th></tr></thead><tbody>' +
      mdRows + '</tbody></table></div>' +
      '<div class="row" style="margin-top:11px"><button class="tiny" data-action="modeldead-clear">清空死信台账</button>' +
      '<span class="hint" style="margin:0">清掉后这些模型立刻重新参与路由。</span></div>');
  } else {
    html += card("模型死信台账", "没有死信：上游目录里的模型都还能正常路由。", "");
  }
  return html;
}

/* ---------- 数据加载 ---------- */
async function loadHealth(){
  try { S.health = await api("/healthz"); } catch (e) { S.health = null; }

  updateSvcDot();
}
/* loadStatus 拉一次 /status，并回答「跟上一次比有没有变化」——后台 30s 轮询据此决定
   要不要重画：没变就一个 DOM 都不动（不打断滚动、输入与勾选）。 */
async function loadStatus(){
  var prev = S.status ? JSON.stringify(S.status) : "";
  try { S.status = await api("/status"); } catch (e) { S.status = null; }
  return (S.status ? JSON.stringify(S.status) : "") !== prev;
}
async function loadSources(){ try { S.src = await api("/admin/sources"); } catch (e) { S.src = null; } }
async function loadOrigins(){ try { S.origins = await api("/admin/sources/origins"); } catch (e) { S.origins = null; } }
async function loadOutput(){
  try { S.out = await api("/admin/output"); } catch (e) { S.out = null; }
  try { S.codex = await api("/admin/codex"); } catch (e) { S.codex = null; }
  // 域作用域：新清单（国际版用 global:<裸 id> 自己的键）默认「分开控制」。旧存档没标过
  // 这个键也按勾上显示——面板里国际版该开的行会显示成已勾（后端按旧语义算的 selected），
  // 保存后集合不变，只是从此两域各一把开关。用户取消勾选即回到「裸名字同时管两域」。
  var ocfg = (S.out && S.out.output) || {};
  S.realmScoped = (ocfg.models_realm_scoped !== false);
  initModelSel();
}
/* initModelSel 用服务端回显的 available_models 铺一次勾选草稿。
   只在草稿为空时铺（S.modelSel=null）；用户改动过就不覆盖，避免刷新把手上勾选冲掉。 */
function initModelSel(){
  if (S.modelSel) return;
  var avail = (S.out && S.out.available_models) || [];
  var sel = {};
  avail.forEach(function(m){ sel[m.key || m.id] = !!m.selected; });
  S.modelSel = sel;
}
async function loadModels(){
  try { var r = await api("/v1/models"); S.models = (r && r.data) || []; }
  catch (e) { S.models = []; }
}
async function loadStats(){
  try { S.stats = await api("/v1/stats"); } catch (e) { S.stats = null; }
}
/* loadRuntime 拉运行态页需要的三份数据：定时任务、死信台账、以及最新的 /status
   （粘性/在飞等字段在 status 里）。三份并行，任一失败不拖累其余。 */
async function loadRuntime(){
  var jobs = [
    api("/admin/schedule").then(function(r){ S.schedule = r; }, function(){ S.schedule = null; }),
    api("/admin/modeldead").then(function(r){ S.modeldead = r; }, function(){ S.modeldead = null; }),
    loadStatus()
  ];
  await Promise.all(jobs);
}
/* refreshAll 是**唯一**的刷新入口（右上角那个按钮）：状态、来源台账、输出清单、
   模型表、上游余额一次拉齐；候选面板开着就顺手重拉一次（保留已勾选与探活/额度标记，
   不会把用户手上的选择冲掉）。余额后端是「先回旧值 + 后台重查」，所以不拖慢这一轮。 */
/* srcRefresh 「获取源」页的刷新：重扫本机路径 + 重读来源台账，再整页重画。
   与右上角全局刷新的区别是它**只做取源相关的两件事**并给一条明确反馈——
   用户点「刷新」的预期是「刚登录的号 / 刚导出的账本要出现」，不该被余额、统计等
   无关请求拖时间，也不该静默到让人以为没反应。候选面板开着时一并重拉（不带探活）。 */
async function srcRefresh(){
  if (S.busy){ toast("info", "上一个操作还在进行", 2200); return; }
  S.busy = true;
  try {
    await Promise.all([loadSources(), loadOrigins()]);
    if (S.candKind){ await reloadCands(false, false, true); }
    render();
    var d = S.src || {};
    var n = (d.kinds || []).filter(function(k){ return k.available; }).length;
    toast("ok", "已重新扫描本机来源（可用 " + n + " 个）", 2600);
  } catch (e) { toast("err", e.message || String(e), 9000); }
  finally { S.busy = false; }
}
async function refreshAll(silent){
  var first = !S.status;
  var err = null;
  var jobs = [
    loadStatus(), loadSources(), loadOrigins(), loadOutput(), loadModels(), loadHealth(),
    loadCredits(!first)
  ];
  if (S.stats) jobs.push(loadStats());
  if (S.schedule || S.modeldead) jobs.push(loadRuntime());
  // 候选面板开着就顺手重拉——但只在**没探过活/读过额度**时做：
  // 那两个动作每个号一次外网往返，全局刷新不该把它们偷偷重跑一遍。
  if (S.candKind && S.srcTab === "switch" && !S.candProbe && !S.candBalance){
    jobs.push(reloadCands(false, false, true));
  }
  await Promise.all(jobs);
  if (!S.src && first) err = "管理端点没起来：确认 config.json 里 admin.enabled=true，且网关已重启。";
  render();
  if (err) toast("err", err, 9000);
  else if (!silent){
    var st = S.status || {};
    var acc = (st.total ? (st.healthy + " / " + st.total) : "?");
    var mc = (S.models && S.models.length) ? (" · 对外模型 " + S.models.length) : "";
    toast("ok", "已刷新 · 可用账号 " + acc + mc, 2000);
  }
}
/* ---------- 动作 ---------- */
function checkedIDs(){
  return Object.keys(S.checked).filter(function(k){ return S.checked[k]; });
}
async function doImport(kind, ids, text, method, detail){
  if (S.busy){ toast("info", "上一个导入还在进行", 2000); return; }
  S.busy = true;
  try {
    var body = { kind: kind };
    if (ids && ids.length) body.ids = ids;
    if (text) body.text = text;
    if (method) body.method = method;
    if (detail) body.detail = detail;
    var r = await api("/admin/sources/import", { method: "POST", body: body });
    var res = (r && r.result) || {};
    var n = (res.imported || []).length, sk = (res.skipped || []).length;
    var errs = res.errors || [];
    if (errs.length) toast("err", "导入有错误：" + errs.slice(0, 2).join("；"), 9000);
    toast(n ? "ok" : "info", "导入 " + n + " 个 · 跳过 " + sk + " 个 · 池里现有 " + ((r && r.pool && r.pool.total) || 0) + " 个账号", 4200);
    S.cand = null; S.checked = {};
    await refreshAll(true);
  } catch (e) {
    toast("err", e.message, 9000);
  } finally {
    S.busy = false;
  }
}
async function openCands(kind, opt){
  S.tab = "sources";
  // 候选面板挂在它所属的「来源」tab 下：账本类在 switch，OpenCode 在应用内登录态。
  S.srcTab = (kind === "opencode") ? "app" : "switch";
  S.checked = {};
  var o = opt || {};
  S.candProbe = !!o.probe; S.candBalance = !!o.balance;
  try {
    var r = await api("/admin/sources/" + kind + "/candidates" + candQuery(o.probe, o.balance));
    S.cand = (r && r.candidates) || [];
    S.candKind = kind;
    S.candNote = (r && r.note) || "";
    S.cand.forEach(function(x){ if (!x.imported) S.checked[x.id] = false; });
    render();
  } catch (e) { toast("err", e.message, 9000); }
}
/* candQuery 拼候选列表的查询串：探活/读额度都是可选动作，默认一个都不带。 */
function candQuery(probe, balance){
  var q = [];
  if (probe) q.push("probe=1");
  if (balance) q.push("balance=1");
  return q.length ? "?" + q.join("&") : "";
}
/* reloadCands 就地重拉候选（探活/读额度用）：保留已勾选状态，只换数据。
   探活是每号一次外网往返，所以按钮点下去会等一会儿；这里先提示再请求。 */
async function reloadCands(probe, balance, silent){
  if (S.busy){ if (!silent) toast("info", "上一个操作还在进行", 2200); return; }
  S.busy = true;
  var keep = S.checked || {};
  // 探活 / 读额度是「累加」的：已经探过的号不该因为随后读额度又被清空。
  var wantProbe = !!probe || !!S.candProbe;
  var wantBalance = !!balance || !!S.candBalance;
  if (!silent){
    if (probe) toast("info", "正在逐号探活（每号一次外网往返，稍等）…", 2400);
    else if (balance) toast("info", "正在读额度…", 2400);
  }
  try {
    var r = await api("/admin/sources/" + S.candKind + "/candidates" + candQuery(wantProbe, wantBalance));
    S.cand = (r && r.candidates) || [];
    S.candNote = (r && r.note) || "";
    S.candProbe = wantProbe;
    S.candBalance = wantBalance;
    S.checked = {};
    S.cand.forEach(function(x){ if (!x.imported) S.checked[x.id] = !!keep[x.id]; });
    render();
    if (!silent) toast("ok", probe ? "探活完成" : "额度已读取", 2600);
  } catch (e) { toast("err", e.message, 12000); }
  finally { S.busy = false; }
}
function doPaste(){

async function saveOutput(){

    } });

/* setModelSel 用谓词重铺勾选草稿（全选/全不选/只留默认共用一套）。 */
function setModelSel(fn){
  var avail = (S.out && S.out.available_models) || [];
  var sel = {};
  // 未授权的行不参与「全选/只留默认」：它们是目录残留，不是这个号池的能力。
  avail.forEach(function(m){ sel[m.key || m.id] = (m.entitled === false) ? false : !!fn(m); });
  S.modelSel = sel;
  S.modelDirty = true; // 用户动过草稿：热切换「国际版单独控制」时别用服务端回显把它冲掉
  render();
}
/* entitledOf 只留「号池真的有额度」的模型（后端 entitled 字段；缺省视为有额度）。
   计数与「全选」都按它走：未授权的行看得见、能勾，但不该混进默认口径。 */
function entitledOf(list){
  return (list || []).filter(function(m){ return m.entitled !== false; });
}
/* gcountText 一组模型的「已勾」文案。分母只数真有额度的（可用模型 N 个那个口径）；
   未授权那些勾上了单独报一个数——它们不在分母里，不单独说就看不见自己勾了什么。 */
function gcountText(ent, unent, sel){
  var gsel = (ent || []).filter(function(m){ return sel[m.key || m.id]; }).length;
  var usel = (unent || []).filter(function(m){ return sel[m.key || m.id]; }).length;
  return "已勾 " + gsel + " / " + (ent || []).length + (usel ? " · 另勾 " + usel + " 未授权" : "");
}
/* updModelCount 勾选数就地更新（不整页重渲染，避免滚动位置被冲掉）：
   顶部总计数 + 每个分组表头那行「已勾 x / y」一起刷。 */
function updModelCount(){
  var avail = (S.out && S.out.available_models) || [];
  var sel = S.modelSel || {};
  var unentOf = function(list){ return list.filter(function(m){ return m.entitled === false; }); };
  var el = $("#mSelCount");
  if (el) el.textContent = gcountText(entitledOf(avail), unentOf(avail), sel);
  // 分组表头用 render() 同一套键（producer + realm）重算，别让表头停在旧数字上。
  var groups = {};
  avail.forEach(function(m){
    var k = (m.producer || "workbuddy") + (m.realm ? "/" + m.realm : "");
    (groups[k] = groups[k] || []).push(m);
  });
  $$("[data-gcount]").forEach(function(node){
    var g = groups[node.getAttribute("data-gcount")] || [];
    node.textContent = gcountText(entitledOf(g), unentOf(g), sel);
  });
}
/* saveModels 保存发布清单：只发勾上的裸 id；一个都没勾 = 全部放开（后端按空名单处理）。 */
async function saveModels(){
  var avail = (S.out && S.out.available_models) || [];
  if (!avail.length){
    toast("info", "上游还没拉到模型表，先别保存（会把清单清空）", 5000);
    return;
  }
  var sel = S.modelSel || {};
  var ids = avail.filter(function(m){ return sel[m.key || m.id]; }).map(function(m){ return m.key || m.id; });
  // 全勾 = 等价于不过滤，先确认一次（手滑点「全选」就会变成放开全部）。
  var entCount = entitledOf(avail).length;
  if (entCount > 0 && draftSelCount() === entCount && !confirmAllOpen()) return;
  try {
    var res = await api("/admin/output", { method: "PUT", body: { models: ids, models_realm_scoped: !!S.realmScoped } });
    S.out = res; S.modelSel = null; S.modelDirty = false; initModelSel();
    toast("ok", ids.length ? ("已发布 " + ids.length + " 个模型") : "已恢复全部放开（不再过滤）", 4200);
    await refreshAll(true);
  } catch (e) { toast("err", e.message, 9000); }
}
function draftSelCount(){
  var ent = entitledOf(S.out && S.out.available_models);
  var sel = S.modelSel || {};
  return ent.filter(function(m){ return sel[m.key || m.id]; }).length;
}
/* confirmAllOpen 全勾 = 等价于不过滤，提醒一句（用户可能只是手滑点了全选）。 */
function confirmAllOpen(){
  return window.confirm("全部勾上 = 不过滤，等价于「恢复为全部放开」。确定这样保存吗？");
}
/* applyRealmScoped 「国际版单独控制」热生效。它只改白名单的键语义——裸 id 是否连带管
   国际版（wba）的同名型号（见 publishAllows）——后端读的是同一份配置，所以写进去立刻生效：
   不用重启，也不用点「保存发布清单」。勾选草稿不动（用户动过就原样留着；没动过就按服务端
   新口径重铺一次，让国际版那几行如实回显）。 */
async function applyRealmScoped(){
  try {
    var res = await api("/admin/output", { method: "PUT", body: { models_realm_scoped: !!S.realmScoped } });
    S.out = res;
    if (!S.modelDirty){ S.modelSel = null; }
    initModelSel();
    render();
    toast("ok", S.realmScoped
      ? "国际版单独控制：已开启——CN 与国际版各用一把开关，同名型号互不影响"
      : "国际版单独控制：已关闭——裸名字一把开关，同时管 CN 与国际版的同名型号", 5600);
  } catch (e) { toast("err", e.message, 9000); }
}
/* resetModels 一键清空白名单：恢复成「上游有什么就发什么」。 */
async function resetModels(){
  try {
    var res = await api("/admin/output", { method: "PUT", body: { models: [], models_realm_scoped: !!S.realmScoped } });
    S.out = res; S.modelSel = null; S.modelDirty = false; initModelSel();
    toast("ok", "已恢复全部放开：上游拉到的模型全部对外发布", 4200);
    await refreshAll(true);
  } catch (e) { toast("err", e.message, 9000); }
}
/* ---------- 出口动作 ---------- */
function chanNextId(list){
  var used = {};
  list.forEach(function(c){ used[c.id] = 1; });
  for (var i = 1; i < 999; i++){ var id = "ch" + i; if (!used[id]) return id; }
  return "ch" + Date.now();
}
function chanNextPort(list){
  var used = {};
  list.forEach(function(c){ var m = /:(\d+)$/.exec(c.listen || ""); if (m) used[Number(m[1])] = 1; });
  for (var p = 7870; p < 7970; p++){ if (!used[p]) return p; }
  return 7870;
}
async function chanAdd(){
  var list = (chanReadDom(chanDraftList()) || chanDraftList()).slice();
  // 默认不写 format/rate_hint：留空 = 继承主口，避免新出口一出生就带一份冗余配置。
  list.push({ id: chanNextId(list), name: "", listen: "127.0.0.1:" + chanNextPort(list),
    format: "", model_prefix: "", rate_hint: "", producers: [], models: [] });
  S.chanDraft = list; render();
}
function chanDel(i){
  var list = (chanReadDom(chanDraftList()) || chanDraftList()).slice();
  list.splice(Number(i), 1);
  S.chanDraft = list; render();
}
async function chanSave(){
  var list = chanReadDom(chanDraftList());
  if (!list){ toast("info", "还没有出口可保存"); return; }
  // 与主口取值相同的字段 = 用户并没有想单独覆盖它，归一化成空串交给后端按「继承主口」处理。
  // 否则配置里会躺着一份和主口一模一样的显式值，看着像每个出口都在重复配置。
  var base = (S.out && S.out.output) || {};
  list = list.map(function(c){
    var x = { id: c.id, name: c.name, listen: c.listen, producers: c.producers };
    if (c.format && c.format !== (base.format || "openai")) x.format = c.format;
    if (c.model_prefix && c.model_prefix !== (base.model_prefix || "")) x.model_prefix = c.model_prefix;
    if (c.rate_hint && c.rate_hint !== (base.rate_hint || "credit")) x.rate_hint = c.rate_hint;
    // 发布清单：空 = 继承主口；只在真的不一样时才写进去（后端也会再折一次）。
    if (c.models && c.models.length) x.models = c.models;
    return x;
  });
  var err = null, seenId = {}, seenListen = {};
  list.forEach(function(c, i){
    var no = i + 1;
    if (!c.id) err = err || ("第 " + no + " 个出口的 id 不能为空");
    else if (!/^[a-z0-9][a-z0-9_-]*$/.test(c.id)) err = err || ("出口 id「" + c.id + "」只能用小写字母/数字/-/_，且以字母数字开头");
    else if (seenId[c.id]) err = err || ("出口 id 重复了：" + c.id);
    else if (!c.listen) err = err || ("出口「" + c.id + "」的监听端口不能为空");
    else if (seenListen[c.listen]) err = err || ("出口监听地址重复了：" + c.listen);
    seenId[c.id] = 1; seenListen[c.listen] = 1;
  });
  if (err){ toast("err", err, 7000); return; }
  try {
    var res = await api("/admin/output", { method: "PUT", body: { channels: list } });
    S.out = res; S.chanDraft = null;
    var bad = ((res && res.channel_status) || []).filter(function(x){ return !x.running; });
    if (bad.length){
      toast("err", "有出口没起来：" + bad.map(function(x){ return x.id + "（" + (x.error || "端口不可用") + "）"; }).join("；"), 9000);
    } else {
      toast("ok", list.length ? ("已保存 " + list.length + " 个出口，立即生效") : "已清空出口：全部走主口", 4200);
    }
    await refreshAll(true);
  } catch (e) { toast("err", e.message, 9000); }
}
/* statsReset 清空本进程累计统计（观测，不影响路由）。 */
async function statsReset(){
  try {
    await api("/v1/stats/reset", { method: "POST", body: {} });
    await loadStats();
    render();
    toast("ok", "已重置请求统计", 2400);
  } catch (e) { toast("err", e.message, 9000); }
}
/* schedToggle 切换某个定时任务的启用开关（写回 config.json，重启生效）。 */
async function schedToggle(key, next){
  try {
    var r = await api("/admin/schedule", { method: "POST", body: { key: key, enabled: !!next } });
    S.schedule = r;
    render();
    toast("ok", "已" + (next ? "启用" : "停用") + "该任务，重启网关后生效", 4600);
  } catch (e) { toast("err", e.message, 9000); }
}
/* modeldeadClear 清空模型死信台账（误杀兜底）。 */
async function modeldeadClear(){
  try {
    var r = await api("/admin/modeldead", { method: "DELETE" });
    toast("ok", "已清空死信台账（" + ((r && r.cleared) || 0) + " 条）", 3200);
    await loadRuntime();
    render();
  } catch (e) { toast("err", e.message, 9000); }
}
/* codexDetachPreview / codexDetachApply 还原 Codex 官方默认。 */
async function codexDetachPreview(){
  try {
    S.codexDetachPlan = await api("/admin/codex/detach", { method: "POST", body: { apply: false } });
    render();
  } catch (e) { toast("err", e.message, 9000); }
}
async function codexDetachApply(){
  try {
    var r = await api("/admin/codex/detach", { method: "POST", body: { apply: true } });
    S.codexDetachPlan = r.plan || null;
    await loadOutput();
    render();
    toast("ok", (r && r.message) || "已还原官方默认", 5200);
  } catch (e) { toast("err", e.message, 9000); }
}
/* resetCooldowns 清空池内冷却/熔断/连败计数（停用与手工禁用不动）。 */
async function resetCooldowns(){
  try {
    var r = await api("/admin/accounts/reset", { method: "POST", body: {} });
    toast("ok", (r && r.message) || "已清空冷却与失败计数", 5200);
    await refreshAll(true);
  } catch (e) { toast("err", e.message, 9000); }
}
async function acctOp(uid, op){
  try {
    await api("/admin/accounts/" + encodeURIComponent(uid) + "/" + op, { method: "POST", body: {} });
    toast("ok", (op === "disable" ? "已停用" : op === "enable" ? "已启用" : "已复活") + "：" + uid, 2600);
    await loadStatus(); await loadHealth();
  } catch (e) { toast("err", e.message, 9000); }
}
function copyText(t){
  if (!t) return;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast("ok", "已复制：" + t, 1600); },
      function(){ toast("info", t, 6000); });
  } else { toast("info", t, 6000); }
}
/* ---------- 事件 ---------- */
async function actOn(t){
  if (t.hasAttribute("data-copy") && !t.hasAttribute("data-action")){ copyText(t.getAttribute("data-copy")); return; }
  var act = t.getAttribute("data-action");
  if (act){
    if (act === "cands") return openCands(t.getAttribute("data-kind"));
    if (act === "quick"){
      var qk = t.getAttribute("data-kind") || "wb-switch";
      if (qk === "zcode-switch") return doImport("zcode-switch", null, null, "switch", "zcode-switch 账本");
      if (qk === "opencode") return doImport("opencode", null, null, "app", "opencode auth.json");
      return doImport("wb-switch", null, null, "switch", "wb-switch 账本");
    }
    if (act === "src-refresh") return srcRefresh();
    if (act === "import-paste") return doPaste();
    if (act === "pick-file"){ var fp = $("#filePick"); if (fp) fp.click(); return; }
    if (act === "cand-all"){ (S.cand || []).forEach(function(x){ if (!x.imported) S.checked[x.id] = true; }); return render(); }
    if (act === "cand-none"){ S.checked = {}; return render(); }
    if (act === "cand-import"){
      // 两种账本都是「来源 = switch」；粘贴导入（candKind 非账本）才是 file。
      var meth = (S.candKind === "wb-switch" || S.candKind === "zcode-switch") ? "switch"
        : (S.candKind === "opencode" ? "app" : "file");
      return doImport(S.candKind, checkedIDs(), null, meth, S.candKind);
    }
    if (act === "zcode-probe") return reloadCands(true, false);
    if (act === "zcode-balance") return reloadCands(false, true);
    if (act === "cand-close"){ S.cand = null; return render(); }
    if (act === "acct") return acctOp(t.getAttribute("data-uid"), t.getAttribute("data-op"));
    if (act === "save-out") return saveOutput();
    if (act === "codex-preview") return codexPreview();
    if (act === "codex-apply") return codexApply();
    if (act === "save-models") return saveModels();
    if (act === "model-all") return setModelSel(function(){ return true; });
    if (act === "model-none") return setModelSel(function(){ return false; });
    if (act === "model-default") return setModelSel(function(m){ return !!m.is_default; });
    if (act === "model-reset") return resetModels();
    if (act === "credits-refresh") return loadCredits(true);
    if (act === "reset-cooldowns") return resetCooldowns();
    if (act === "stats-reset") return statsReset();
    if (act === "sched-toggle") return schedToggle(t.getAttribute("data-key"), t.getAttribute("data-next") === "1");
    if (act === "modeldead-clear") return modeldeadClear();
    if (act === "codex-detach-preview") return codexDetachPreview();
    if (act === "codex-detach-apply") return codexDetachApply();
    if (act === "chan-add") return chanAdd();
    if (act === "chan-del") return chanDel(t.getAttribute("data-i"));
    if (act === "chan-model-all") return chanModelToggle(t.getAttribute("data-i"), function(){ return true; });
    if (act === "chan-model-none") return chanModelToggle(t.getAttribute("data-i"), function(){ return false; });
    if (act === "chan-model-inherit") return chanModelToggle(t.getAttribute("data-i"),
      function(cb){ return cb.hasAttribute("data-cmi"); });
    if (act === "chan-save") return chanSave();
    return;
  }
  if (t.hasAttribute("data-filter")){ S.poolFilter = t.getAttribute("data-filter"); return render(); }
  if (t.hasAttribute("data-pclient")){
    S.poolClient = t.getAttribute("data-pclient");
    // 切客户端时把域筛选归位：新客户端不分区、或没显式传域，就回「全部」——
    // 否则会留下一个看不见却仍在生效的域筛选。
    if (t.hasAttribute("data-prealm")) S.poolRealm = t.getAttribute("data-prealm");
    else if (S.poolClient === "all" || producerRealms(S.poolClient).length < 2) S.poolRealm = "all";
    if (t.hasAttribute("data-goto")) return go("pool");
    return render();
  }
  if (t.hasAttribute("data-prealm")){ S.poolRealm = t.getAttribute("data-prealm"); return render(); }
  if (t.hasAttribute("data-srctab")){
    var m = t.getAttribute("data-srctab");
    if (t.hasAttribute("data-goto")) return go("sources", { srcTab: m });
    S.srcTab = m; S.cand = null; return render();
  }
  if (t.hasAttribute("data-goto")) return go(t.getAttribute("data-goto"));
}
function bind(){
  // <details> 的 toggle 不冒泡，只能捕获阶段接：记住出口折叠区的开合，render() 之后不丢。
document.addEventListener("toggle", function(ev){
  var t = ev.target;
  if (t && t.classList && t.classList.contains("chan-adv")){
    var id = t.getAttribute("data-cadv") || "";
    if (id){ S.chanOpen[id] = !!t.open; }
  }
}, true);
document.addEventListener("click", function(ev){
    var e = ev.target;
    var t = (e && e.closest) ? e.closest("[data-goto],[data-srctab],[data-filter],[data-pclient],[data-prealm],[data-action],[data-copy]") : null;
    if (t) actOn(t);
  });
  $("#view").addEventListener("change", function(ev){
    var t = ev.target;
    if (!t) return;
    if (t.hasAttribute && t.hasAttribute("data-cand")){
      S.checked[t.getAttribute("data-cand")] = !!t.checked;
      render();
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-ckp")){
      var lb = t.closest ? t.closest(".ptog") : null;
      if (lb) lb.classList.toggle("on", !!t.checked);
      // 改「服务来源」= 改了这个口的候选模型集合：立刻重画一次，让发布清单跟着换到
      // 新范围（render 前会先把当前 DOM 收进草稿，其它没保存的输入不会丢）。
      var crow = t.closest ? t.closest("[data-chan-row]") : null;
      if (crow){ S.chanDraft = chanReadDom(chanDraftList()) || S.chanDraft; render(); }
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-cmk")){
      var mr = t.closest ? t.closest(".mrow") : null;
      if (mr) mr.classList.toggle("off", !t.checked);
      updChanRow(t.getAttribute("data-cmk"));
      return;
    }
    var cw = (t.closest ? t.closest("[data-chan-row]") : null);
    if (cw){ updChanRow(cw.getAttribute("data-chan-row")); }
    if (t.id === "realmScoped"){ S.realmScoped = !!t.checked; applyRealmScoped(); return; }
    if (t.id === "showUnent"){
      var ml = $("#mList");
      if (ml) ml.classList.toggle("hideunent", !t.checked);
      S.showUnent = !!t.checked; // 记住：重画/保存后别自己收回去
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-model")){
      if (!S.modelSel) initModelSel();
      S.modelSel[t.getAttribute("data-model")] = !!t.checked;
      S.modelDirty = true;
      var row = t.closest ? t.closest(".mrow") : null;
      if (row) row.classList.toggle("off", !t.checked);
      updModelCount();
      return;
    }
    if (t.id === "filePick" && t.files && t.files[0]){
      var f = t.files[0], rd = new FileReader();
      rd.onload = function(){
        var box = $("#pasteBox");
        if (box) box.value = String(rd.result || "");
        toast("ok", "已读入 " + f.name + "，确认来源后点「导入到号池」", 4200);
      };
      rd.readAsText(f);
    }
  });
  $("#btnKey").addEventListener("click", function(){
    var p = $("#keyPop");
    p.classList.toggle("hidden");
    if (!p.classList.contains("hidden")) $("#keyInput").value = S.apiKey || "";
  });
  $("#btnKeyClose").addEventListener("click", function(){ $("#keyPop").classList.add("hidden"); });
  $("#btnKeySave").addEventListener("click", function(){
    S.apiKey = ($("#keyInput").value || "").trim();
    if (S.apiKey) localStorage.setItem("wb_key", S.apiKey); else localStorage.removeItem("wb_key");
    $("#keyPop").classList.add("hidden");
    toast("ok", S.apiKey ? "密钥已保存到本机浏览器" : "已清空密钥（本机直连免密钥）", 2600);
    refreshAll(true);
  });
  $("#btnRefresh").addEventListener("click", async function(){
    var b = $("#btnRefresh");
    b.classList.add("spin");
    await refreshAll(false);
    b.classList.remove("spin");
  });
}
/* ---------- 启动 ---------- */
(async function boot(){
  $("#btnKey").innerHTML = svg("key");
  $("#btnRefresh").innerHTML = svg("refresh");
  bind();
  renderNav();
  render();
  await refreshAll(true);
  // 网关刚重启时模型池要几秒才从上游拉回来，这一轮会拿到空表，
  // 界面就停在「当前对外 0 个」不再自愈。补一次延迟重试（仅在上一次确实为空时）。
  if (!S.models || !S.models.length){
    setTimeout(function(){ loadModels().then(function(){ render(); }); }, 2500);
  }
  setInterval(function(){ loadHealth(); }, 15000);
  setInterval(function(){ loadStatus().then(function(changed){ if (changed) render(); }); }, 30000);
})();
</script>
