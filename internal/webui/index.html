/* fmtName 输出格式 id → 展示名：以前端只读后端注册表（S.out.formats），
   不在前端另写一份枚举——加协议时后端改一处，页面自动跟着变。 */
function fmtName(id){
  var f = ((S.out && S.out.formats) || []).filter(function(x){ return x.id === id; })[0];
  return f ? f.name : (id || "openai");
}
/* fmtHintAll 输出格式下拉里「现在能选」和「还没接」各有哪几个——写在说明里，
   不打开下拉也能一眼看到（以前只显示当前这一种，容易被误读成「只有一种」）。 */
function fmtHintAll(){
  var list = (S.out && S.out.formats) || [];
  var yes = list.filter(function(f){ return f.available; }).map(function(f){ return f.name; });
  var no = list.filter(function(f){ return !f.available; }).map(function(f){ return f.name; });
  var t = "可选协议：" + (yes.join("、") || "（无）");
  if (no.length) t += "；未接入：" + no.join("、");
  return "<br>" + esc(t);
}
function rateOptions(sel, inheritLabel){
  var head = "";
  if (inheritLabel){
    head = '<option value=""' + (sel ? "" : " selected") + '>' + esc(inheritLabel) + '</option>';
  }
  return head + (S.out.rate_hints || []).map(function(h){
    return '<option value="' + esc(h.id) + '"' + (sel === h.id ? " selected" : "") + '>' + esc(h.name) + '</option>';
  }).join("");
}
/* rateName 费率后缀 id → 展示名：同样只读后端注册表，前端不另写枚举。 */
function rateName(id){
  var h = ((S.out && S.out.rate_hints) || []).filter(function(x){ return x.id === id; })[0];
  return h ? h.name : (id || "credit");
}
/* producerChoices 可选「服务来源」：池里出现过的客户端 + 已知的两家（保证空池也能配）。 */
function producerChoices(){
  var list = (S.status && S.status.producer_totals) || [];
  var seen = {}, out = [];
  list.forEach(function(x){
    var p = x.producer || "";
    if (p && !seen[p]){ seen[p] = 1; out.push({ id: p, name: x.name || producerName(p) }); }
  });
  ["workbuddy", "zcode"].forEach(function(p){
    if (!seen[p]){ seen[p] = 1; out.push({ id: p, name: PRODUCER_FALLBACK[p] || p }); }
  });
  return out;
}
/* chanServerList 服务端当前保存的出口配置（草稿为空时用它渲染）。
   历史配置里可能存着一份「和主口取值完全相同」的显式字段——那其实等于没覆盖，
   这里统一折成空串（= 继承），免得面板把它们显示成「单独覆盖」。 */
function chanServerList(){
  var base = (S.out && S.out.output) || {};
  return ((S.out && S.out.channels) || []).map(function(c){
    return { id: c.id || "", name: c.name || "", listen: c.listen || "",
      format: (c.format && c.format !== (base.format || "openai")) ? c.format : "",
      model_prefix: (c.model_prefix && c.model_prefix !== (base.model_prefix || "")) ? c.model_prefix : "",
      rate_hint: (c.rate_hint && c.rate_hint !== (base.rate_hint || "credit")) ? c.rate_hint : "",
      producers: (c.producers || []).slice(), models: (c.models || []).slice() };
  });
}
function chanDraftList(){ return S.chanDraft ? S.chanDraft : chanServerList(); }
/* captureChanDraft 把输出页上正在编辑的出口收进草稿。与服务器现状完全一致就不记：
   把「没改过」也标成草稿会挡住之后的服务端变化（比如另开一个页签改了配置）。 */
function captureChanDraft(){
  var d = chanReadDom(chanDraftList());
  if (!d) return;
  if (sameChanList(d, chanServerList())) return;
  S.chanDraft = d;
}
/* sameChanList 两份出口列表是否等价（集合语义比较：producers/models 排序后比）。 */
function sameChanList(a, b){
  if (!a || !b || a.length !== b.length) return false;
  var norm = function(x){
    return [x.id || "", x.name || "", x.listen || "", x.format || "", x.model_prefix || "",
      x.rate_hint || "", (x.producers || []).slice().sort().join(","),
      (x.models || []).slice().sort().join(",")].join("\u0000");
  };
  for (var i = 0; i < a.length; i++){ if (norm(a[i]) !== norm(b[i])) return false; }
  return true;
}
/* chanReadDom 把页面上正在编辑的出口读回来（DOM 是真值来源，避免每敲一个字就重渲染）。
   prev 是上一版列表：模型表还没拉到、勾选列表压根没渲染时，沿用它原来的名单——
   「渲染不出来」不等于「用户清空了」。 */
function chanReadDom(prev){
  var rows = $$("[data-chan-row]");
  if (!rows.length) return null;
  prev = prev || [];
  return rows.map(function(row){
    var idx = row.getAttribute("data-chan-row");
    var cur = prev[Number(idx)] || {};
    var g = function(k){ var el = row.querySelector('[data-ck="' + k + '"]'); return el ? el.value : ""; };
    var producers = $$('[data-ckp="' + idx + '"]', row).filter(function(cb){ return cb.checked; })
      .map(function(cb){ return cb.getAttribute("data-ckv"); });
    // 发布清单：勾选结果与「继承主口」完全一致 = 用户并没有单独筛，折成空名单（= 继承）。
    // 这条与后端 normalizeOutput 的折值规则同口径，两边都折一次才不会留下冗余配置。
    var cbs = $$('[data-cmk="' + idx + '"]', row);
    var models = (cur.models || []).slice();
    if (cbs.length){
      var over = false;
      cbs.forEach(function(cb){ if (cb.hasAttribute("data-cmi") !== cb.checked) over = true; });
      models = over ? cbs.filter(function(cb){ return cb.checked; })
        .map(function(cb){ return cb.getAttribute("data-ckv"); }) : [];
    }
    return { id: g("id").trim().toLowerCase(), name: g("name").trim(),
      listen: g("listen").trim(), format: g("format"),
      model_prefix: g("model_prefix").trim(), rate_hint: g("rate_hint"),
      producers: producers, models: models };
  });
}
/* chanAdvOpen 打印时「这个出口的折叠区该不该展开」。overridden 的默认展开；用户手动点开的
   也记住——否则 15 秒一次的健康轮询一 render() 就把人正在填的折叠区收起来，等于边填边被打断。 */
function chanAdvOpen(id){
  return !!(S.chanOpen && id && S.chanOpen[id]);
}
function chanStatusOf(){
  var m = {};
  ((S.out && S.out.channel_status) || []).forEach(function(x){ m[x.id] = x; });
  var def = (S.out && S.out.channel_default) || null;
  if (def) m[def.id || "default"] = def;
  return m;
}
/* chanRowState 一个出口当前的「继承 / 覆盖」状态，全部从 DOM 现读（DOM 就是草稿的真值
   来源，见 chanReadDom）。label = 折叠区摘要，count = 发布清单那一行右侧的计数。 */
function chanRowState(i){
  var row = $$('[data-chan-row="' + i + '"]')[0];
  if (!row) return { label: "继承主口的输出参数", count: "" };
  var g = function(k){ var el = row.querySelector('[data-ck="' + k + '"]'); return el ? el.value : ""; };
  var own = [];
  if (g("format")) own.push(fmtName(g("format")));
  if ((g("model_prefix") || "").trim()) own.push("前缀 " + g("model_prefix").trim());
  if (g("rate_hint")) own.push(rateName(g("rate_hint")));
  // 勾选结果与「继承主口」一模一样时不算覆盖：保存时也会折回空名单（chanReadDom）。
  var cbs = $$('[data-cmk="' + i + '"]');
  var n = 0, over = false;
  cbs.forEach(function(cb){
    if (cb.checked) n++;
    if (cb.hasAttribute("data-cmi") !== cb.checked) over = true;
  });
  if (over) own.push("发布清单 " + n + " 个");
  return {
    label: own.length ? ("已单独覆盖：" + own.join(" · ")) : "继承主口的输出参数",
    count: !cbs.length ? "" : (over ? ("已单独勾选 " + n + " / " + cbs.length)
                                   : ("继承主口（" + cbs.length + " 个）"))
  };
}
/* updChanRow 就地把摘要与计数刷新成当前 DOM 的状态（不整页重渲染，勾一下不会丢别的输入）。 */
function updChanRow(i){

  var ct = row.querySelector("[data-cmcount]"); if (ct) ct.textContent = st.count;

/* chanModelToggle 出口发布清单的三个批量动作：只动 DOM 再刷摘要。 */
function chanModelToggle(i, fn){

/* chanScopeModels 一个出口「服务来源」范围内的候选模型。出口只发自己来源的模型
   （拿别家的名字调它，后端按来源直接 404），勾选列表也按来源收窄，不摆陷阱。 */

function chanCard(){

  var statusById = chanStatusOf();
  var listHtml = list.length
    ? list.map(function(c, i){ return chanRowHtml(c, i, statusById); }).join("")
    : '<div class="empty">还没有单独出口：所有来源都走主口。点「新增出口」给某个客户端单独开一个端口。</div>';
  return card("出口（每个客户端一条独立 API）",
    "出口之间只在「服务哪些来源」上分叉：输出格式、模型前缀、费率后缀、发布清单都沿用「输出 API」上面那份。" +
    "所以每个出口只要一个端口 + 勾几个来源；真要单独换格式，才展开「单独覆盖输出参数」。",
    '<div class="row" style="margin-bottom:12px">' +
      '<button class="tiny" data-action="chan-add">新增出口</button>' +
      '<button class="pri tiny" data-action="chan-save">保存出口</button>' +
      '<span class="grow"></span>' +
      '<span class="hint" style="margin:0">出口是进程内即时绑定/解绑的，保存即生效，不用重启（改主口端口才要重启）。</span>' +
    '</div>' + listHtml +
    '<div class="note" style="margin-top:11px">' +
    '<b>两种用法都支持</b>：不加出口 = 所有来源走主口、由网关按模型名内部路由；加出口 = 每个来源各连各的地址。' +
    '<b>共享参数</b>：格式/前缀/费率/发布清单默认跟随主口，改主口一次所有出口跟着变；'
    + '某个口要特殊对待，就在它下面展开「单独覆盖输出参数」，那时它才脱离主口。<br>' +
    '<b>服务来源都不勾</b> = 这个口服务全部来源（相当于换个端口的主口）。<br>' +
    '<b>跨来源会被挡</b>：出口只发布自己范围内的模型，拿别的来源的模型名调它会被 404（避免配了却形同虚设）。' +
    '</div>');
}
/* codexCard —— Codex 一键接入。
   Codex CLI / 桌面端没有「自定义供应商」入口，只能改 ~/.codex/config.toml。
   这张卡片负责：读现状 → 预览改前改后 → 用户确认后落盘（先备份）。
   其它客户端（ZCode / OpenCode / Qoder / Cherry Studio）有 UI 入口，只需抄上面
   「接入信息」里的 Base URL，不走这张卡。 */
function codexCard(){
  var c = S.codex;
  if (!c) return card("Codex 一键接入", "正在读取 Codex 配置…", '<div class="empty">读取中…</div>');
  var body = "";
  // 现状
  var rows = [
    ["配置文件", '<span class="mono">' + esc(c.path) + "</span>"],
    ["状态", c.read_error ? '<span class="tag warn">读取失败</span>' : (c.exists ? '<span class="tag ok">已存在</span>' : '<span class="tag mut">尚未创建</span>')]
  ];
  if (c.read_error) rows.push(["错误", '<span class="tag warn">' + esc(c.read_error) + "</span>"]);
  if (c.exists){
    rows.push(["当前默认模型", c.current_model ? '<span class="mono">' + esc(c.current_model) + "</span>" : "（未设置）"]);
    rows.push(["当前供应商", c.current_provider ? '<span class="mono">' + esc(c.current_provider) + "</span>" : "（未设置）"]);
    if (c.current_base_url) rows.push(["当前指向", '<span class="mono">' + esc(c.current_base_url) + "</span>"]);
    rows.push(["已写过本网关的段", c.has_our_section ? '<span class="tag ok">是</span>' : '<span class="tag mut">否</span>']);
  }
  rows.push(["密钥环境变量", '<span class="mono">' + esc(c.env_key) + "</span> " + (c.env_key_set ? '<span class="tag ok">已设置</span>' : '<span class="tag warn">未设置</span>')]);
  body += kv(rows);

  // 选模型
  var ms = c.suggested_models || [];
  var curModel = S.codexModel || (ms.length ? ms[0] : "");
  body += '<div class="sep"></div><div class="grid2">' +
    '<div class="field"><label class="f">写为默认模型</label>' +
    (ms.length
      ? '<select id="codexModel">' + ms.map(function(m){ return '<option value="' + esc(m) + '"' + (m === curModel ? " selected" : "") + ">" + esc(m) + "</option>"; }).join("") + "</select>"
      : '<input id="codexModel" value="' + esc(curModel) + '" placeholder="例如 cn:auto">') +
    '<div class="hint">' + (ms.length ? "来自「发布清单」里已勾选的模型。" : "发布清单为空——先去下面勾模型，或手填一个。") + "</div></div>" +
    '<div class="field"><label class="f">Base URL</label><input id="codexBase" value="' + esc(S.codexDraft && S.codexDraft.base_url !== undefined ? S.codexDraft.base_url : (c.suggested_base_url || "")) + '">' +
    '<div class="hint">主口地址（含 /v1）。想给 Codex 单独开出口，就把出口地址填这里。</div></div>' +
    "</div>";

  // 提示
  var notes = [];
  if (c.models_cache_path) notes.push("检测到模型缓存 " + c.models_cache_path + "：换网关后建议删掉，让 Codex 重新拉模型列表（否则选择器可能还显示旧模型）。");
  if (!c.env_key_set) notes.push("环境变量 " + c.env_key + " 当前未设置。Codex 要求它存在（值可以是任意占位串，网关不鉴权时也一样）。");
  if (notes.length) body += '<div class="sep"></div>' + notes.map(function(t){ return '<div class="hint">· ' + esc(t) + "</div>"; }).join("");

  // 预览
  if (S.codexPlan){
    var pl = S.codexPlan;
    body += '<div class="sep"></div><div class="f"><label class="f">改动预览</label>' +
      (pl.changed
        ? '<div class="hint">下面是要写进去的内容（左边是现状，右边是改后；只动我们的段 + 顶层 model/model_provider 两行，其它内容原样保留）。</div>' +
          '<div class="grid2" style="margin-top:6px">' +
          '<pre class="mono codebox">' + esc(pl.before || "（文件不存在，将新建）") + "</pre>" +
          '<pre class="mono codebox">' + esc(pl.after) + "</pre></div>"
        : '<div class="hint">配置已是目标状态，无需写入。</div>') +
      (pl.backup_path ? '<div class="hint">落盘前会先备份到 ' + esc(pl.backup_path) + "</div>" : "") +
      "</div>";
  }

  var planState = S.codexPlan
    ? (S.codexPlan.changed ? '<span class="tag warn">改动预览已生成，待确认写入</span>'
                           : '<span class="tag ok">已是最新，无需写入</span>')
    : '<span class="tag mut">还没预览</span>';
  body += '<div class="sep"></div>' +
    '<div class="f" style="margin-bottom:7px">接入操作 <span class="hint" style="margin-left:6px">' + planState + '</span></div>' +
    '<div class="row actionbar">' +
    '<button class="gh withico" data-action="codex-preview" title="先算出改前 / 改后全文，不落盘">' +
      svg("eye") + '预览改动</button>' +
    (S.codexPlan && S.codexPlan.changed
      ? '<button class="pri withico" data-action="codex-apply" title="把预览里的改后内容写进 config.toml（先自动备份）">' + svg("check") + '确认写入</button>'
      : "") +
    '<span class="hint" style="margin:0">只写 Codex 的 config.toml，改前自动备份。</span></div>';

  // 反向操作：还原官方默认（与 cmd/attach detach 同语义）
  body += '<div class="sep"></div>' +
    '<div class="f" style="margin-bottom:7px">还原操作</div>' +
    '<div class="row actionbar">' +
    '<button class="gh warn-gh withico" data-action="codex-detach-preview" ' +
    'title="删掉顶层 model_provider（网关模型名一并删），回到 Codex 官方 provider。我们的 provider 段保留，随时可再挂。">' +
    svg("undo") + '还原官方默认</button>' +
    '<span class="hint" style="margin:0">卸载本网关的接入，不影响其它 provider。改前同样先备份。</span></div>';
  if (S.codexDetachPlan){
    var dp = S.codexDetachPlan;
    body += '<div style="margin-top:6px">' +
      (dp.changed
        ? '<div class="hint">将删除：' + (dp.removed_provider ? '顶层 model_provider；' : '') +
            (dp.removed_model ? ('顶层 model（' + esc(dp.current_model) + '）') : '（顶层 model 保持不动）') + '</div>' +
          '<div class="grid2" style="margin-top:6px">' +
          '<pre class="mono codebox">' + esc(dp.before || "") + "</pre>" +
          '<pre class="mono codebox">' + esc(dp.after || "") + "</pre></div>"
        : ('<div class="hint">' + (dp.kept_model ? ('顶层 model（' + esc(dp.kept_model) + '）是官方名，保留；') : "") +
            "已经是官方默认形态，无需改动。</div>")) +
      (dp.has_our_section ? '<div class="hint">[model_providers.free2api] 段保留，不影响官方使用。</div>' : "") +
      (dp.changed ? '<div class="row" style="margin-top:8px"><button class="pri withico" data-action="codex-detach-apply">' + svg("check") + '确认还原</button>' +
        (dp.backup_path ? '<span class="hint" style="margin:0">备份到 ' + esc(dp.backup_path) + '</span>' : "") + '</div>' : "") +
      "</div>";
  }

  return card("Codex 一键接入",
    "Codex 没有「自定义供应商」入口，只能改它的 config.toml。这里代你改，并且只动我们那一段。",
    body);
}
function viewOutput(){
  var o = S.out;
  if (!o) return head("输出 API", "正在读取输出配置…");
  var cfg = o.output || {};
  var base = gwBase();
  var models = S.models || [];
  var fmtOpts = fmtOptions(cfg.format);
  var rateOpts = rateOptions(cfg.rate_hint);
  var cur = (o.formats || []).filter(function(f){ return f.id === cfg.format; })[0] || {};
  var html = head("输出 API", "网关对外长什么样由这里决定：格式、端口、模型前缀、费率后缀。");
  html += card("接入信息", "这两项填进客户端即可；改端口需要重启网关生效。",
    kv([
      ["Base URL", copySpan(base + "/v1"), true],
      ["对话接口", copySpan(base + (cur.chat_path || "/v1/chat/completions")), true],
      ["模型列表", copySpan(base + "/v1/models"), true],
      ["网关密钥", S.apiKey ? S.apiKey : "未设置（默认本机直连免密钥）"]
    ]));
  html += card("加工设置", "选了格式、端口、后缀之后保存，前缀与费率后缀立即生效（热更新，不用重启）。",
    '<div class="grid2">' +
      '<div class="field"><label class="f">输出格式</label><select id="outFormat">' + fmtOpts + '</select>' +
        '<div class="hint">' + esc(cur.note || "") + fmtHintAll() + '</div>' +
        '<div class="hint" style="margin-top:5px">客户端怎么选：<b>Codex</b>（v0.151 起只认 Responses，' +
          'wire_api="chat" 已被官方下线）→ <b>OpenAI Responses</b>；' +
          '<b>Qoder / Cursor / Cline</b> 等 → <b>OpenAI 兼容</b>；<b>Claude Code</b> → Anthropic（未接入）。</div></div>' +
      '<div class="field"><label class="f">监听端口</label><input id="outListen" value="' + esc(o.listen || "") + '" placeholder="127.0.0.1:7863">' +
        '<div class="hint">写入 config.json 的 listen 键，需要重启网关生效；当前进程仍听在原端口。</div></div>' +
      '<div class="field"><label class="f">模型前缀（可选）</label><input id="outPrefix" value="' + esc(cfg.model_prefix || "") + '" placeholder="例如 wb-">' +
        '<div class="hint">给模型名加个前缀，方便在客户端里区分来自哪个网关；冒号会被自动剔除。</div></div>' +
      '<div class="field"><label class="f">费率后缀</label><select id="outRate">' + rateOpts + '</select>' +
        '<div class="hint">后缀直接加在对外模型名尾巴上：免费模型 -free、收费模型 -x0.11；' +
          '在客户端的模型选择器里看名字就能分辨，不影响计费。</div></div>' +
    '</div>' +
    '<div class="sep"></div>' +
    '<div class="row"><button class="pri" data-action="save-out">保存设置</button>' +
      '<span class="hint" style="margin:0">配置文件：' + esc(o.config_path || "（未记录）") + '</span></div>');
  html += chanCard();
  html += codexCard();
  var avail = o.available_models || [];
  var entAvail = entitledOf(avail);
  var sel = S.modelSel || {};
  var unentAvail = avail.filter(function(m){ return m.entitled === false; });
  var modelBody;
  if (!avail.length){
    modelBody = '<div class="empty">暂时没有可勾的模型：池里需要有健康账号，网关才能从上游拉到模型表。</div>';
  } else {
    // 按 producer 分组：两家的模型名可能重名（workbuddy 有 cn:glm-4.6，zcode 也有
    // glm-4.6），混在一张平表里看就分不清哪一行是谁家的能力。键用 m.key
    // （后端给：workbuddy = 裸 id，其余 = "<producer>:<裸 id>"），所以重名互不串台。
    var order = [], groups = {};
    avail.forEach(function(m){
      // 分组键带上 realm：workbuddy 底下 CN 版与 wba（国际版）的型号**不是同一批**
      // （wba 独有 gpt-6-astra / gemini-3.5-flash / grok-4.7 等），得分开列。
      var p = (m.producer || "workbuddy") + (m.realm ? "/" + m.realm : "");
      if (!groups[p]){ groups[p] = []; order.push(p); }
      groups[p].push(m);
    });
    var rows = order.map(function(pk){
      var g = groups[pk];
      var p = pk.split("/")[0];
      var realm = pk.split("/")[1] || "";
      var groupName = producerName(p) + (realm === "global" ? " · 国际版 wba" : "");
      // entitled === false：上游目录里有、但号池里没有任何号**有额度**跑它（zcode 周末
      // 活动只送 glm-5.3-flash，可上游 /models 照样列 11 个 GLM）。默认收进折叠区：
      // 「可用模型 N 个」数的是真有额度的那些，未授权的另标一个数，想看能展开。
      var ent = entitledOf(g);
      var unent = g.filter(function(m){ return m.entitled === false; });
      var gopen = !!S.mgroupOpen[pk];
      var head = '<div class="mgroup tog' + (gopen ? " open" : "") + '" data-action="mgroup-toggle" ' +
        'data-g="' + esc(pk) + '" title="点击展开 / 收起这个来源的模型">' +
        '<span><span class="mcaret">\u25B8</span><b>' + esc(groupName) + '</b> · 可用模型 ' +
        ent.length + ' 个' + (unent.length ? '<span class="tag mut" style="margin-left:6px">另有 ' +
        unent.length + ' 个未授权</span>' : "") +
        '</span><span class="hint" style="margin:0" data-gcount="' + esc(pk) + '">' +
        gcountText(ent, unent, sel) + '</span></div>';
      var rowOf = function(m){
        var bits = [];
        // 费率：优先后端给的后缀标签（与模型名尾巴上的一致），退化到 credits 原文。
        if (m.suffix) bits.push('<span class="tag ' + (m.suffix === "-free" ? "ok" : "warn") + '">' +
          esc(m.suffix.replace(/^-/, "")) + '</span>');
        else if (m.credits) bits.push('<span class="tag warn">' + esc(m.credits) + '</span>');
        // 免费但名字里没带费率尾巴的（如 opencode 的 big-pickle / kilo 的部分条目）
        // 补一枚「免费」标记，否则光看行看不出它扣不扣积分。
        else if (m.free) bits.push('<span class="tag ok">免费</span>');
        if (m.is_default) bits.push('<span class="tag ok">默认</span>');
        var un = m.entitled === false;
        if (un) bits.push('<span class="tag mut">未授权</span>');
        var key = m.key || m.id;
        var on = !!sel[key];
        // paid：非免费行。只在「只看免费」勾上时由 CSS 收起（free 由后端按各家口径判定）。
        var paid = !m.free;
        var hay = (m.full_id || "") + " " + (m.name || "") + " " + (m.id || "") + " " + key;
        var mprod = (m.producer || "workbuddy") + (m.realm ? "/" + m.realm : "");
        return '<label class="mrow' + (on ? "" : " off") + (un ? " unent" : "") + (paid ? " paid" : "") + '"' +
          ' data-msearch="' + esc(hay.toLowerCase()) + '" data-mprod="' + esc(mprod) + '" data-mfree="' + (m.free ? "1" : "0") + '">' +
          '<input type="checkbox" data-model="' + esc(key) + '"' + (on ? " checked" : "") + '>' +
          '<span class="mid mono">' + esc(m.full_id) + '</span>' +
          '<span class="mname hint">' + esc(m.name || "") + '</span>' +
          '<span class="mbits">' + bits.join("") + '</span></label>';
      };
      return head + '<div class="mbody">' + ent.map(rowOf).join("") + unent.map(rowOf).join("") + '</div>';
    }).join("");
    var prodOpts = ['<option value="all"' + (S.mfProducer === "all" ? " selected" : "") + '>全部来源</option>'];
    order.forEach(function(pk){
      prodOpts.push('<option value="' + esc(pk) + '"' + (S.mfProducer === pk ? " selected" : "") + '>' +
        esc(producerName(pk.split("/")[0]) + (pk.indexOf("/global") >= 0 ? " · 国际版" : "")) + '</option>');
    });
    modelBody =
      '<div class="mfilter">' +
        '<input id="mq" placeholder="搜索模型名 / 别名 / 裸 id" value="' + esc(S.mq) + '">' +
        '<select id="mfProducer">' + prodOpts.join("") + '</select>' +
        '<select id="mfRate">' +
          '<option value="all"' + (S.mfRate === "all" ? " selected" : "") + '>全部费率</option>' +
          '<option value="free"' + (S.mfRate === "free" ? " selected" : "") + '>只看免费</option>' +
          '<option value="paid"' + (S.mfRate === "paid" ? " selected" : "") + '>只看收费</option>' +
        '</select>' +
        '<button class="tiny" data-action="mfilter-clear">清除筛选</button>' +
        '<span class="hint" style="margin:0" id="mFilterCount"></span>' +
      '</div>' +
      '<div class="row" style="margin-bottom:9px">' +
        '<button class="tiny" data-action="model-all">全选</button>' +
        '<button class="tiny" data-action="model-none">全不选</button>' +
        '<button class="tiny" data-action="model-default">只留默认</button>' +
        '<button class="tiny" data-action="model-free" title="把发布清单收窄成「只有免费模型」——不消耗积分的那些">只勾免费</button>' +
        '<button class="tiny" data-action="model-reset">恢复为全部放开</button>' +
        '<button class="tiny" data-action="mgroup-all" data-open="1">展开全部</button>' +
        '<button class="tiny" data-action="mgroup-all" data-open="0">收起全部</button>' +
        '<label class="inlinechk" title="只看不消耗积分的模型（opencode Zen 目录 79 个里大部分是收费的，勾上后只留免费层）">' +
          '<input type="checkbox" id="onlyFree"' + (S.onlyFree ? ' checked' : '') + '>只看免费</label>' +
        '<label class="inlinechk" title="上游目录里有、号池任何号都没额度的模型（默认收起）">' +
          '<input type="checkbox" id="showUnent"' + (S.showUnent ? ' checked' : '') + '>显示未授权</label>' +
        '<label class="inlinechk" title="勾上：国内版与国际版（wba）各用一把开关，同名型号互不影响；取消：裸名字一把开关同时管两域（旧清单语义）">' +
          '<input type="checkbox" id="realmScoped"' + (S.realmScoped ? ' checked' : '') + '>国际版单独控制</label>' +
        '<span class="grow"></span>' +
        '<span class="hint" style="margin:0" id="mSelCount">' + gcountText(entAvail, unentAvail, sel) + '</span>' +
        '<button class="pri tiny" data-action="save-models">保存发布清单</button>' +
      '</div>' +
      '<div class="mlist' + (S.showUnent ? '' : ' hideunent') + (S.onlyFree ? ' freeonly' : '') + '" id="mList">' + rows + '</div>' +
      '<div class="hint" style="margin-top:9px">勾上的才会出现在客户端的 <span class="mono">GET /v1/models</span> 里；' +
      '没勾的拿旧名字调也会被 <span class="mono">404 model_not_found</span> 挡回去（清单为空 = 全放）。' +
      '一个都不勾 = 全部放开（等于不过滤）。改完要点「保存发布清单」。<br>' +
      '没勾时 <span class="mono">/v1/models</span> 只列<b>号池真有额度</b>的模型（zcode 的上游目录是整家厂商的，' +
      '很多型号这个号的套餐并没有）；「未授权」那些勾上了才会发出去（明知会失败才勾）。<br>' +
      '<b>上游有什么</b>由账号自己决定（网关带账号 token 去上游拉，不读本机任何 agent 的配置）；' +
      '<b>对外发哪些</b>由你在这里勾。</div>';
  }
  var pt2 = (S.status && S.status.producer_totals) || [];
  var servable = pt2.filter(function(x){ return x.servable; });
  var readonly = pt2.filter(function(x){ return !x.servable; });
  var clientNote = servable.length
    ? "承接流量的客户端：" + servable.map(function(x){ return (x.name || producerName(x.producer)) + "（" + x.total + " 号）"; }).join("、")
    : "当前没有已接入上游反代的客户端，上游模型表拉不到。";
  if (readonly.length){
    clientNote += "；另有 " + readonly.map(function(x){ return (x.name || producerName(x.producer)) + "（" + x.total + " 号）"; }).join("、") + " 只可查看，不承接流量。";
  }
  html += card("模型发布清单（上游可勾 " + avail.length + " 个 · 当前对外 " + models.length + " 个）",
    "账号自己携带的模型能力由网关从上游拉取；默认全量放开，想收窄就在下面勾。" + clientNote,
    modelBody +
    '<div class="note" style="margin-top:10px">' +
    '<b>清单从哪来</b>：网关带账号自己的 token 去上游读模型目录（/v3/config 全量口径，按 id 去重），' +
    '不读本机任何 agent 的自定义模型——所以这里看到的都是<b>账号本身携带</b>的能力。<br>' +
    '<b>为什么有上百个</b>：每一家都是<b>整家厂商的目录</b>，不是这个号真能跑的子集——workbuddy 44+28（CN/国际版）、' +
    'opencode Zen 79、kilo 19、zcode 11。目录里的 cli 面往往只是子集，其余是 web/console 面的条目；' +
    '默认全量发布，不需要的在这里取消勾选即可（一个都不勾 = 全部放开）。真打不通的会被池级死标记（24h）自动收敛。<br>' +
    '<b>名字尾巴上的 -free / -x0.11</b>：就是费率档位落在模型名上的样子（免费 -free，收费按自身倍率 -x0.11）。' +
    '客户端拉到的模型名带这个尾巴，请求带回来网关会自动剥掉再路由，所以带不带都能调。<br>' +
    '<b>国际版（wba）为什么单列一组</b>：它的型号和国内版<b>不是同一批</b>（gpt-6-astra / ' +
    'gemini-3.5-flash / grok-4.7 等只有国际版有）。清单里国际版的键是 ' +
    '<span class="mono">global:&lt;裸 id&gt;</span>，与国内版同名的（fast-model、glm-5.3 等）各占一把开关；' +
    '工具栏「国际版单独控制」：勾上 = 两域各一把开关；取消勾选 = 裸名字同时管两域（旧清单兼容）。' +
    '它<b>切换即时生效</b>（直接写进配置，不用点保存、不用重启）——关掉它再勾一个 CN 型号，' +
    '国际版的同名型号会立刻跟着开。<br>' +
    '<b>zcode 段按套餐额度收敛</b>：zcode 的 /models 是<b>整家厂商的目录</b>（列了 11 个 GLM 型号），真正能调用的只有' +
    '该号<b>套餐覆盖</b>的那些（周末活动的号只有 glm-5.3-flash）——在「获取源 → switch 账本 → zcode 卡片 → 看候选 → 读全部额度」' +
    '里能看到每个号实际覆盖哪些。有额度的算「可用」，目录里其余标「未授权」并默认收起；对外 /v1/models 也不发未授权的' +
    '（列出去就等于承诺能调），要强行发就勾上那几条。' +
    '</div>');
  return html;
}
/* ---------- 请求统计（/v1/stats） ---------- */
function fmtInt(n){
  n = Number(n) || 0;
  return n.toLocaleString("en-US");
}
function fmtDur(ms){
  ms = Number(ms) || 0;
  if (ms <= 0) return "—";
  if (ms < 1000) return Math.round(ms) + " ms";
  return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + " s";
}
function fmtPct(x){
  if (x === null || x === undefined || isNaN(x)) return "—";
  return (Number(x) * 100).toFixed(1) + "%";
}
/* statRow 统计页用的一行：把 snapshot 的字段映射成中文标签。 */
/* 统计页区间：默认「近 7 天」（比「本进程」更有意义，又不至于一屏塞满）。
   选择存内存即可——这是查看偏好，不是配置，刷新回默认不算损失。 */
const STATS_RANGES = [
  { id: "today", name: "今天" },
  { id: "7d", name: "近 7 天" },
  { id: "30d", name: "近 30 天" },
  { id: "all", name: "全部" }
];
function statsRangeName(id){
  for (var i = 0; i < STATS_RANGES.length; i++){ if (STATS_RANGES[i].id === id) return STATS_RANGES[i].name; }
  return id || "全部";
}
/* ---------- 数字滚动（实时感的关键） ----------
   只在数字真的变了时播：从旧值匀速数到新值，结束落在真值上。
   为了不打断阅读，位数不变的量（如 96.2% → 96.4%）走最短路径，
   变位数的（1,203 → 1,999）也照样补齐，最后一帧强制写真值，
   避免四舍五入让显示值和真实值长期差 1。 */
var TWEEN_MS = 620;
var tweenRAF = null;
/* tweenNumber 把 el 里的数字从 from 滚到 to，fmt 决定显示格式。
   返回 true 表示安排了动画，false 表示无变化或格式不支持，直接跳过。 */
function tweenNumber(el, from, to, fmt){
  if (!el || from === to || !isFinite(from) || !isFinite(to)) return false;
  var start = null;
  el.classList.add("bump");
  setTimeout(function(){ el.classList.remove("bump"); }, TWEEN_MS + 40);
  function step(ts){
    if (start === null) start = ts;
    var k = Math.min(1, (ts - start) / TWEEN_MS);
    // easeOutCubic：起步快、收尾稳，数字读起来像「在涨」而不是「在飘」。
    var e = 1 - Math.pow(1 - k, 3);
    var v = from + (to - from) * e;
    el.textContent = fmt(k >= 1 ? to : v);
    if (k < 1) tweenRAF = requestAnimationFrame(step);
  }
  tweenRAF = requestAnimationFrame(step);
  return true;
}
/* bindLive 把「数据键 -> DOM 元素 + 格式化函数」登记起来，
   下一轮 refreshLiveNumbers 就能只动变化了的数字，不必重画整页。 */
var liveBindings = [];
function bindLive(key, el, fmt){
  liveBindings.push({ key: key, el: el, fmt: fmt });
}
/* refreshLiveNumbers 比对新旧快照，只给变了的键播滚动动画。
   oldStats 为 null（首屏）时只登记不动画——第一次出现就闪一下没有意义。 */
function refreshLiveNumbers(oldStats, newStats){
  if (!oldStats || !newStats) return;
  var oldT = oldStats.total || {}, newT = newStats.total || {};
  liveBindings.forEach(function(b){
    if (!b.el || !b.el.isConnected) return;
    var a = oldT[b.key], c = newT[b.key];
    if (a === undefined || c === undefined) return;
    a = Number(a) || 0; c = Number(c) || 0;
    if (a === c) return;
    tweenNumber(b.el, a, c, b.fmt);
  });
}
/* registerLiveNumbers 登记「会变的数字」到 DOM 元素上。
   只绑两个大数：「请求总数」和「合计 tokens」——它们是用户真正
   会一直盯着的量，滚动往这里最值得。其余小量不滚：多个小数同时
   动会把整页拉成一片红幕，反而看不清重点。
   注意「合计 tokens」在 mstrip 里（不是 .stat 卡），所以两处都要找。 */
function registerLiveNumbers(){
  liveBindings = [];
  [].slice.call(document.querySelectorAll("#view .stat")).forEach(function(card){
    var label = ((card.querySelector(".k") || {}).textContent || "").trim();
    if (!/^请求总数$/.test(label)) return;
    var el = card.querySelector(".v");
    if (el) bindLive("requests", el, function(v){ return fmtInt(Math.round(v)); });
  });
  [].slice.call(document.querySelectorAll("#view .mstrip > div")).forEach(function(cell){
    var label = ((cell.querySelector(".mk") || {}).textContent || "").trim();
    if (label !== "合计 tokens") return;
    var el = cell.querySelector(".mv");
    if (!el) return;
    // mstrip 的值可能带「≥ 」前缀（区间有缺天时是下限），保留这个前缀。
    var pre = /^≥/.test(el.textContent) ? "≥ " : "";
    bindLive("total_tokens", el, function(v){ return pre + fmtInt(Math.round(v)); });
  });
}

/* statsLiveTag 统计页页头的实时标记：说清楚现在是「推送」还是「轮询」。
   SSE 活着 = 推送（请求落地即到）；退化成轮询 = 每 2s 拉一次；
   两者都拿不到新数据 = 已暂停。超过 12s 没成功更新就显示灰的。 */
function statsLiveTag(){
  var fresh = S.stats && S.statsAt && (Date.now() - S.statsAt) < 12000;
  var at = S.statsAt ? fmtTime(S.statsAt) : "—";
  var pushing = statsES !== null;
  var tip = pushing
    ? "推送中：网关在每次请求落地时主动推一帧（GET /v1/stats/stream），数字没变就不重画，不影响你正在看的表格"
    : "轮询中：推送连不上，已退回每 2 秒拉一次 GET /v1/stats。数字没变就不重画。";
  var label = !fresh ? "● 已暂停" : (pushing ? "● 实时推送" : "● 轮询刷新");
  return '<span class="tag statsLiveTag ' + (fresh ? "ok" : "mut") + '" style="margin-left:2px" title="' + esc(tip) + '">'
    + label + ' · ' + esc(at) + '</span>';
}
/* refreshLiveTag 只原地改页头那一个标记 span。
   传输方式（推送 / 轮询）变了但数据没变时，数字不该重画、滚动位置不该丢，
   所以这里只动标记本身。找不到元素（比如不在统计页）就什么都不做。 */
function refreshLiveTag(){
  var cur = document.querySelector("#view .statsLiveTag");
  if (!cur) return;
  var fresh = S.stats && S.statsAt && (Date.now() - S.statsAt) < 12000;
  var at = S.statsAt ? fmtTime(S.statsAt) : "—";
  var pushing = statsES !== null;
  var label = !fresh ? "● 已暂停" : (pushing ? "● 实时推送" : "● 轮询刷新");
  cur.className = "tag statsLiveTag " + (fresh ? "ok" : "mut");
  cur.textContent = label + " · " + at;
}

/* statsRangeSeg 区间切换：与「获取源」的 .seg 同一套控件，放页面最上面。 */
/* statsTabDefault 每页的默认区间。概览看当下，统计看趋势。 */
function statsTabDefault(tab){ return tab === "overview" ? "today" : "7d"; }
/* statsRangeFor 取当前生效的区间：优先该页上次的选择，否则该页默认值。
   统计页的 statsRangeSeg 与概览的共用它，所以两页永远显示同一个真实区间，
   不会出现「标题写 7 天、数据其实是今天」这种口径打架。 */
function statsRangeFor(tab){
  tab = tab || S.tab;
  var byTab = S.statsRangeByTab || {};
  // 记忆优先；没切过就用该页默认。
  // 刻意不回落 S.statsRange：它是「当前生效值」，用它兜底会让概览一进来
  // 就拿到统计页的 7 天（实测踩过：概览明明写着「近 7 天请求」，
  // 而它本该默认今天）。S.statsRange 由 go() 按本页需要重设，不是配置源。
  return byTab[tab] || statsTabDefault(tab);
}
function statsRangeSeg(){
  var cur = statsRangeFor();
  return '<div class="seg">' + STATS_RANGES.map(function(r){
    return '<button data-range="' + r.id + '" class="' + (cur === r.id ? "on" : "") + '">' + esc(r.name) + '</button>';
  }).join("") + '</div>';
}
/* statsSortVal 取排序值；缺观测的均值算 -1，沉在最后而不是伪造成 0。 */
function statsSortVal(m, key){
  if (key === "model") return String(m.model || "");
  if (key === "success_rate") return (Number(m.requests) || 0) ? (Number(m.success) || 0) / Number(m.requests) : -1;
  if (key === "avg_ttfb_ms" || key === "avg_latency_ms"){
    var v = Number(m[key]);
    return (isFinite(v) && v > 0) ? v : -1;
  }
  return Number(m[key]) || 0;
}
/* statsSortList 按当前排序键排序；同值一律用模型名做次级键，
   否则大量「各 1 次」的行每次刷新都会换位。 */
function statsSortList(list){
  var so = S.statsSort || { key: "requests", dir: -1 };
  var dir = so.dir === 1 ? 1 : -1;
  return list.slice().sort(function(a, b){
    var va = statsSortVal(a, so.key), vb = statsSortVal(b, so.key);
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    var na = String(a.model || ""), nb = String(b.model || "");
    if (na < nb) return -1;
    if (na > nb) return 1;
    return 0;
  });
}
/* statsTh 可点排序表头：点一下切排序键，再点一下翻转方向。 */
function statsTh(label, key, numeric){
  var so = S.statsSort || {};
  var on = so.key === key;
  var arrow = on ? (so.dir === 1 ? " ▲" : " ▼") : "";
  return '<th class="' + (numeric ? "num " : "") + 'sorth' + (on ? " on" : "") + '" ' +
    'data-action="stats-sort" data-key="' + key + '" title="点击按此列排序（再点翻转方向）">' +
    esc(label) + arrow + '</th>';
}
/* partialNote 输入侧缺失的提示文案：说清楚为什么总量只是下限。 */
function partialNote(){
  var n = (S.stats && Number(S.stats.partial_days)) || 0;
  if (!n) return "";
  return "其中 " + n + " 天是旧日志回填的（日志里没记输入 token），所以总量只能当下限看。";
}
/* heatCell 热力图一格：颜色深浅按请求数相对全局峰值，0 用最淡的底。 */
function heatCell(n, peak){
  var a = peak > 0 ? n / peak : 0;
  if (n <= 0) a = 0;
  var bg = a <= 0 ? "var(--hover)" : "rgba(16,185,129," + (0.16 + a * 0.76).toFixed(3) + ")";
  var fg = a > 0.55 ? "#fff" : "var(--fg3)";
  return '<div class="hc" style="background:' + bg + ';color:' + fg + '" title="' + n + ' 次">' +
    (n > 0 ? n : "") + '</div>';
}
/* heatmapCard 周几 × 小时的热力图。24 列在窄屏会挤，用横向滚动兜住。 */
function heatmapCard(heat){
  var peak = 0, total = 0;
  for (var d = 0; d < 7; d++){
    for (var h = 0; h < 24; h++){
      var v = (heat[d] && heat[d][h]) || 0;
      if (v > peak) peak = v;
      total += v;
    }
  }
  var names = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  var head = '<div class="hrow"><div class="hlabel">时</div>' + (function(){
    var s = "";
    for (var h = 0; h < 24; h++) s += '<div class="hlab">' + (h % 3 === 0 ? h : "") + '</div>';
    return s;
  })() + '</div>';
  var body = names.map(function(nm, d){
    return '<div class="hrow"><div class="hlabel">' + nm + '</div>' +
      (function(){
        var s = "";
        for (var h = 0; h < 24; h++) s += heatCell((heat[d] && heat[d][h]) || 0, peak);
        return s;
      })() + '</div>';
  }).join("");
  return card("活跃热力图", "按「周几 × 小时」累计请求数（本地时区）。颜色越深越忙；空格 = 该时段没有请求。",
    '<div class="heatwrap">' + head + body + '</div>' +
    '<div class="hint" style="margin-top:10px">本区间合计 ' + fmtInt(total) + ' 次请求，峰值 ' + fmtInt(peak) + ' 次/格。</div>');
}
/* viewStats 请求统计：区间切换 → 总量 → 趋势/热力图 → 按来源 → 按模型 → token。
   数据源 GET /v1/stats?range=…（逐日聚合落 data/stats.json，跨重启保留）。 */
function viewStats(){
  var cur = statsRangeFor();
  var html = head("请求统计", "按「今天 / 近 7 天 / 近 30 天 / 全部」看请求量、来源、模型、延迟与 token。" +
    "历史按天落盘（data/stats.json），跨重启保留。数据源 /v1/stats。") +
    '<div class="row" style="margin-bottom:14px">' + statsRangeSeg() + statsLiveTag() + '</div>';
  var st = S.stats;
  if (!st) return html + card("正在读取", "", '<div class="empty">读取中…</div>');
  var t = st.total || {};
  var span = Number(st.uptime_sec) || 0;
  var spanText = span >= 86400 ? (span/86400).toFixed(1) + " 天"
    : span >= 3600 ? (span/3600).toFixed(1) + " 小时"
    : span >= 60 ? Math.round(span/60) + " 分钟" : span + " 秒";
  html += '<div class="grid4">' +
    statBox("请求总数", fmtInt(t.requests), "成功 " + fmtInt(t.success) + " · 失败 " + fmtInt(t.failed), "st.requests", "cum") +
    statBox("成功率", (t.requests ? fmtPct(t.success / t.requests) : "—"), "失败 " + fmtInt(t.failed) + " 次", "st.success_rate", "avg") +
    statBox("流式占比", (t.requests ? fmtPct(t.streaming / t.requests) : "—"), "流式 " + fmtInt(t.streaming) + " 次", "st.streaming", "avg") +
    statBox("区间跨度", spanText, "起始 " + esc(fmtTime(st.since)) + " · " + esc(statsRangeName(st.range || cur))) +
    '</div>';
  html += '<div class="grid4">' +
    statBox("首字延迟", fmtDur(t.avg_ttfb_ms), "区间平均 TTFB（流式首帧）", "st.ttfb", "avg") +
    statBox("端到端延迟", fmtDur(t.avg_latency_ms), "区间平均总耗时", "st.latency", "avg") +
    statBox("生成速度", (t.tokens_per_sec ? Number(t.tokens_per_sec).toFixed(1) + " tok/s" : "—"), "区间平均吞吐", "st.tps", "avg") +
    statBox("缓存命中率", fmtPct(t.cache_hit_rate), "命中 " + fmtInt(t.cache_hit_tokens) + " / 未命中 " + fmtInt(t.cache_miss_tokens), "st.cache_hit", "avg") +
    '</div>';
  if (!t.requests){
    html += card("这个区间还没有请求", "", '<div class="empty">换个区间看看，或先跑一次对话再回来刷新。</div>');
  }
  // 热力图：有数据才画（全 0 时画出来只是一片空白，没信息量）。
  if (t.requests && st.heatmap) html += heatmapCard(st.heatmap);
  // 按来源：与「按模型」正交。模型名里带 producer 前缀时，两者会互相印证。
  var producers = (st.producers || []).slice();
  if (producers.length){
    var ptot = producers.reduce(function(a, x){ return a + (x.requests || 0); }, 0) || 1;
    var prows = producers.map(function(p){
      var share = (p.requests || 0) / ptot;
      return '<tr>' +
        '<td>' + producerTag({ producer: p.producer }) + '</td>' +
        '<td class="num">' + fmtInt(p.requests) + '</td>' +
        '<td class="num">' + fmtInt(p.success) + '</td>' +
        '<td class="num">' + (p.failed ? '<span style="color:var(--danger)">' + fmtInt(p.failed) + '</span>' : "0") + '</td>' +
        '<td class="num">' + fmtPct(p.requests ? p.success / p.requests : 0) + '</td>' +
        '<td class="num">' + fmtInt(p.total_tokens) + '</td>' +
        '<td style="width:160px"><div class="bar-track" style="margin:0"><div class="bar-fill" style="width:' +
          (share * 100).toFixed(1) + '%"></div></div></td>' +
        '<td class="num hint">' + fmtPct(share) + '</td></tr>';
    }).join("");
    html += card("按来源（" + producers.length + " 家）", "请求实际落到哪个 AI 客户端的号上。模型名带来源前缀时与此表同源。",
      '<div class="tablewrap"><table><thead><tr>' +
      '<th>来源</th><th class="num">请求</th><th class="num">成功</th><th class="num">失败</th>' +
      '<th class="num">成功率</th><th class="num">Tokens</th><th>占比</th><th class="num">份额</th>' +
      '</tr></thead><tbody>' + prows + '</tbody></table></div>');
  }
  var models = (st.models || []).slice();
  if (!models.length){
    html += card("按模型", "", '<div class="empty">这个区间还没有请求观测。跑一次对话后回来刷新。</div>');
  } else {
    models = statsSortList(models);
    var rows = models.map(function(m){
      var rate = m.credits || "";
      return '<tr>' +
        '<td><span class="mono">' + esc(m.model) + '</span></td>' +
        '<td class="num">' + fmtInt(m.requests) + '</td>' +
        '<td class="num">' + fmtInt(m.success) + '</td>' +
        '<td class="num">' + (m.failed ? '<span style="color:var(--danger)">' + fmtInt(m.failed) + '</span>' : "0") + '</td>' +

        '<td class="num">' + fmtDur(m.avg_latency_ms) + '</td>' +
        '<td class="num">' + fmtInt(m.total_tokens) + '</td>' +
        '<td class="num">' + fmtPct(m.cache_hit_rate) + '</td>' +

        (partialNote() ? (" " + partialNote()) : ""),

  html += card("token 结构与扣费", partialNote() + " 后端只采信上游 usage，缺失的天数已在上面的总量标成下限。",

      ["生成 tokens", fmtInt(t.completion_tokens), true, "tk.comp", "cum"],
      ["合计 tokens", ((st.partial_days) ? "≥ " : "") + fmtInt(t.total_tokens), true, "tk.total", "cum"],
      ["缓存命中 tokens", fmtInt(t.cache_hit_tokens), true, "tk.hit", "cum"],
      ["缓存未命中", fmtInt(t.cache_miss_tokens), true, "tk.miss", "cum"],
      ["缓存写入 tokens", fmtInt(t.cache_write_tokens), true, "tk.write", "cum"],
      // credit 是上游返回的扣费数（积分/额度），不是钱——
      // 所以只写 credit，不给它加任何货币符号，免得被误读成元。
      ["上游扣费 credit", t.credit ? fmtCredit(t.credit) : "—", true, "tk.credit", "cum"],
      ["平均每请求扣费", t.credit_per_req ? fmtCredit(t.credit_per_req) : "—", true, "tk.credit_per_req", "avg"],
      ["平均单请求 tokens", t.requests ? fmtInt(Math.round(t.total_tokens / t.requests)) : "—", true, "tk.per_req_tokens", "avg"],
      ["非流式请求", fmtInt(Math.max(0, (t.requests || 0) - (t.streaming || 0))), true, "tk.nostream", "cum"],
      ["最近一次请求", esc(fmtTime(t.last_seen)), true, "tk.last_seen"],

    '<span class="hint" style="margin:0">重置只清这份观测，网关照常跑。</span></div>';

}

/* statsSortSet 切排序键：同一列再点一下就翻转方向；换列默认降序。 */
function statsSortSet(key){
  if (!key) return;
  var so = S.statsSort || { key: "requests", dir: -1 };
  if (so.key === key) so.dir = (so.dir === 1 ? -1 : 1);
  else { so.key = key; so.dir = -1; }
  S.statsSort = so;
  render();
}

      : "读不到 config.json：" + esc(sc.read_error || "");

      '<th class="num" style="width:150px">触发整点</th><th>说明</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +

      (sc.config_path ? ('<br>配置文件：<span class="mono">' + esc(sc.config_path) + '</span>') : "") + '</div>');
  }

  // 死信模型
  var md = (S.modeldead && S.modeldead.entries) || {};
  var mdKeys = Object.keys(md);

    var mdRows = mdKeys.map(function(k){

    }).join("");
    html += card("模型死信台账（" + mdKeys.length + " 条）",

      '<div class="tablewrap"><table><thead><tr><th style="width:280px">键</th><th>原因</th><th style="width:150px">到期</th></tr></thead><tbody>' +
      mdRows + '</tbody></table></div>' +

      '<span class="hint" style="margin:0">清掉后这些模型立刻重新参与路由。</span></div>');
  } else {
    html += card("模型死信台账", "没有死信：上游目录里的模型都还能正常路由。", "");
  }
  return html + selfTestHtml;
}

/* ---------- 桌面程序控制面 ---------- */
/* loadDesktop 拉一次宿主状态。网关停着时普通 API 全部会失败，所以这个端点是
   「停着也要能刷」的那一个：它走控制服务，不经过网关。 */
async function loadDesktop(){
  if (!DESKTOP) return;
  try {
    var r = await fetch("/__desktop/state", { cache: "no-store" });
    S.desk = r.ok ? await r.json() : null;
  } catch (e) { S.desk = null; }
}
/* deskCtl 启停网关。走控制服务的 POST，成功后整页重刷——网关刚起来时
   /status 之类的数据还是空的，让 refreshAll 那一轮去把它们补齐。 */
async function deskCtl(op){
  var label = op === "start" ? "启动" : "停止";
  try {
    var r = await fetch("/__desktop/gateway/" + op, { method: "POST" });
    var j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok){
      var m = (j && j.error && j.error.message) || ("HTTP " + r.status);
      toast("err", label + "失败：" + m, 9000);
    } else {
      toast("ok", "网关已" + label, 2600);
    }
  } catch (e) {
    toast("err", "控制服务连不上：" + e.message, 9000);
  }
  await loadDesktop();
  await refreshAll(true);
  render();
}

/* ---------- 设置页（悬浮窗） ---------- */
/* floatLoad 拉悬浮窗配置。走控制服务 /__desktop/floatwin，不经过网关——
   所以网关停着的时候也照样能开关浮窗、看清它是不是真在跑。 */
async function floatLoad(){
  if (!DESKTOP) return;
  try {
    var r = await fetch("/__desktop/floatwin", { cache: "no-store" });
    S.floatwin = r.ok ? await r.json() : null;
  } catch (e) { S.floatwin = null; }
}
/* floatApply 提交悬浮窗设置。后端按字段做了增量 apply：只传改动的键。
   开关即时生效，不需要重启桌面程序。 */
async function floatApply(patch, okMsg){
  if (!DESKTOP){ toast("err", "悬浮窗只在 Windows 桌面程序里可用（当前是浏览器直连）", 5000); return; }
  if (S.floatBusy) return;
  S.floatBusy = true;
  render();
  try {
    var r = await fetch("/__desktop/floatwin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch)
    });
    var j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok){
      var m = (j && j.error && j.error.message) || ("HTTP " + r.status);
      toast("err", "设置失败：" + m, 9000);
    } else {
      S.floatwin = (j && j.state) ? j.state : S.floatwin;
      toast("ok", okMsg || "悬浮窗设置已保存", 2400);
    }
  } catch (e) {
    toast("err", "控制服务连不上：" + e.message, 9000);
  }
  S.floatBusy = false;
  await floatLoad();
  render();
}
/* floatToggle 主开关。开着但没跑起来（比如建窗失败）时，按钮旁必须显示原因，
   不能让用户以为已经生效了。 */
async function floatToggle(on){
  await floatApply({ enabled: !!on }, on ? "悬浮窗已显示（拖动可移动）" : "悬浮窗已隐藏");
}
/* floatItemToggle 逐项开关显示内容。 */
async function floatItemToggle(id, next){
  var items = ((S.floatwin && S.floatwin.items) || []).slice();
  var i = items.indexOf(id);
  if (next && i < 0) items.push(id);
  if (!next && i >= 0) items.splice(i, 1);
  await floatApply({ items: items });
}
function floatRangeLabel(r){
  return { today: "今天", "7d": "近 7 天", "30d": "近 30 天", all: "全部" }[r] || "今天";

/* floatSwitchItem 一行开关。同一行的开关点完立刻生效，所以不做「保存」按钮——

}

/* liveValue(key) 由当前 S.stats / S.status 算出某个 data-live 节点该显示什么。
   返回 {text, html} 或 null（key 未知 → 调用方跳过）。

   这是「局部更新」的唯一真相来源：渲染时用它算初值，帧到达时也用它算新值，
   两边走同一个函数，所以永远不会出现「首屏和刷新后不一致」。
   新增一个实时数字时只要在这里加一条 case，渲染处挂上同名 key 即可。 */
function liveValue(key){
  var s = S.stats, t = (s && s.total) || {};
  var st = S.status || {};
  var rn = ovRangeName();
  var partial = (s && s.partial_days) ? "≥ " : "";
  switch (key) {
  /* --- 概览 --- */
  case "ov.requests":
    return { text: fmtInt(t.requests), html: true, delta: t.requests };
  case "ov.requests.n":
    return { text: "成功 " + fmtInt(t.success) + " · 失败 " + fmtInt(t.failed), html: true };
  case "ov.tokens":
    return { text: partial + fmtInt(t.total_tokens), html: true, delta: t.total_tokens };
  case "ov.tokens.n":
    return { text: (s && s.partial_days)
      ? ("下限：" + s.partial_days + " 天缺输入 token · 缓存命中率 " + fmtPct(t.cache_hit_rate))
      : ("缓存命中率 " + fmtPct(t.cache_hit_rate)), html: true };
  case "ov.latency":
    return { text: fmtDur(t.avg_latency_ms), html: true };
  case "ov.latency.n":
    var infl = 0;
    ((st && st.accounts) || []).forEach(function(a){ infl += (a.in_flight || 0); });
    return { text: "首字 " + fmtDur(t.avg_ttfb_ms) + " · 在飞 " + fmtInt(infl), html: true };

  /* --- 「正在发生」（概览顶部实时条） --- */
  case "lv.inflight": {
    var n = 0;
    ((st && st.accounts) || []).forEach(function(a){ n += (a.in_flight || 0); });
    return { text: fmtInt(n), html: false };
  }
  case "lv.inflight.n":
    return { text: (function(){
      var n = 0;
      ((st && st.accounts) || []).forEach(function(a){ n += (a.in_flight || 0); });
      return n > 0 ? (n + " 个正在跑") : "当前空闲";
    })(), html: false };
  case "lv.model": {
    var hm = (st && st.live_models) || {};
    var ks = Object.keys(hm).sort(function(a, b){ return hm[b] - hm[a]; });
    return { text: ks.length ? (ks.length === 1 ? ks[0] : (ks.length + " 个模型")) : ((s && s.live && s.live.requests) ? "—" : "空闲"),
             html: false };
  }
  case "lv.model.n": {
    var hm2 = (st && st.live_models) || {};
    var k2 = Object.keys(hm2).length;
    return { text: k2 === 1 ? "1 个模型" : (k2 ? (k2 + " 个模型") : "没有请求在跑"), html: false };
  }
  case "lv.rate_tps":
    return { text: ((s && s.live && s.live.tokens_per_sec) ? Number(s.live.tokens_per_sec).toFixed(1) : "—"), html: false };
  case "lv.rate_tps.n":
    return { text: ((s && s.live && s.live.tokens_per_sec) ? "tok/s · 生成阶段" : "最近 " + ((s && s.live && s.live.window_sec) || 60) + "s 无输出"), html: false };
  case "lv.rate_req":
    return { text: fmtInt((s && s.live && s.live.requests) || 0), html: false };
  case "lv.rate_req.n":
    return { text: "成功 " + fmtInt((s && s.live && s.live.success) || 0) + " · 失败 " + fmtInt((s && s.live && s.live.failed) || 0), html: false };
  case "lv.rate_tok":
    return { text: fmtInt((s && s.live && s.live.completion_tokens) || 0), html: false };
  case "lv.rate_tok.n":
    return { text: ((s && s.live && s.live.samples) ? ((s.live.samples) + " 次观测") : "窗口内无观测"), html: false };

  /* --- 统计页 KPI --- */
  case "st.requests":
    return { text: fmtInt(t.requests), html: true, delta: t.requests };
  case "st.requests.n":
    return { text: "成功 " + fmtInt(t.success) + " · 失败 " + fmtInt(t.failed), html: true };
  case "st.success_rate":
    return { text: (t.requests ? fmtPct(t.success / t.requests) : "—"), html: true };
  case "st.success_rate.n":
    return { text: "失败 " + fmtInt(t.failed) + " 次", html: true };
  case "st.streaming":
    return { text: (t.requests ? fmtPct(t.streaming / t.requests) : "—"), html: true };
  case "st.streaming.n":
    return { text: "流式 " + fmtInt(t.streaming) + " 次", html: true };
  case "st.ttfb":
    return { text: fmtDur(t.avg_ttfb_ms), html: true };
  case "st.latency":
    return { text: fmtDur(t.avg_latency_ms), html: true };
  case "st.tps":
    return { text: (t.tokens_per_sec ? Number(t.tokens_per_sec).toFixed(1) + " tok/s" : "—"), html: true };
  case "st.cache_hit":
    return { text: fmtPct(t.cache_hit_rate), html: true };
  case "st.cache_hit.n":
    return { text: "命中 " + fmtInt(t.cache_hit_tokens) + " / 未命中 " + fmtInt(t.cache_miss_tokens), html: true };

  /* --- token 结构与扣费（mstrip） --- */
  case "tk.prompt":
    return { text: partial + fmtInt(t.prompt_tokens), html: true, delta: t.prompt_tokens };
  case "tk.comp":
    return { text: fmtInt(t.completion_tokens), html: true, delta: t.completion_tokens };
  case "tk.total":
    return { text: partial + fmtInt(t.total_tokens), html: true, delta: t.total_tokens };
  case "tk.hit":
    return { text: fmtInt(t.cache_hit_tokens), html: true, delta: t.cache_hit_tokens };
  case "tk.miss":
    return { text: fmtInt(t.cache_miss_tokens), html: true, delta: t.cache_miss_tokens };
  case "tk.write":
    return { text: fmtInt(t.cache_write_tokens), html: true, delta: t.cache_write_tokens };
  case "tk.credit":
    return { text: (t.credit ? fmtCredit(t.credit) : "—"), html: true, delta: t.credit };
  case "tk.credit_per_req":
    return { text: (t.credit_per_req ? fmtCredit(t.credit_per_req) : "—"), html: true };
  case "tk.per_req_tokens":
    return { text: (t.requests ? fmtInt(Math.round(t.total_tokens / t.requests)) : "—"), html: true };
  case "tk.nostream":
    return { text: fmtInt(Math.max(0, (t.requests || 0) - (t.streaming || 0))), html: true };
  case "tk.last_seen":
    return { text: esc(fmtTime(t.last_seen)), html: true };
  case "tk.models":
    return { text: fmtInt(((s && s.models) || []).length), html: true };
  }
  return null;
}

/* patchLive 只更新挂 data-live 的节点（以及它们的增量角标）。

   返回值语义是「这页是否被局部更新完整覆盖了」，**不是**「有没有数字变了」——
   这一点反过来过一次：早先返回「是否变化」，结果数据没变化时 patchLive 返回 false，
   applyStatsSnapshot 就退化成整页重画，反而在最该安静的时候把整页换掉了。
   正确口径是：只要这页挂了实时节点，就由局部更新负责；哪怕一个数字都没变，
   也应当什么都不做地返回 true。 */
function patchLive(prevStats){
  var nodes = document.querySelectorAll("#view [data-live]");
  if (!nodes.length) return false;   // 这页没有实时节点 → 调用方整页重画
  var changed = false;
  var oldT = (prevStats && prevStats.total) || {};
  for (var i = 0; i < nodes.length; i++){
    var el = nodes[i];
    var key = el.getAttribute("data-live");
    var got = liveValue(key);
    if (!got) continue;
    var txt = String(got.text == null ? "" : got.text);
    if (el.textContent !== txt){
      if (el.getAttribute("data-live-html")) el.innerHTML = txt;
      else el.textContent = txt;
      changed = true;
      /* 增量角标：只有「带 delta 语义」的累计量才闪，且要真的有增量。
         均值类（成功率 / 延迟 / 命中率）不加角标——它们本来就该迟钝，
         让它们闪反而在暗示「这里在实时」，那是假的。 */
      var d = el.parentNode && el.parentNode.querySelector('[data-delta="' + key + '"]');
      if (d && typeof got.delta === "number" && isFinite(got.delta)){
        var prev = Number(oldT[liveDeltaKey(key)]) || 0;
        var inc = got.delta - prev;
        if (inc > 0){
          d.textContent = "+" + fmtInt(inc);
          d.classList.remove("show");
          void d.offsetWidth;      // 强制重排，让动画能重播
          d.classList.add("show");
        }
      }
    }
  }
  // 「正在发生」整条的活性态：有请求在跑时点亮（.livebar.on 会让 5 个圆点呼吸）。
  // 这个类不在 data-live 体系里（它是容器状态，不是数字），所以单独同步一次。
  var bar = document.querySelector("#view [data-live-bar]");
  if (bar){
    var n = 0;
    var stt = S.status || {};
    ((stt && stt.accounts) || []).forEach(function(a){ n += (a.in_flight || 0); });
    bar.classList.toggle("on", n > 0);
  }
  // 无条件 true：这页有实时节点，局部更新已经负责完毕（changed 只用于日志/调试）。
  return true;
}
/* liveDeltaKey 把 live key 映射回 /v1/stats total 里的字段名（算增量用）。
   只有 total.* 下的标量才需要；其余返回 null。 */
function liveDeltaKey(key){
  var m = {
    "ov.requests": "requests", "ov.tokens": "total_tokens",
    "st.requests": "requests",
    "tk.prompt": "prompt_tokens", "tk.comp": "completion_tokens",
    "tk.total": "total_tokens", "tk.hit": "cache_hit_tokens",
    "tk.miss": "cache_miss_tokens", "tk.write": "cache_write_tokens",
    "tk.credit": "credit"
  };
  return m[key] || null;
}

/* applyStatsSnapshot 把一份快照吃进状态：和上一份逐字节比，没变就一个 DOM 都不动
   （重画会清掉滚动位置，也会打断用户正在看的表格排序）；变了才重画 + 播滚动。
   轮询和 SSE 共用这一段，所以两条路的渲染结果完全一致。 */
/* statsShape 一份快照的「结构指纹」：只取会影响页面骨架的那些字段。
   数字变化（请求数、token、延迟）在指纹里体现不出来——这是故意的，
   指纹只回答「页面骨架要不要重画」：
     - 按模型表多了一行 / 少了一行 → 表要重画
     - 逐日序列多了一天 / 少了一天 → 趋势图要重画
     - 按来源多了一家 → 来源表要重画
   指纹相同 = 只动了数字 = 局部更新足够。
   （热力图和 token 结构条只随 total 变，不需要进指纹。） */
function statsShape(st){
  if (!st) return "";
  var models = (st.models || []).map(function(m){ return m.model; }).join("|");
  var prod = (st.producers || []).map(function(p){ return p.producer; }).join("|");
  var days = (st.series || []).map(function(d){ return d.day; }).join("|");
  return models + "#" + prod + "#" + days;
}
function applyStatsSnapshot(next, prev){
  if (!next) return false;
  var after = JSON.stringify(next);
  if (prev && JSON.stringify(prev) === after) return false;
  S.stats = next;
  S.statsAt = Date.now();
  // 优先局部更新：只改变了的那几个数字节点，不动其他 DOM。
  // 这样滚动位置、hover、展开态、输入焦点都原样保留——整页重画会把它们全清掉，
  // 实时帧来得越频繁，这个代价越大。
  //
  // 两个条件都满足才走局部：① 这页挂了实时节点；② 骨架指纹没变。
  // 只满足 ① 不够——概览的趋势图 / 来源表 / 按模型表不在 live 覆盖范围内，
  // 今天新冒出来一个模型时那些表必须重画，否则数字更新了、表还是上一版的。
  var shapeOk = !prev || statsShape(prev) === statsShape(next);
  if (shapeOk && patchLive(prev)){
    refreshLiveTag();
    return true;
  }
  render();
  // 重画会换掉 DOM，所以先登记新元素，再拿旧快照的数字播滚动。
  registerLiveNumbers();
  refreshLiveNumbers(prev, next);
  return true;
}
/* statsStreamEnabled 关掉后强制退回轮询。留这个开关是为了排查：
   万一某台机器 / 某个反向代理把 SSE 掐了，能一键确认不是推送的问题。 */
var statsStreamEnabled = true;
var statsES = null;          // EventSource 实例；null = 当前没连上
var statsESRetry = 0;        // 连续失败次数，用来退避
var statsPollTimer = null;   // SSE 活着时停掉轮询，断了再挂回来
var STATS_POLL_MS = 2000;    // 兜底轮询间隔
var STATS_FALLBACK_MS = 4000;// SSE 断开后的退避起点

function stopStatsPolling(){
  if (statsPollTimer){ clearInterval(statsPollTimer); statsPollTimer = null; }
}
function startStatsPolling(){
  stopStatsPolling();
  statsPollTimer = setInterval(function(){ loadStatsLive(); }, STATS_POLL_MS);
}
/* loadStatsLive 是轮询路径：只有「当前就停在这一页」才去拉。 */
async function loadStatsLive(){
  if (S.tab !== "stats" && S.tab !== "overview") return;
  var prev = S.stats;
  var r = statsRangeFor();
  var next = null;
  try { next = await api("/v1/stats?range=" + encodeURIComponent(r)); }
  catch (e) { return; }               // 拉失败保持旧数据，别把页面清空
  applyStatsSnapshot(next, prev);
}
/* statsStreamMsg 收到一帧推送：直接喂给同一套渲染逻辑。
   JSON.parse 失败只丢这一帧（连接还在），不整体降级。 */
function statsStreamMsg(ev){
  if (S.tab !== "stats" && S.tab !== "overview") return;
  var next = null;
  try { next = JSON.parse(ev.data); }
  catch (e) { return; }
  applyStatsSnapshot(next, S.stats);
}
/* openStatsStream 建立（或重建）SSE 连接。
   EventSource 自带断线重连，但重连节奏不可控，所以自己管：
   成功 open -> 停轮询；error -> 关连接、挂轮询、退避后重连。 */
function openStatsStream(){
  if (!statsStreamEnabled || typeof EventSource === "undefined"){ startStatsPolling(); return; }
  closeStatsStream();
  // EventSource 不能自定义请求头，key 只能走查询串（后端只对这条路由放行）。
  var url = "/v1/stats/stream?range=" + encodeURIComponent(statsRangeFor());
  if (S.apiKey) url += "&api_key=" + encodeURIComponent(S.apiKey);
  var es;
  try { es = new EventSource(url); }
  catch (e) { startStatsPolling(); return; }
  statsES = es;
  es.addEventListener("open", function(){
    statsESRetry = 0;
    stopStatsPolling();               // 推送通了就不必再轮询
    refreshLiveTag();
  });
  es.addEventListener("stats", statsStreamMsg);
  es.addEventListener("error", function(){
    // EventSource 在连接失败时 readyState 会变 CONNECTING（它自己在重连）
    // 或 CLOSED（彻底断了 we'll 自己重建）。两种都先退回轮询兜底，
    // 这样即使推送永久不可用（老网关 / 反代拦截），页面照样是活的。
    closeStatsStream();
    startStatsPolling();
    statsESRetry++;
    refreshLiveTag();   // 立刻把页头标记从「实时推送」改成「轮询刷新」，
                         // 不能等下一次 render —— 否则降级了用户还看不出来。
    var wait = Math.min(STATS_FALLBACK_MS * Math.pow(2, Math.min(statsESRetry, 4)), 60000);
    setTimeout(function(){ if (statsESRetry > 0) openStatsStream(); }, wait);
  });
}
function closeStatsStream(){
  if (statsES){ try { statsES.close(); } catch (e) {} statsES = null; }
}
/* 切区间 / 切页面时要重连：SSE 的 range 是建连时定死的。 */
function resetStatsStream(){
  if (!statsStreamEnabled) return;
  statsESRetry = 0;
  openStatsStream();
}
async function runSelfTest(){
  if (S.selftest && S.selftest.running) return;
  S.selftest = { running: true, steps: [
    { name: "管理端点 /healthz", status: "run" },
    { name: "模型列表 GET /v1/models", status: "todo" },
    { name: "对话 POST /v1/chat/completions", status: "todo" }
  ]};
  render();
  var steps = S.selftest.steps;
  var finish = function(){ S.selftest.running = false; render(); };
  try {
    var h = await fetch("/healthz", { cache: "no-store" });
    var hb = await h.text();
    steps[0].status = h.ok ? "ok" : "err";
    steps[0].detail = "HTTP " + h.status + " · " + hb.slice(0, 300);
  } catch (e) { steps[0].status = "err"; steps[0].detail = String(e && e.message || e); }
  steps[1].status = "run"; render();
  var firstModel = "";
  try {
    var mr = await api("/v1/models");
    var data = (mr && mr.data) || [];
    firstModel = (data[0] && (data[0].id || data[0].name)) || "";
    steps[1].status = "ok";
    steps[1].detail = "返回 " + data.length + " 个模型" + (firstModel ? "，首个：" + firstModel : "（列表为空，先看账号池）");
  } catch (e) { steps[1].status = "err"; steps[1].detail = String(e && e.message || e); }
  steps[2].status = "run"; render();
  try {
    var body = { model: firstModel || "cn:auto", messages: [{ role: "user", content: "ping" }], max_tokens: 1, stream: false };
    var cr = await api("/v1/chat/completions", { method: "POST", body: body });
    var ch = (cr && cr.choices && cr.choices[0]) || {};
    steps[2].status = "ok";
    steps[2].detail = "模型回显：" + ((cr && cr.model) || firstModel) +
      " · 内容片段：" + String((ch.message && ch.message.content) || "").slice(0, 80);
  } catch (e) { steps[2].status = "err"; steps[2].detail = String(e && e.message || e); }
  finish();

/* refreshAll 是**唯一**的刷新入口（右上角那个按钮）：状态、来源台账、输出清单、
   模型表、上游余额一次拉齐；候选面板开着就顺手重拉一次（保留已勾选与探活/额度标记，
   不会把用户手上的选择冲掉）。余额后端是「先回旧值 + 后台重查」，所以不拖慢这一轮。 */
/* srcRefresh 「获取源」页的刷新：重扫本机路径 + 重读来源台账，再整页重画。
   与右上角全局刷新的区别是它**只做取源相关的两件事**并给一条明确反馈——
   用户点「刷新」的预期是「刚登录的号 / 刚导出的账本要出现」，不该被余额、统计等
   无关请求拖时间，也不该静默到让人以为没反应。候选面板开着时一并重拉（不带探活）。 */
async function srcRefresh(){

  S.busy = true;
  var req = beginScan();
  try {
    await Promise.all([loadSources(), loadOrigins()]);

    toast("ok", "已重新扫描本机来源（可用 " + n + " 个）", 2600);
  } catch (e) { cancelScan(); toast("err", e.message || String(e), 9000); }

/* ---- 「获取源」刷新动画 ------------------------------------------------------------
   用户点的预期是「本机有哪些来源」被一个个重新查一遍。后端仍是一次返回（本机读盘很快），
   这里只把揭示节奏摊开：先把表格清空成待检查行，再逐行 等待 → 检查中 → 已检查，
   每个亮过的行保留在表里；新数据到了就直接换成真实行。不额外发请求、不伪造结果。 */
var SCAN_STEP = 240;   // 每行点亮的间隔
var SCAN_HOLD = 560;   // 全部点亮后再停留一下，让用户看清「已检查」再收尾

/* scanRows 拿上一次已知的 probes 当骨架：行名、顺序、来源都与终态一致，动画不会跳名字。
   首次打开还没有 probes 时，用三条来源兜底。 */
function scanRows(){
  var d = S.src || {};
  var probes = (d.probes || []).slice();
  if (probes.length) return probes;
  return [{ id: "app", name: "应用内登录态", producer: "" },
          { id: "switch", name: "switch 账本", producer: "" },
          { id: "file", name: "导入文件", producer: "" }];
}
/* beginScan 清空表格、摆出待检查行并开始逐行点亮；返回本次扫描的序号（用于作废旧一轮）。 */
function beginScan(){
  var rows = scanRows();
  var seq = (S.scanSeq = (S.scanSeq || 0) + 1);
  S.scan = { tab: "app", rows: rows, at: 0, data: null, seq: seq, timer: null, hold: null };
  render();
  S.scan.timer = setTimeout(function(){ scanStep(seq); }, SCAN_STEP);
  return seq;
}
/* scanStep 点亮下一行；全部点亮且新数据已到就进入收尾，否则继续等下一拍 / 等数据。 */
function scanStep(seq){
  var sc = S.scan;
  if (!sc || sc.seq !== seq) return;
  sc.timer = null;
  if (sc.at < sc.rows.length){
    sc.at += 1;
    render();
  }
  if (sc.at >= sc.rows.length && sc.data){
    if (!sc.hold) sc.hold = setTimeout(function(){ endScan(seq); }, SCAN_HOLD);
    return;
  }
  if (sc.at < sc.rows.length) sc.timer = setTimeout(function(){ scanStep(seq); }, SCAN_STEP);
}
/* finishScan 新数据到手：填进本轮，已经点亮的行立刻换成真实行；动画走完就直接收尾。 */
function finishScan(seq){
  var sc = S.scan;
  if (!sc || sc.seq !== seq) return;
  var d = S.src || {};
  sc.data = (d.probes || []).slice();
  if (sc.timer){ clearTimeout(sc.timer); sc.timer = null; }
  if (sc.at >= sc.rows.length){
    if (!sc.hold) sc.hold = setTimeout(function(){ endScan(seq); }, SCAN_HOLD);
  } else {
    sc.timer = setTimeout(function(){ scanStep(seq); }, SCAN_STEP);
  }
  render();
}
/* endScan 收尾：撤掉扫描态，表格回到真实数据（与刷新前完全同构）。 */
function endScan(seq){
  var sc = S.scan;
  if (!sc || sc.seq !== seq) return;
  S.scan = null;
  if (S.tab === "sources") render();
}
function cancelScan(){
  var sc = S.scan;
  if (sc){
    if (sc.timer) clearTimeout(sc.timer);
    if (sc.hold) clearTimeout(sc.hold);
  }
  S.scan = null;
  render();
}
async function refreshAll(silent){

  ];
  // 概览要用到区间统计与定时任务：不再等用户点进「请求统计 / 运行态」才拉，
  // 否则首屏概览的这几块永远是空的。
  jobs.push(loadStats());

  if (S.modeldead) jobs.push(loadRuntime());
  // 候选面板开着就顺手重拉——但只在**没探过活/读过额度**时做：
  // 那两个动作每个号一次外网往返，全局刷新不该把它们偷偷重跑一遍。
  if (S.candKind && S.srcTab === "switch" && !S.candProbe && !S.candBalance){
    jobs.push(reloadCands(false, false, true));
  }

  render();

    var mc = (S.models && S.models.length) ? (" · 对外模型 " + S.models.length) : "";

  }
}

/* reloadCands 就地重拉候选（探活/读额度用）：保留已勾选状态，只换数据。
   探活是每号一次外网往返，所以按钮点下去会等一会儿；这里先提示再请求。 */

/* captureCodexDraft 把 Codex 一键接入那两个输入框的现值收进草稿。
   为什么必须有：codex-preview 只在点击那一刻读一次 DOM，而后台 30s 一次的状态
   轮询会 render() 整页 —— 输入框按 suggested_* 重填后，用户敲的 Base URL 就被
   顶回服务端建议值。症状是「改了 URL，预览里还是旧的那个」，看起来像保存失败，
   其实改动从来没进过请求。与 captureChanDraft 同一个病根（重画吞掉未保存输入）。 */
function captureCodexDraft(){
  var mEl = $("#codexModel"), bEl = $("#codexBase");

  };
  // 输入框内容与后端建议一致 = 用户没改，草稿不必留着（避免脏值一直盖着服务端的
  // 新建议值，比如网关换了出口地址之后还卡在旧草稿）。
  var sug = (S.codex && S.codex.suggested_base_url) || "";
  if (S.codexDraft.base_url === sug) S.codexDraft.base_url = sug;

/* codexPreview 拉「改前/改后」全文，不落盘；用户看过再点「确认写入」。 */

/* mgroupKeys 发布清单的分组键（producer + realm），与渲染、批量展开共用一套口径。 */

   用户看到的现象是「我明明展开了，怎么又合了」，但其实每次点击都生效了。
   这类「点了像没反应 / 过一会儿自己变回去」必须靠持久化而不是靠不重画来解决，

function saveMgroupOpen(){

function loadMgroupOpen(){

/* entitledOf 只留「号池真的有额度」的模型（后端 entitled 字段；缺省视为有额度）。

/* applyModelFilter 发布清单的搜索 / 来源 / 费率筛选：纯前端按行上的 data-* 收窄。

/* ---------- 出口动作 ---------- */
function chanNextId(list){
  var used = {};
  list.forEach(function(c){ used[c.id] = 1; });
  for (var i = 1; i < 999; i++){ var id = "ch" + i; if (!used[id]) return id; }
  return "ch" + Date.now();
}
function chanNextPort(list){
  var used = {};
  list.forEach(function(c){ var m = /:(\d+)$/.exec(c.listen || ""); if (m) used[Number(m[1])] = 1; });
  for (var p = 7870; p < 7970; p++){ if (!used[p]) return p; }
  return 7870;
}
async function chanAdd(){
  var list = (chanReadDom(chanDraftList()) || chanDraftList()).slice();
  // 默认不写 format/rate_hint：留空 = 继承主口，避免新出口一出生就带一份冗余配置。
  list.push({ id: chanNextId(list), name: "", listen: "127.0.0.1:" + chanNextPort(list),
    format: "", model_prefix: "", rate_hint: "", producers: [], models: [] });
  S.chanDraft = list; render({ keepDraft: true });
  toast("info", "已新增一个出口草稿，填好后点「保存出口」生效", 3600);
}
function chanDel(i){
  var list = (chanReadDom(chanDraftList()) || chanDraftList()).slice();
  var n = Number(i);
  if (!(n >= 0) || n >= list.length) return;
  var gone = list[n] || {};
  list.splice(n, 1);
  S.chanDraft = list; render({ keepDraft: true });
  toast("info", "已从草稿移除出口「" + (gone.name || gone.id || (n + 1)) + "」，点「保存出口」生效", 4200);
}
async function chanSave(){
  var list = chanReadDom(chanDraftList());
  if (!list){ toast("info", "还没有出口可保存"); return; }
  // 与主口取值相同的字段 = 用户并没有想单独覆盖它，归一化成空串交给后端按「继承主口」处理。
  // 否则配置里会躺着一份和主口一模一样的显式值，看着像每个出口都在重复配置。
  var base = (S.out && S.out.output) || {};
  list = list.map(function(c){
    var x = { id: c.id, name: c.name, listen: c.listen, producers: c.producers };
    if (c.format && c.format !== (base.format || "openai")) x.format = c.format;
    if (c.model_prefix && c.model_prefix !== (base.model_prefix || "")) x.model_prefix = c.model_prefix;
    if (c.rate_hint && c.rate_hint !== (base.rate_hint || "credit")) x.rate_hint = c.rate_hint;
    // 发布清单：空 = 继承主口；只在真的不一样时才写进去（后端也会再折一次）。
    if (c.models && c.models.length) x.models = c.models;
    return x;
  });
  var err = null, seenId = {}, seenListen = {};
  list.forEach(function(c, i){
    var no = i + 1;
    if (!c.id) err = err || ("第 " + no + " 个出口的 id 不能为空");
    else if (!/^[a-z0-9][a-z0-9_-]*$/.test(c.id)) err = err || ("出口 id「" + c.id + "」只能用小写字母/数字/-/_，且以字母数字开头");
    else if (seenId[c.id]) err = err || ("出口 id 重复了：" + c.id);
    else if (!c.listen) err = err || ("出口「" + c.id + "」的监听端口不能为空");
    else if (seenListen[c.listen]) err = err || ("出口监听地址重复了：" + c.listen);
    seenId[c.id] = 1; seenListen[c.listen] = 1;
  });
  if (err){ toast("err", err, 7000); return; }
  // 来源一个都不勾 = 这个口服务全部来源（等价于换个端口的主口）。池里有不止一家时先确认一次，
  // 免得本意是「只给某一家开个口」却因为忘勾而把全部来源都放出去。
  var openAll = list.filter(function(c){ return !(c.producers && c.producers.length); });
  if (openAll.length && producerChoices().length > 1){
    var names = openAll.map(function(c){ return c.name || c.id; }).join("、");
    if (!window.confirm("出口「" + names + "」没有勾任何服务来源，保存后它会服务【全部来源】。\n" +
        "如果本意是只给某一家开独立口，请先勾上来源再保存。\n\n仍然按「全部来源」保存？")) return;
  }
  try {
    var res = await api("/admin/output", { method: "PUT", body: { channels: list } });
    S.out = res; S.chanDraft = null;
    var bad = ((res && res.channel_status) || []).filter(function(x){ return !x.running; });
    if (bad.length){
      toast("err", "有出口没起来：" + bad.map(function(x){ return x.id + "（" + (x.error || "端口不可用") + "）"; }).join("；"), 9000);
    } else {
      toast("ok", list.length ? ("已保存 " + list.length + " 个出口，立即生效") : "已清空出口：全部走主口", 4200);
    }
    await refreshAll(true);
  } catch (e) { toast("err", e.message, 9000); }
}
/* statsRangeSet 切换统计页区间并重拉（只影响这一页的观测口径）。 */
function statsRangeSet(r){
  if (!r || r === statsRangeFor()) return;
  // 每页各自记住选择：概览默认「今天」（问「现在怎么样」），
  // 统计页默认「近 7 天」（问「这段时间的规律」）。切页时各自恢复，
  // 不互相覆盖——否则在概览选了「今天」，切到统计页又被拽成 7 天。
  S.statsRangeByTab = S.statsRangeByTab || {};
  S.statsRangeByTab[S.tab] = r;
  S.statsRange = r;
  S.stats = null; // 先清掉旧区间的数字，避免新数据回来前显示错口径的统计
  render();
  // SSE 的 range 在建连时就定死了，换区间必须重连；同时先拉一帧，
  // 免得新连接握手完之前页面是空的。
  resetStatsStream();
  loadStats().then(function(){ if (S.tab === "stats") render(); });
}

async function actOn(t){
  if (t.hasAttribute("data-copy") && !t.hasAttribute("data-action")){ copyText(t.getAttribute("data-copy")); return; }
  if (t.hasAttribute("data-range") && !t.hasAttribute("data-action")){ return statsRangeSet(t.getAttribute("data-range")); }
  var act = t.getAttribute("data-action");
  if (act){
    if (act === "gw-start") return deskCtl("start");
    if (act === "gw-stop") return deskCtl("stop");
    if (act === "cands") return openCands(t.getAttribute("data-kind"));
    if (act === "quick"){
      var qk = t.getAttribute("data-kind") || "wb-switch";
      if (qk === "zcode-switch") return doImport("zcode-switch", null, null, "switch", "zcode-switch 账本");
      if (qk === "opencode") return doImport("opencode", null, null, "app", "opencode auth.json");
      if (qk === "kilo") return doImport("kilo", null, null, "app", "kilo anonymous free lane");
      return doImport("wb-switch", null, null, "switch", "wb-switch 账本");
    }
    if (act === "src-refresh") return srcRefresh();
    if (act === "import-paste") return doPaste();
    if (act === "pick-file"){ var fp = $("#filePick"); if (fp) fp.click(); return; }
    if (act === "cand-all"){
      (S.cand || []).forEach(function(x){ if (!x.imported) S.checked[x.id] = true; });
      render(); toast("info", "已勾选 " + checkedIDs().length + " 个待导入账号", 2600); return;
    }
    if (act === "cand-none"){ S.checked = {}; render(); toast("info", "已取消全部勾选", 2200); return; }
    if (act === "cand-import"){
      // 两种账本都是「来源 = switch」；粘贴导入（candKind 非账本）才是 file。
      var meth = (S.candKind === "wb-switch" || S.candKind === "zcode-switch") ? "switch"
        : ((S.candKind === "opencode" || S.candKind === "kilo") ? "app" : "file");
      return doImport(S.candKind, checkedIDs(), null, meth, S.candKind);
    }
    if (act === "zcode-probe") return reloadCands(true, false);
    if (act === "zcode-balance") return reloadCands(false, true);
    if (act === "cand-close"){ S.cand = null; return render(); }
    if (act === "acct") return acctOp(t.getAttribute("data-uid"), t.getAttribute("data-op"));
    if (act === "save-out") return saveOutput();
    if (act === "codex-preview") return codexPreview();
    if (act === "codex-apply") return codexApply();
    if (act === "save-models") return saveModels();
    if (act === "model-all") return setModelSel(function(){ return true; });
    if (act === "model-none") return setModelSel(function(){ return false; });
    if (act === "model-default") return setModelSel(function(m){ return !!m.is_default; });
    if (act === "model-free") return setModelSel(function(m){ return !!m.free; });
    if (act === "model-reset") return resetModels();
    if (act === "selftest") return runSelfTest();
    if (act === "mfilter-clear"){
      S.mq = ""; S.mfProducer = "all"; S.mfRate = "all";
      var qi = $("#mq"); if (qi) qi.value = "";
      var pi = $("#mfProducer"); if (pi) pi.value = "all";
      var ri = $("#mfRate"); if (ri) ri.value = "all";
      applyModelFilter(); return;
    }
    if (act === "mgroup-toggle"){
      // 展开状态持久化到本机 localStorage。之前的实现只放内存 S.mgroupOpen，
      // 后台 30s 一次的状态轮询会 render() 整页；用户点开一组、勾两个模型，切回
      // 别的页签或轮询一过，这组就被收起 —— 表现是「我明明展开了，怎么自己合上了」。
      var gk = t.getAttribute("data-g") || "";
      S.mgroupOpen[gk] = !S.mgroupOpen[gk];
      t.classList.toggle("open", !!S.mgroupOpen[gk]);
      saveMgroupOpen();
      // 筛选态下 .mlist.searching 用 display:block!important 把所有 mbody 强开，
      // 这时再点分组头，class 翻了对用户没有任何可见反馈 —— 表现就是「收起没反应」。
      // 退掉 searching 一层语义即可：筛选期间不允许单独折叠，先退出筛选。
      var ml = $("#mList");
      if (ml && ml.classList.contains("searching")){
        ml.classList.remove("searching");
        S.mq = ""; S.mfProducer = "all"; S.mfRate = "all";
        var qi = $("#mq"); if (qi) qi.value = "";
        var pi = $("#mfProducer"); if (pi) pi.value = "all";
        var ri = $("#mfRate"); if (ri) ri.value = "all";
        toast("info", "已退出筛选，现在可以逐组展开 / 收起", 2600);
      }
      return;
    }
    if (act === "mgroup-all"){
      var open = t.getAttribute("data-open") === "1";
      S.mgroupOpen = {};
      mgroupKeys().forEach(function(k){ S.mgroupOpen[k] = open; });
      saveMgroupOpen();
      render(); toast("info", open ? "已展开全部来源分组" : "已收起全部来源分组", 2000); return;
    }
    if (act === "credits-refresh") return loadCredits(true);
    if (act === "reset-cooldowns") return resetCooldowns();
    if (act === "stats-reset") return statsReset();
    if (act === "stats-range") return statsRangeSet(t.getAttribute("data-range"));
    if (act === "stats-sort") return statsSortSet(t.getAttribute("data-key"));
    if (act === "sched-toggle") return schedToggle(t.getAttribute("data-key"), t.getAttribute("data-next") === "1");
    if (act === "open-key") return $("#btnKey").click();
    if (act === "float-main") return floatToggle(t.getAttribute("data-next") === "1");
    if (act === "float-item") return floatItemToggle(t.getAttribute("data-id"), t.getAttribute("data-next") === "1");
    if (act === "float-range") return floatApply({ range: t.getAttribute("data-range") });
    if (act === "float-theme") return floatApply({ theme: t.getAttribute("data-theme") });
    if (act === "modeldead-clear") return modeldeadClear();
    if (act === "codex-detach-preview") return codexDetachPreview();
    if (act === "codex-detach-apply") return codexDetachApply();
    if (act === "chan-add") return chanAdd();
    if (act === "chan-del") return chanDel(t.getAttribute("data-i"));
    if (act === "chan-model-all") return chanModelToggle(t.getAttribute("data-i"), function(){ return true; });
    if (act === "chan-model-none") return chanModelToggle(t.getAttribute("data-i"), function(){ return false; });
    if (act === "chan-model-inherit") return chanModelToggle(t.getAttribute("data-i"),
      function(cb){ return cb.hasAttribute("data-cmi"); });
    if (act === "chan-save") return chanSave();
    return;
  }
  if (t.hasAttribute("data-filter")){ S.poolFilter = t.getAttribute("data-filter"); return render(); }
  if (t.hasAttribute("data-pclient")){
    S.poolClient = t.getAttribute("data-pclient");
    // 切客户端时把域筛选归位：新客户端不分区、或没显式传域，就回「全部」——
    // 否则会留下一个看不见却仍在生效的域筛选。
    if (t.hasAttribute("data-prealm")) S.poolRealm = t.getAttribute("data-prealm");
    else if (S.poolClient === "all" || producerRealms(S.poolClient).length < 2) S.poolRealm = "all";
    if (t.hasAttribute("data-goto")) return go("pool");
    return render();
  }
  if (t.hasAttribute("data-prealm")){ S.poolRealm = t.getAttribute("data-prealm"); return render(); }
  if (t.hasAttribute("data-srctab")){
    var m = t.getAttribute("data-srctab");
    if (t.hasAttribute("data-goto")) return go("sources", { srcTab: m });
    S.srcTab = m; S.cand = null; return render();
  }
  if (t.hasAttribute("data-goto")) return go(t.getAttribute("data-goto"));
}

    }
    if (t.hasAttribute && t.hasAttribute("data-cmk")){
      var mr = t.closest ? t.closest(".mrow") : null;
      if (mr) mr.classList.toggle("off", !t.checked);
      updChanRow(t.getAttribute("data-cmk"));
      return;
    }
    var cw = (t.closest ? t.closest("[data-chan-row]") : null);
    if (cw){ updChanRow(cw.getAttribute("data-chan-row")); }
    if (t.id === "mfProducer"){ S.mfProducer = t.value; applyModelFilter(); return; }
    if (t.id === "mfRate"){ S.mfRate = t.value; applyModelFilter(); return; }
    if (t.id === "realmScoped"){ S.realmScoped = !!t.checked; applyRealmScoped(); return; }
    if (t.id === "showUnent"){
      var ml = $("#mList");
      if (ml) ml.classList.toggle("hideunent", !t.checked);
      S.showUnent = !!t.checked; // 记住：重画/保存后别自己收回去
      return;
    }
    if (t.id === "onlyFree"){
      var ml2 = $("#mList");
      if (ml2) ml2.classList.toggle("freeonly", !!t.checked);
      S.onlyFree = !!t.checked; // 同上：这是纯视图开关，不影响勾选
      return;
    }
    if (t.hasAttribute && t.hasAttribute("data-model")){
      if (!S.modelSel) initModelSel();
      S.modelSel[t.getAttribute("data-model")] = !!t.checked;
      S.modelDirty = true;
      var row = t.closest ? t.closest(".mrow") : null;
      if (row) row.classList.toggle("off", !t.checked);
      updModelCount();
      return;
    }
    if (t.id === "filePick" && t.files && t.files[0]){
      var f = t.files[0], rd = new FileReader();
      rd.onload = function(){
        var box = $("#pasteBox");
        if (box) box.value = String(rd.result || "");
        toast("ok", "已读入 " + f.name + "，确认来源后点「导入到号池」", 4200);
      };
      rd.readAsText(f);
    }
  });
  $("#btnKey").addEventListener("click", function(){
    var p = $("#keyPop");
    p.classList.toggle("hidden");
    if (!p.classList.contains("hidden")) $("#keyInput").value = S.apiKey || "";
  });
  $("#btnKeyClose").addEventListener("click", function(){ $("#keyPop").classList.add("hidden"); });
  $("#btnKeySave").addEventListener("click", function(){
    S.apiKey = ($("#keyInput").value || "").trim();
    if (S.apiKey) localStorage.setItem("wb_key", S.apiKey); else localStorage.removeItem("wb_key");
    $("#keyPop").classList.add("hidden");
    toast("ok", S.apiKey ? "密钥已保存到本机浏览器" : "已清空密钥（本机直连免密钥）", 2600);
    refreshAll(true);
  });
  var bt = $("#btnTheme");
  if (bt) bt.addEventListener("click", toggleTheme);
  $("#btnRefresh").addEventListener("click", async function(){
    var b = $("#btnRefresh");
    b.classList.add("spin");
    await refreshAll(false);
    b.classList.remove("spin");
  });
}
/* ---------- 启动 ---------- */
(async function boot(){
  applyTheme();
  var logo = $("#brandLogo");
  if (logo) logo.innerHTML = svg("swap");
  $("#btnKey").innerHTML = svg("key");
  $("#btnRefresh").innerHTML = svg("refresh");
  S.mgroupOpen = loadMgroupOpen();
  bind();
  renderNav();
  await loadDesktop();
  render();
  await refreshAll(true);
  // 网关刚重启时模型池要几秒才从上游拉回来，这一轮会拿到空表，
  // 界面就停在「当前对外 0 个」不再自愈。补一次延迟重试（仅在上一次确实为空时）。
  if (!S.models || !S.models.length){
    setTimeout(function(){ loadModels().then(function(){ render(); }); }, 2500);
  }
  // 请求统计实时刷新：优先走 SSE 推送（/v1/stats/stream，请求落地即到）；
  // 连不上（老网关 / 反代拦截长连 / 网关重启中）自动退回 2s 轮询，
  // 数字没变就不重画。两条路共用 applyStatsSnapshot，渲染结果一致。
  openStatsStream();
  startStatsPolling(); // 先挂上，SSE open 后会把它停掉；这样首个 2s 内也有兜底
  setInterval(function(){ loadHealth(); }, 15000);
  setInterval(function(){ loadStatus().then(function(changed){ if (changed) render(); }); }, 30000);
  // 概览页的「正在发生」需要知道此刻有几个请求在飞、跑的是哪个模型，而这两个只
  // 在 /status 里（accounts[].in_flight / live_models）——跟 SSE 的统计线无关。
  // 30s 太粗：跑一个 5 秒的请求，整条实时条全程显示「空闲」。概览页单独 2s 拉一次，
  // 且走局部更新不重画（patchLive 里已处理），所以不打断视野。
  setInterval(function(){
    if (S.tab !== "overview") return;
    if (document.querySelector("#view [data-live-bar]") === null) return;
    loadStatus().then(function(){ patchLive(null); refreshLiveTag(); });
  }, 2000);
  // 桌面程序：宿主状态轮询。网关被计划任务之类的外部动作停掉/拉起时，页面不用手动刷新。
  if (DESKTOP){
    setInterval(function(){
      var before = JSON.stringify(S.desk);
      loadDesktop().then(function(){
        if (JSON.stringify(S.desk) !== before) render();
        else updateSvcDot();
      });
    }, 5000);
  }
})();
</script>
</body>
