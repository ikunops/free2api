<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free2API · 网关控制台</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#fff; --panel:#fff; --panel2:#fdfdfc; --side:#fbfbfa;
  --line:#ececea; --line2:#f2f2f0; --line3:#d8d8d4; --sel:#ececea;
  --fg:#1a1a18; --fg2:#5c5c58; --fg3:#8a8a86; --fg4:#a3a3a0;
  --acc:#10b981; --acc-bg:#e9f7f1; --acc-fg:#0f7a5a;
  --dark:#1a1a18; --dark-hover:#2c2c29; --on-dark:#fff;
  --danger:#e5484d; --danger-fg:#c0392b;
  --warn:#b7791f; --warn-bg:#fdf6e3; --warn-line:#f0e2bd;
  --err-bg:#fdecec; --err-line:#f3d3d4;
  --hover:#f1f1ef; --hover2:#f3f3ef; --soft:#f5f5f3; --soft2:#fcfcfb;
  --dotoff:#d4d4d0; --bg2:#f6f7f9; --focus:#10b981;
  --r:14px; --r2:10px; --r3:8px;
  --sh:0 1px 2px rgba(16,16,16,.04);
  --sh2:0 6px 22px rgba(16,16,16,.10);
  --sh3:0 10px 30px rgba(16,16,16,.12);
}
/* 深色模式：只换变量，不改结构。所有面板/边框/文字都走上面的语义变量，
   这样加一个主题不用碰任何一条布局规则。跟随系统 + 手动切换（见 #btnTheme）。 */
html[data-theme="dark"]{
  --bg:#151519; --panel:#1e1e24; --panel2:#202027; --side:#1a1a20;
  --line:#2e2e36; --line2:#26262d; --line3:#3d3d47; --sel:#2e2e37;
  --fg:#ececec; --fg2:#b6b6b2; --fg3:#90908c; --fg4:#6f6f6b;
  --acc:#34d399; --acc-bg:rgba(16,185,129,.16); --acc-fg:#4ade9d;
  --dark:#ececec; --dark-hover:#fff; --on-dark:#16161a;
  --danger:#f2555a; --danger-fg:#ff8f93;
  --warn:#e0b050; --warn-bg:rgba(183,121,31,.18); --warn-line:rgba(224,176,80,.38);
  --err-bg:rgba(229,72,77,.16); --err-line:rgba(229,72,77,.40);
  --hover:#26262d; --hover2:#2a2a31; --soft:#26262d; --soft2:#22222a;
  --dotoff:#4a4a52; --bg2:#22222a; --focus:#34d399;
  --sh:0 1px 2px rgba(0,0,0,.35);
  --sh2:0 6px 22px rgba(0,0,0,.5);
  --sh3:0 10px 30px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
svg{width:16px;height:16px;flex:0 0 auto}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:inherit}

.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}

.side{background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px}
.logo{width:34px;height:34px;border-radius:9px;flex:0 0 34px;
  background:linear-gradient(140deg,#34d399,#0ea5e9);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(16,185,129,.28)}
.logo svg{width:20px;height:20px;stroke-width:2.2}
.brand b{display:block;font-size:14px;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--fg3);margin-top:1px}
nav{padding:6px 8px;overflow:auto;flex:1}
.ngroup{margin:10px 0 4px;padding:0 8px;font-size:11px;color:var(--fg4);letter-spacing:.4px}
.nitem{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:var(--r3);
  color:var(--fg2);cursor:pointer;font-size:13px;user-select:none;margin:1px 0}
.nitem:hover{background:var(--hover)}
.nitem.on{background:var(--sel);color:var(--fg);font-weight:500}
.nitem svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nitem .cnt{margin-left:auto;font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:7px;
  align-items:center;font-size:12px;color:var(--fg3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:0 0 7px}
.dot.off{background:var(--dotoff)}

/* min-width:0：grid 子项默认 min-width:auto，会被内容顶宽（表格一宽整页就横向滚动），
   显式归零后宽度由网格列决定，宽表交给 .tablewrap 卡内滚动。 */
.main{padding:22px 32px 56px;width:100%;min-width:0}
@media(min-width:1600px){.main{padding-left:48px;padding-right:48px}}
@media(min-width:2200px){.main{padding-left:72px;padding-right:72px}}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.ic{width:34px;height:34px;border-radius:var(--r3);border:1px solid var(--line3);
  background:var(--panel);color:var(--fg2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;box-shadow:var(--sh)}
.ic:hover{border-color:var(--acc);color:var(--fg)}
.ic svg{width:16px;height:16px}
.ic.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin svg{animation:spin .8s linear infinite}
.mini-spin{width:14px;height:14px;border:2px solid var(--line3);border-top-color:var(--acc);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.scanbox{border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden;background:var(--panel)}
.scanbox .scanrow{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line2);font-size:13px;transition:opacity .2s}
.scanbox .scanrow:last-child{border-bottom:0}
.scanbox .scanrow .st{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center}
.scanbox .scanrow .st svg{width:15px;height:15px}
.scanbox .scanrow.done{color:var(--fg)}
.scanbox .scanrow.done .st{color:var(--acc)}
.scanbox .scanrow.cur{color:var(--fg);background:var(--soft2)}
.scanbox .scanrow.todo{opacity:.42}
.scanbox .scanrow .pname{font-weight:600}
.scanbox .scanrow .pmeta{color:var(--fg3);font-size:12px;margin-left:auto}
/* 扫描中的表格行（tr.scanrow）：不能套上面的 flex 布局，只借状态色。 */
tr.scanrow.done{color:var(--fg)}
tr.scanrow.cur{background:var(--soft2)}
tr.scanrow.todo{opacity:.5}
tr.scanrow td{transition:opacity .2s}
.mfilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.mfilter input{width:240px}
.mfilter select{width:auto;min-width:150px}
.mlist.searching .mbody{display:block!important}
.filt-hidden{display:none!important}

h1{font-size:34px;line-height:1.2;font-weight:800;margin:6px 0 10px;letter-spacing:-.6px}
h2{font-size:16px;font-weight:650;margin:0 0 3px}
.meta{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg3);
  margin:0 0 24px;flex-wrap:wrap}
.meta .vbar{width:3px;height:15px;border-radius:2px;background:var(--acc);flex:0 0 3px}
.sub{font-size:12.5px;color:var(--fg3);margin:2px 0 16px;line-height:1.7}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh);margin-bottom:12px}
.card.pad0{padding:14px 20px}
.card-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:11px}
.card-head .grow{flex:1}
.sep{height:1px;background:var(--line2);margin:16px 0}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:1000px){.grid4,.grid3,.grid2{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.grid4,.grid3,.grid2{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}.side{position:static;height:auto}.main{padding:20px}}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;box-shadow:var(--sh)}
.stat .k{font-size:12px;color:var(--fg3);display:flex;align-items:center;gap:6px}
.stat .v{font-size:25px;font-weight:750;line-height:1.25;margin:3px 0 1px;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px;transition:color .18s}
.stat .n{font-size:11.5px;color:var(--fg4)}
/* 数字滚动期间的过渡高亮：只染字不动布局，颜色走 --acc-fg，浅深色通用。 */
.stat .v.bump{color:var(--acc-fg)}
@media(prefers-reduced-motion:reduce){.stat .v{transition:none}}

/* 增量角标：累计值跳变时在数字右上角浮出 +N，随即淡出。
   为什么要它——今天 Tokens 基数 6500 万，一次请求 +1 万占 0.015%，
   「从 6570 万爬到 6571 万」肉眼等于没动；但「跳了一下 +12,043」看得清清楚楚。
   所以累计量不做连续滚动（那是拿插值骗人），改用「跳变 + 角标」表达实时。 */
.ldelta{display:inline-block;font-size:11px;font-weight:700;color:var(--acc-fg);
  vertical-align:super;margin-left:5px;opacity:0;pointer-events:none;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ldelta.show{animation:ldeltaPop 2.4s ease-out forwards}
@keyframes ldeltaPop{
  0%{opacity:0;transform:translateY(4px)}
  12%{opacity:1;transform:translateY(0)}
  70%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-4px)}
}
@media(prefers-reduced-motion:reduce){
  .ldelta.show{animation:none;opacity:1}
  .ldelta{transition:opacity .4s}
}
/* 局部更新过的节点给一个极短的背景闪，让「这一格刚变了」有落点。
   只染背景不染字，配合 delta 角标，实时感来自「变化被定位到具体数字」。 */
.lv{transition:background-color .5s ease-out;border-radius:4px}
.lv.flash{background-color:var(--acc-soft);transition:none}

/* ---------- 正在发生（实时活跃态） ---------- */
/* 概览顶部这块和下面的累计卡是两种东西：累计是「一共多少」，这里是「此刻在干嘛」。
   它的数字是真正连续的（在飞请求、当前模型、实时速度），不参与区间累计口径。 */
.livebar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line2);
  border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden;background-clip:padding-box}
.livebar>div{background:var(--panel);padding:10px 13px;min-width:0}
.livebar .lk{font-size:11px;color:var(--fg3);display:flex;align-items:center;gap:5px}
.livebar .lk .dot{width:6px;height:6px;border-radius:50%;background:var(--fg4);flex:none}
.livebar.on .lk .dot{background:var(--acc);animation:ratePulse 1.4s ease-in-out infinite}
.livebar .lv-v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.livebar .lv-n{font-size:10.5px;color:var(--fg4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.livebar{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.livebar{grid-template-columns:repeat(2,1fr)}}

/* ---------- 三类量：累计 / 速率 / 均值 ----------
   把不同性质的数字用不同视觉语言区分开，用户一眼就知道「这个该动」还是
   「这个不该动」。混在一起显示就会让人以为均值卡死了：
     .lv-cum  累计量：跳变 + 增量角标（基数大，爬升看不见，跳变看得见）
     .lv-rate 速率量：真·连续变化（短窗口），给一个呼吸的活性点提示它在动
     .lv-avg  均值量：区间平均，天生迟钝，明确标注口径且不给任何动画暗示 */
.lv-rate{position:relative}
.lv-rate::after{content:"";position:absolute;top:1px;right:-9px;width:5px;height:5px;
  border-radius:50%;background:var(--acc);opacity:.85;animation:ratePulse 1.8s ease-in-out infinite}
@keyframes ratePulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.lv-rate::after{animation:none;opacity:.6}}
.lv-avg{color:var(--fg)}
/* 均值卡右侧的「区间平均」小标：让人知道为什么不跳。 */
.avgmark{display:inline-block;font-size:10px;font-weight:500;color:var(--fg4);
  border:1px solid var(--line3);border-radius:4px;padding:0 4px;margin-left:6px;
  vertical-align:2px;letter-spacing:.2px}

/* .mini 是「卡片但可点」（源类型统计块、快捷入口）。原来边框比普通卡片还淡，
   看起来像静态信息块；升到 --line3 并让 hover 走主色，和不可点的 .card 拉开。 */
.mini{border:1px solid var(--line3);border-radius:var(--r2);padding:13px 15px;cursor:pointer;
  background:var(--panel);transition:border-color .12s,box-shadow .12s}
.mini:hover{border-color:var(--acc);box-shadow:var(--sh2)}
.mini .t{font-size:13px;font-weight:600}
.mini .c{font-size:24px;font-weight:700;margin:6px 0 3px;font-variant-numeric:tabular-nums}
.mini .d{font-size:11.5px;color:var(--fg3);line-height:1.6}
.bar-track{height:4px;border-radius:3px;background:var(--hover);overflow:hidden;margin-top:9px}
.bar-fill{height:100%;background:var(--acc);border-radius:3px}

/* 概览：KPI 行 5 列（宽屏一排放得下），窄屏自动降列。 */
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
@media(max-width:1400px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.grid5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.grid5{grid-template-columns:1fr}}
/* 迷你趋势图：每天一根柱，高度按区间峰值归一。 */
.trend{display:flex;align-items:flex-end;gap:4px;height:104px;padding-top:2px}
.trend .tb{flex:1 1 0;min-width:5px;max-width:46px;border-radius:3px 3px 0 0;background:var(--acc);opacity:.85}
.trend .tb:hover{opacity:1}
.trend .tb.zero{opacity:.18}
/* 回填日（输入 token 缺失）：用邪纹区分于完整日，不靠颜色变化 */
.trend .tb.part{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 3px,transparent 3px 6px)}
.trend-x{display:flex;gap:4px;margin-top:7px;font-size:10.5px;color:var(--fg4)}
.trend-x .tx{flex:1 1 0;min-width:5px;max-width:46px;text-align:center;white-space:nowrap;overflow:hidden}
/* 占比条：表格里的横向比例。 */
.sharetrack{display:inline-block;width:100%;height:6px;border-radius:3px;background:var(--hover);
  overflow:hidden;vertical-align:middle}
.sharetrack>i{display:block;height:100%;background:var(--acc);border-radius:3px}
/* 状态环：conic-gradient 画一圈，不引图表库。 */
.donuts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.donuts{grid-template-columns:repeat(2,1fr)}}
.donut{display:flex;flex-direction:column;align-items:center;gap:7px}
.donut .ring{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.donut .ring>span{width:46px;height:46px;border-radius:50%;background:var(--panel);
  display:flex;align-items:center;justify-content:center}
.donut .lbl{font-size:11.5px;color:var(--fg3);text-align:center}

/* 按钮边界：这一段是「可点的东西看起来可点」的全部依据。
   之前 button 的边框和 .card 同为 var(--line)，在一堆卡片里几乎看不出来，
   导致「刷新」「删除」这些按钮要盯着找才看得见。现在：
     - 边框升到 --line3（比卡片深一档）
     - 背景给 --panel，卡片是 --panel → 改用极轻的 --soft2 让它「浮」出卡片
     - hover 时边框升到主色，边界立刻明确
   只改可点元素；.tag / .stat / .mstrip 这些只读信息一律不加框。 */
button{background:var(--soft2);border:1px solid var(--line3);color:var(--fg);
  border-radius:var(--r3);padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;
  box-shadow:0 1px 1px rgba(16,16,16,.03);transition:background .12s,border-color .12s}
button:hover:not(:disabled):not(.chip){border-color:var(--acc);background:var(--panel)}
button:disabled{opacity:.5;cursor:not-allowed}
button:active:not(:disabled):not(.chip){transform:translateY(1px);box-shadow:none}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--dark);border-color:var(--dark);color:var(--on-dark);font-weight:500;
  box-shadow:0 1px 2px rgba(16,16,16,.14)}
button.pri:hover:not(:disabled){background:var(--dark-hover);border-color:var(--dark-hover)}
button.gh{background:var(--panel)}
/* .tiny 是页面上最常见的次级动作（复活 / 禁用 / 删除 / 清冷却）。
   原来 padding 5px 11px 让它只有 28px 高，触区偏小且边界几乎不可见。
   加到 7px 12px / 30px 高，边界升到 line3。 */
/* .tiny 排在 .pri 之后（都是 button.xxx，特异性相同），光靠 .pri{background:var(--dark)}
   会被下面这条的 background:var(--panel) 覆盖 —— 结果是「选中态」底色被抹成白底，
   而 .pri 的 color:var(--on-dark) 还是白字，等于选中项白底白字（看着像透明）。
   组合类必须显式声明，不能指望单类规则的书写顺序。 */
button.tiny.pri,button.pri.tiny{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
button.tiny.pri:hover:not(:disabled),button.pri.tiny:hover:not(:disabled){background:var(--dark-hover);border-color:var(--dark-hover)}
button.tiny{padding:7px 12px;font-size:12.5px;border-color:var(--line3);background:var(--panel)}
/* 关键动作（刷新/重扫）用 .rf：带图标 + 主色描边，和一片白底的普通按钮拉开层次。 */
button.rf{display:inline-flex;align-items:center;gap:6px;color:var(--acc-fg);
  border-color:var(--acc-bg);background:var(--panel)}
button.rf:hover:not(:disabled){border-color:var(--acc);background:var(--acc-bg)}
button.rf svg{width:14px;height:14px}
button.withico{display:inline-flex;align-items:center;gap:5px}
button.withico svg{width:13px;height:13px}
/* 关键动作行（Codex 接入 / 还原）：按钮放进独立容器，别再和普通 hint 挤在一行看不出主次 */
.actionbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:11px 13px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--soft2)}
.actionbar button{display:inline-flex;align-items:center;gap:6px}
.actionbar button svg{width:15px;height:15px}
/* ---- 开关（设置页） ----
   用 iOS 那种 pill 开关而不是复选框：开关本身就是「这一项开没开」的答案，
   不需要旁边的文字重复一遍；开关态用主色填充，边界清晰，一眼能扫到哪些开着。 */
button.toggle{position:relative;width:40px;height:23px;flex:0 0 40px;border-radius:999px;
  border:1px solid var(--line3);background:var(--panel);padding:0;cursor:pointer;
  transition:background .16s,border-color .16s}
button.toggle:hover:not(:disabled){border-color:var(--acc)}
button.toggle .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--fg3);transition:transform .16s,background .16s}
button.toggle.on{background:var(--acc);border-color:var(--acc)}
button.toggle.on .knob{transform:translateX(17px);background:#fff}
button.toggle.big{width:46px;height:26px;flex:0 0 46px}
button.toggle.big .knob{width:20px;height:20px}
button.toggle.big.on .knob{transform:translateX(19px)}
button.toggle:disabled{opacity:.5;cursor:default}
/* 悬浮窗设置行：标题 + 说明一行，左文右开关，边界描出来才知道可点 */
.fwrow{display:flex;align-items:center;gap:14px;padding:11px 13px;margin-bottom:8px;
  border:1px solid var(--line2);border-radius:var(--r2);background:var(--soft2)}
.fwrow:hover{border-color:var(--line3)}
.fwrow .fwtxt{flex:1;min-width:0}
.fwrow .fwtxt b{display:flex;align-items:center;gap:6px;font-weight:500;font-size:13.5px}
.fwrow .fwtxt b svg{width:14px;height:14px;color:var(--fg3)}
.fwrow .hint{display:block;margin-top:2px}
button.gh.warn-gh{color:var(--danger-fg);border-color:var(--err-line)}
button.gh.warn-gh:hover:not(:disabled){border-color:var(--danger);background:var(--err-bg)}

input,select,textarea{border:1px solid var(--line);border-radius:var(--r3);
  padding:7px 10px;font-size:13px;color:var(--fg);background:var(--panel);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
textarea{min-height:104px;resize:vertical;font-family:Consolas,"Cascadia Mono",monospace;
  font-size:12px;line-height:1.65}
label.f{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:5px}
.field{margin-bottom:13px}
.hint{font-size:11.5px;color:var(--fg4);margin-top:5px;line-height:1.65}

/* 分段控件（今天/7天/30天/全部 这类切换）：
   容器边框升到 --line3 让它「是个控件」而不是一段文字；
   选中项除了底色还加主色描边——只靠底色差在低对比屏上分不清选中没选中。 */
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line3);
  border-radius:10px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{border:1px solid transparent;background:transparent;padding:6px 14px;border-radius:7px;
  font-size:13px;color:var(--fg2);box-shadow:none}
.seg button:hover:not(.on){color:var(--fg)}
.seg button.on{background:var(--panel);color:var(--fg);font-weight:550;
  border-color:var(--acc-bg);box-shadow:0 1px 2px rgba(16,16,16,.07)}
.seg button .b{font-size:11px;color:var(--fg4);margin-left:6px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line3);background:var(--panel);border-radius:999px;padding:5px 13px;
  font-size:12.5px;color:var(--fg2);cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* .chip.on 要压过上面的全局 button:hover（那条特异性 0,2,1 比 .chip.on 的 0,2,0 高），
   否则鼠标停在选中的 chip 上时深色底被换成近白底、而 color:#fff 还在 —— 白字白底看不见。 */
.chip.on,.chip.on:hover{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}

/* 列多的表放在会横向滚动的容器里：整页不出现横向滚动条，列宽也不被压扁 */
/* 活跃热力图：周几（7 行）× 小时（24 列）。窄屏横向滚动兜住，不缩成一团。 */
.heatwrap{overflow-x:auto;padding-bottom:4px}
.hrow{display:flex;gap:3px;align-items:center;margin-bottom:3px;min-width:max-content}
.hlabel{width:34px;flex:0 0 34px;font-size:11px;color:var(--fg3);text-align:right;padding-right:5px}
.hlab{width:22px;flex:0 0 22px;font-size:10px;color:var(--fg4);text-align:center}
.hc{width:22px;height:22px;flex:0 0 22px;border-radius:4px;font-size:10px;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  border:1px solid var(--line2)}
.tablewrap{overflow-x:auto;margin:0 -2px}
.tablewrap table{min-width:100%}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line2);
  vertical-align:middle;font-size:13px}
th{font-size:11.5px;color:var(--fg3);font-weight:500;padding-top:4px;padding-bottom:8px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.dim td{opacity:.55}
td.num{font-variant-numeric:tabular-nums}
/* 可排序表头：默认不抢眼，悬停/当前排序列才上强调色 */
th.sorth{cursor:pointer;user-select:none}
th.sorth:hover{color:var(--fg)}
th.sorth.on{color:var(--fg)}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}

.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--fg2);white-space:nowrap}
.tag.ok{color:var(--acc-fg);border-color:var(--acc-bg);background:var(--acc-bg)}
.tag.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.tag.err{color:var(--danger-fg);border-color:var(--err-line);background:var(--err-bg)}
.tag.mut{color:var(--fg4)}

.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 14px;font-size:13px}
/* mstrip 紧凑指标条：替代 4 个大 KPI 的补充信息位，一行放 6 个小量，
   用来承接后端已有但没画出来的字段（credit / prompt / completion / 缓存写入…）。 */
.mstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line2);
  border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden}
.mstrip>div{background:var(--panel);padding:9px 12px}
.mstrip .mk{font-size:11px;color:var(--fg3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.mstrip .mv{font-size:15px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
@media(max-width:1200px){.mstrip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.mstrip{grid-template-columns:repeat(2,1fr)}}
.kv>div:nth-child(odd){color:var(--fg3);font-size:12.5px}
/* codebox：Codex 配置改前/改后对照。等宽、可滚、限高，避免长配置把页面撑爆。 */
.codebox{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:12px;line-height:1.5;white-space:pre;overflow:auto;max-height:300px;margin:0}
.empty{border:1px dashed #dcdcd8;border-radius:var(--r2);padding:26px 20px;
  text-align:center;color:var(--fg3);font-size:13px;background:var(--panel2)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:12px;color:var(--fg3);line-height:1.85}
.note b{color:var(--fg2);font-weight:600}
/* .link：正文里的可点跳转（帮助页四步走 → 对应页签）。 */
.link{color:var(--acc);cursor:pointer;border-bottom:1px dashed currentColor}
.link:hover{color:var(--acc-fg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
/* 工具栏里的行内复选框标签：整块占位、绝不换行。
   flex 子项默认 flex-shrink:1，中文又能逐字断行 —— 不给 nowrap 就会被压成竖排三行。 */
.inlinechk{display:inline-flex;align-items:center;gap:6px;margin:0;flex:0 0 auto;
  white-space:nowrap;cursor:pointer;font-size:11.5px;color:var(--fg4);line-height:1.65}
.inlinechk input{width:14px;height:14px;margin:0;accent-color:var(--acc);cursor:pointer}
.hidden{display:none}
.copy{cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.copy svg{width:13px;height:13px;opacity:.5}
.copy:hover{color:var(--acc)}
ol.steps{margin:0;padding-left:20px;font-size:13px;color:var(--fg2);line-height:2}
ol.steps code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12px}

#toast{position:fixed;right:24px;bottom:22px;z-index:40;display:flex;flex-direction:column;
  gap:9px;align-items:flex-end}
.toast{background:var(--panel);border:1px solid var(--line3);border-radius:var(--r2);
  padding:10px 14px;font-size:13px;box-shadow:var(--sh2);
  max-width:440px;line-height:1.65}
.toast.ok{border-left:3px solid var(--acc)}
.toast.err{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid #9aa0a6}
.pop{position:absolute;right:40px;top:66px;z-index:30;background:var(--panel);
  border:1px solid var(--line3);border-radius:var(--r2);padding:14px;width:330px;
  box-shadow:var(--sh3)}
/* 输出白名单：可勾选的模型清单（每行 勾选框 / 客户端看到的模型名 / 上游名 / 标位） */
.mlist{border:1px solid var(--line2);border-radius:var(--r2);max-height:470px;overflow:auto}
/* 第二列（模型名）用 max-content 自适应：写死上限（216/300px）时，长 id
   （kilo:nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free 这类 50+ 字符）
   一律被省略号截断，而右边第三列（中文名）却空着一大片。max-content 让这一列
   按最长 id 撑开、把富余宽度让给名字列；窗口窄时 min 值 150px 兜底、省略号照常生效。
   min-height + align-items:center 让带费率标签的行与不带的行等高。 */
.mrow{display:grid;grid-template-columns:18px minmax(150px,max-content) minmax(0,1fr) auto;align-items:center;
  min-height:41px;gap:10px;padding:8px 13px;border-bottom:1px solid var(--line2);font-size:12.5px;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--hover)}
.mrow.off{opacity:.5}
/* 未授权：上游目录里有、号池里没有任何号有额度跑它。看得见、能勾，但默认收起。 */
.mrow.unent{opacity:.62}
.mlist.hideunent .mrow.unent{display:none}
/* 只看免费：opencode Zen 的目录是整家厂商的（79 个），用户实际能用的往往只有免费层。
   勾上后收起非免费行（与「显示未授权」同一套做法：纯 CSS，不动勾选状态、不改计数口径）。 */
.mlist.freeonly .mrow.paid{display:none}
.mrow input{width:15px;height:15px;margin:0;accent-color:var(--acc);cursor:pointer}
.mrow .mid{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mname{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mbits{display:flex;gap:5px;justify-content:flex-end}
/* 输出白名单的 producer 分组表头（workbuddy / zcode 各一段） */
.mgroup{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:7px 13px;background:var(--soft2);border-bottom:1px solid var(--line2);
  font-size:12px;color:var(--fg2);position:sticky;top:0;z-index:1}
/* 发布清单两级折叠：来源表头可点，收起时只留这一行摘要（181 个模型平铺太累）。
   只有 .tog 才是可点的——出口自己那份清单复用 .mgroup 但不折叠。 */
.mgroup.tog{cursor:pointer;user-select:none}
.mgroup.tog:hover{background:var(--hover2)}
.mgroup .mcaret{display:inline-block;width:10px;margin-right:1px;color:var(--fg3);
  transition:transform .12s ease}
.mgroup.open .mcaret{transform:rotate(90deg)}
.mbody{display:none}
.mgroup.open + .mbody{display:block}
@media(max-width:860px){.mrow{grid-template-columns:18px minmax(0,1fr) auto}.mrow .mname{display:none}}
/* 多出口：每个出口一块；「服务来源」用圆角标签勾选 */
.chan{border:1px solid var(--line2);border-radius:var(--r2);padding:13px 15px;margin-bottom:12px}
.chan-head{display:flex;gap:10px;align-items:center;margin-bottom:11px}
.chan-head input{font-weight:600}
.chan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chan-grid .field{margin-bottom:0}
@media(max-width:1000px){.chan-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.chan-grid{grid-template-columns:1fr}}
.ptog{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:var(--fg2);cursor:pointer;background:var(--panel)}
.ptog input{width:13px;height:13px;margin:0;accent-color:var(--acc);cursor:pointer}
.ptog.on{border-color:#cdeade;background:var(--acc-bg);color:#0f7a5a}
.chan-url{font-size:12px;color:var(--fg3);margin-top:11px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 出口的共享字段收进折叠区：默认只看「端口 + 服务来源」，要覆盖主口参数时才展开。 */
.chan-adv{margin-top:11px;border-top:1px dashed var(--line2);padding-top:9px}
.chan-adv>summary{cursor:pointer;font-size:12px;color:var(--fg2);list-style:none;display:flex;gap:8px;align-items:center}
.chan-adv>summary::-webkit-details-marker{display:none}
.chan-adv>summary::before{content:"\25B8";color:var(--fg3);font-size:10px}
.chan-adv[open]>summary::before{content:"\25BE"}
.chan-adv .chan-grid{margin-top:10px}
/* 网关开关（只在桌面程序里出现）：一排「状态点 + 文案 + 按钮」，不用表格。 */
.gwrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gwdot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:#d4d4d0}
.gwdot.on{background:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.gwtext{flex:1;min-width:220px}
.gwtext .t{font-size:14px;font-weight:600}
.gwtext .d{font-size:12px;color:var(--fg3);margin-top:2px;line-height:1.6}
.gwbtn{min-width:118px;justify-content:center;display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" id="brandLogo" aria-hidden="true"></div>
      <div><b>Free2API</b><span>网关控制台</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span class="dot" id="svcDot"></span>
      <span id="svcText">连接中…</span>
    </div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <button class="ic" id="btnTheme" title="切换深色 / 浅色"></button>
      <button class="ic" id="btnKey" title="设置网关密钥"></button>
      <button class="ic" id="btnRefresh" title="刷新全部数据"></button>
    </div>
    <div id="keyPop" class="pop hidden">
      <h2 style="font-size:14px">网关密钥（api_key）</h2>
      <div class="sub" style="margin:6px 0 10px">
        只在网关配了 <span class="mono">api_key</span> 时才需要填。默认不配：本机直连免密钥。
      </div>
      <input id="keyInput" type="password" placeholder="留空 = 不使用密钥">
      <div class="row" style="margin-top:10px">
        <button class="pri tiny" id="btnKeySave">保存并刷新</button>
        <button class="tiny" id="btnKeyClose">关闭</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- 基础工具 ---------- */

   window.__F2A_DESKTOP__ / window.__F2A_BASE__：前者决定要不要显示网关开关，
   后者是真正的网关地址（控制服务端口是随机分配的，不能拿 location.origin 当网关）。
   在浏览器里直接打开网关自己的管理页时这两个变量都不存在，行为与以前完全一致。 */
const DESKTOP = !!window.__F2A_DESKTOP__;
function gwBase(){ return window.__F2A_BASE__ || location.origin || ""; }
const $  = (s, r) => (r || document).querySelector(s);

const ICON = {

  layers: "M12 3l9 5-9 5-9-5zM3 13.5l9 5 9-5",
  plug: "M9 3v4M15 3v4M6 7h12v3a6 6 0 11-6 6 6 6 0 11-6-6zM12 19v1.5",
  help: "M12 21a9 9 0 100-18 9 9 0 000 18zM9.6 9.3a2.5 2.5 0 114.4 1.6c-.8.9-2 1.2-2 2.6M12 17h.01",
  refresh: "M21 12a9 9 0 11-2.6-6.4M21 3v6h-6",
  key: "M7 11V8a5 5 0 0110 0v3M5 11h14v9H5zM12 15v2",
  copy: "M9 9h10v11H9zM5 15V4h10",
  chart: "M4 20V10M10 20V4M16 20v-7M22 20H2",
  pulse: "M2 12h4l2.5-6 3.5 12 3-8 2 2h5",
  clock: "M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3.5 2",
  trash: "M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6",
  warn: "M12 3l9.5 17H2.5zM12 10v4M12 17h.01",
  eye: "M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z",
  check: "M4 12.5l5 5L20 6.5",
  undo: "M4 10h9a5 5 0 010 10h-6M4 10l4-4M4 10l4 4",
  /* swap：上行向右、下行向左的双向箭头（品牌图标，与 exe 图标同形） */
  swap: "M3.5 8.5h13M13 5.5l3.5 3-3.5 3M20.5 15.5h-13M11 12.5l-3.5 3 3.5 3",
  sun: "M12 17a5 5 0 100-10 5 5 0 000 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
  moon: "M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z",
  search: "M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3",
  shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
  sliders: "M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M7 14v6"
};
function svg(k, cls){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round"' + (cls ? ' class="' + cls + '"' : '') +
    '><path d="' + ICON[k] + '"/></svg>';
}
function applyTheme(){
  var t = S.theme;
  if (!t){
    var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    t = (mq && mq.matches) ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
  var b = document.getElementById("btnTheme");
  if (b) b.innerHTML = svg(t === "dark" ? "sun" : "moon");
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  S.theme = cur === "dark" ? "light" : "dark";
  localStorage.setItem("f2a_theme", S.theme);
  applyTheme();
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
function fmtTime(t){
  // 两种口径都认：unix 秒/毫秒（各 admin 端点）与 RFC3339 字符串（/v1/stats 的
  // since / last_seen 走 Go 的 time.Time，序列化出来是 ISO 串）。以前只认数字，
  // 字符串一律显示成 "—"。
  var d;
  if (typeof t === "string" && t){
    d = new Date(t);
    if (isNaN(d.getTime())) return "—";
  } else {
    var n = Number(t) || 0; if (!n) return "—";
    if (n > 1e12) n = Math.floor(n / 1000);
    d = new Date(n * 1000);
  }
  var p = function(x){ return (x < 10 ? "0" : "") + x; };
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function futureTime(t){
  if (!t) return false;
  var d = new Date(t);
  if (isNaN(d.getTime())) return false;
  return d.getTime() > Date.now() + 1000;
}
function durNum(s){
  s = Number(s) || 0;
  if (s <= 0) return "—";
  if (s < 60) return s + " 秒";
  if (s < 3600) return Math.round(s / 60) + " 分钟";
  return (s / 3600).toFixed(1) + " 小时";
}
function toast(kind, text, ms){
  var box = $("#toast"), el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = text;
  box.appendChild(el);
  setTimeout(function(){
    el.style.transition = "opacity .3s"; el.style.opacity = "0";
    setTimeout(function(){ el.remove(); }, 320);
  }, ms || 3600);
}
function ApiErr(m){ this.message = m; }
ApiErr.prototype = Object.create(Error.prototype);
async function api(path, opt){
  var o = Object.assign({}, opt || {});
  o.headers = Object.assign({ "Accept": "application/json" }, o.headers || {});
  if (o.body && typeof o.body !== "string"){ o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(o.body); }
  if (S.apiKey) o.headers["Authorization"] = "Bearer " + S.apiKey;
  var r;
  try { r = await fetch(path, o); }
  catch (e) { throw new ApiErr("连不上网关（" + e.message + "）"); }
  var raw = await r.text(), j = null;
  try { j = raw ? JSON.parse(raw) : null; } catch (e) {}
  if (!r.ok){
    var m = (j && ((j.error && j.error.message) || j.message)) || ("HTTP " + r.status);
    if (r.status === 401) throw new ApiErr("401 未授权：本网关配了 api_key。点右上角钥匙图标填入密钥后重试。");
    if (r.status === 404) throw new ApiErr("404 未找到：" + m + "（管理端点要求 config.json 里 admin.enabled=true）");
    throw new ApiErr(m);
  }
  return j;
}

function go(tab, opt){
  var prevTab = S.tab;
  S.tab = tab;
  // 区间是「每页各自的选择」：切到没切过的那页就用它的默认值（概览=今天、
  // 统计=7 天）。S.statsRange 是全局生效值（数据只拉一份），所以切页时要重设，
  // 不然概览会拿 7 天的数据却写着「今天 Tokens」。
  if (tab === "overview" || tab === "stats"){
    var want = statsRangeFor(tab);
    if (want !== S.statsRange){
      S.statsRange = want;
      S.stats = null;          // 别拿旧区间的数字冒充新口径
      resetStatsStream();      // SSE 的 range 建连时定死，必须重连
      loadStats().then(function(){ if (S.tab === tab) render(); });
    }
  }
  if (tab === "pool" && !S.credits) loadCredits(false);
  // 切到统计页时先画骨架、数据回来再重画：少了这个 then，用户会一直停在「读取中」
  // 直到后台 30s 轮询把数据填上（踩过——`if (!S.stats) loadStats();` 之后没人 render）。
  if (tab === "stats" && !S.stats){
    loadStats().then(function(){ if (S.tab === "stats") render(); });
  }
  if (tab === "runtime" && !S.schedule){
    loadRuntime().then(function(){ if (S.tab === "runtime") render(); });
  }
  if (tab === "settings" && DESKTOP && !S.floatwin){
    floatLoad().then(function(){ if (S.tab === "settings") render(); });
  }
  if (tab === "overview" && (!S.stats || !S.schedule)){
    ensureOverview().then(function(){ if (S.tab === "overview") render(); });
  }
  if (opt && opt.srcTab) S.srcTab = opt.srcTab;
  if (tab !== "sources"){ S.cand = null; }
  if (tab !== "output"){ S.chanDraft = null; }
  S.checked = {};
  render(); window.scrollTo(0, 0);
}
function render(opt){
  // 输出页上可能有没保存的出口编辑（输入框 + 勾选）：先把 DOM 里的现值收进草稿再整页重画。
  // 否则后台 15s 一次的健康轮询一 render，用户敲了一半的端口/勾选就被服务端旧值顶掉。
  // keepDraft=true：调用方（新增/删除出口）已经改好了 S.chanDraft，别再拿「重画前的旧 DOM」
  // 回读一遍——否则刚删掉的行会被原样读回来，表现成「点删除没反应」。
  if (S.tab === "output" && !(opt && opt.keepDraft)) captureChanDraft();
  // Codex 一键接入那两个输入框同理：它们只被 codex-preview 读一次，而后台 30s
  // 状态轮询会 render() —— 输入框用 suggested_* 重填，用户刚敲的 Base URL 就被
  // 顶回旧值，于是「预览改动」永远拿旧 URL，看着像改了没生效。
  if (S.tab === "output") captureCodexDraft();
  // 后台轮询也会走到这里（30s 状态 / 3s 余额）：innerHTML 整页重画会把滚动位置清零，
  // 用户正勾着发布清单就被拽回列表顶部（cn:auto 那一行）。先把两处滚动位置记下来，
  // 画完原样放回去——重画不该动用户的视野。
  var keepListTop = 0, l0 = $("#mList");
  if (l0) keepListTop = l0.scrollTop;
  var keepPageTop = window.scrollY || window.pageYOffset || 0;
  var fn = { overview: viewOverview, sources: viewSources, pool: viewPool, output: viewOutput, stats: viewStats, runtime: viewRuntime, settings: viewSettings, help: viewHelp }[S.tab] || viewOverview;
  var down = DESKTOP && S.desk && !(S.desk.running || S.desk.external);
  if (down && S.tab !== "overview" && S.tab !== "help"){
    $("#view").innerHTML = head("网关已停止", "这一页的数据由网关提供，先把它启动起来。") +
      '<div class="card"><div class="gwrow"><span class="gwdot"></span>' +
      '<div class="gwtext"><div class="t">没有可显示的数据</div>' +
      '<div class="d">账号池、来源台账、输出配置都要问运行中的网关拿。启动后这一页会自动恢复。</div></div>' +
      '<button class="pri gwbtn" data-action="gw-start">启动网关</button></div></div>';
  } else {
    $("#view").innerHTML = fn();
  }
  // 折叠区摘要与发布清单计数从刚画出来的 DOM 现算，保证跟勾选状态一致。
  if (S.tab === "output") $$("[data-chan-row]").forEach(function(x){ updChanRow(x.getAttribute("data-chan-row")); });
  renderNav();
  var l1 = $("#mList");
  if (l1 && keepListTop > 0) l1.scrollTop = keepListTop;
  if (keepPageTop > 0) window.scrollTo(0, keepPageTop);
  if (S.tab === "output") applyModelFilter();
  updateSvcDot();
}
/* updateSvcDot 只刷页脚那个服务状态点。健康轮询用它就够了（见 loadHealth），

function updateSvcDot(){
  var dot = $("#svcDot"), t = $("#svcText");
  if (!dot || !t) return;
  // 桌面程序里网关可能是被用户自己关掉的：这时「未连接」会误导成故障，得说清楚。
  if (DESKTOP && S.desk && !(S.desk.running || S.desk.external)){
    dot.classList.add("off");
    t.textContent = S.desk.starting ? "网关正在启动…" : "网关已停止";
    return;
  }
  if (S.health){
    dot.classList.toggle("off", !S.health.healthy);
    t.textContent = S.health.healthy ? ("网关正常 · " + S.health.healthy + "/" + S.health.total + " 可用") : "网关在线 · 无可用账号";
  } else { dot.classList.add("off"); t.textContent = "未连接"; }
}

/* mstrip 一行紧凑指标：值里可带 HTML 时传 true（第四个参数）。

function mstrip(pairs){

  }).join('') + '</div>';

/* ---------- 实时局部更新（live patch） ----------
   动机：SSE 每来一帧就 render() 整页，概览 11 张卡、统计页 85 行模型表全被
   innerHTML 换掉——滚动位置、hover、展开态统统丢失，视觉上就是「闪一下」。
   而数据实际只变了几个数字。所以给这些数字挂 data-live="key"，
   帧到达时只改这些节点的 textContent，其余 DOM 一个都不碰。

   key 的取值与 liveValue(key) 一一对应；两边必须同步改，否则静默不更新。 */

/* liveNode 渲染一个可局部更新的数字节点。
   html=true 时走 innerHTML（值里带标签的用），否则 textContent（更快更安全）。
   kind 标注量的性质（cum 累计 / rate 速率 / avg 均值 / null 不标注），
   只影响 CSS 类，不改渲染逻辑——分类是给人看的，不是行为开关。 */
function liveNode(key, text, html, kind){
  return '<span class="lv' + (kind ? ' lv-' + kind : '') + '" data-live="' + esc(key) + '"' +
    (html ? ' data-live-html="1"' : '') + '>' + (html ? text : esc(text)) + '</span>';
}
/* liveDelta 增量角标：数字跳变时在右侧浮出 +N，2.4s 后淡出。
   累计值基数大（6500 万）时，「爬升」几乎看不见，但「跳了一下」看得见——
   所以累计量用跳变+角标表达实时，比伪造连续滚动诚实也有效。 */
function liveDelta(key){
  return '<span class="ldelta" data-delta="' + esc(key) + '"></span>';
}
/* ovKpi 概览顶部指标卡。v 允许带行内标签（如 17 / 17），所以这里不再 esc。
   key 非空时值与副文本都可局部更新。 */
function ovKpi(k, v, n, key, kind){
  var vk = key ? liveNode(key, v, true, kind) : v;
  var nk = key ? liveNode(key + ".n", n, true) : esc(n);
  return '<div class="stat"' + (key ? ' data-live-card="' + esc(key) + '"' : '') + '>' +
    '<div class="k">' + esc(k) + (kind === "avg" ? '<span class="avgmark">均值</span>' : '') +
    '</div><div class="v">' + vk + (key ? liveDelta(key) : '') +
    '</div><div class="n">' + nk + '</div></div>';
}
/* lbCell 「正在发生」里的一格。与 mstrip 同构（紧凑指标），但值区更大、
   带一个活性点，且整个条在有请求在跑时会亮起（.livebar.on）。 */
function lbCell(key, k, v, n){
  return '<div><div class="lk"><span class="dot"></span>' + esc(k) + '</div>' +
    '<div class="lv-v">' + liveNode(key, v, false, "rate") + '</div>' +
    '<div class="lv-n">' + liveNode(key + ".n", n, false) + '</div></div>';
}
/* ovTrend 逐日请求趋势：数据来自 /v1/stats 的 series（每天一个点，跨重启保留）。
   柱高按区间峰值归一；悬停给出当天请求 / 成功 / 失败 / token。 */
function ovTrend(series){
  var pts = (series || []).slice(-31);
  if (!pts.length) return '<div class="empty">这个区间还没有请求。跑一次对话后刷新，这里就会出现逐日柱状图。</div>';
  var peak = 0;
  pts.forEach(function(p){ var r = Number(p.requests) || 0; if (r > peak) peak = r; });
  var bars = pts.map(function(p){
    var r = Number(p.requests) || 0;
    var h = peak > 0 ? Math.max(r > 0 ? 5 : 1, Math.round(r * 100 / peak)) : 1;
    var title = String(p.day || "") + " · 请求 " + fmtInt(r) + " · 成功 " + fmtInt(p.success) +
      " · 失败 " + fmtInt(p.failed) + " · Tokens " + (p.partial ? "≥" : "") + fmtInt(p.tokens) +
      (p.partial ? "（这天缺输入 token，为下限）" : "");
    return '<div class="tb' + (r > 0 ? "" : " zero") + (p.partial ? " part" : "") +
      '" style="height:' + h + '%" title="' + esc(title) + '"></div>';
  }).join("");
  var step = Math.max(1, Math.ceil(pts.length / 10));
  var xs = pts.map(function(p, i){
    return '<div class="tx">' + (i % step === 0 ? esc(String(p.day || "").slice(5)) : "") + '</div>';
  }).join("");
  var tot = pts.reduce(function(a, p){ return a + (Number(p.requests) || 0); }, 0);
  return '<div class="trend">' + bars + '</div><div class="trend-x">' + xs + '</div>' +
    '<div class="hint" style="margin-top:9px">' + esc(ovRangeName()) + ' 共 ' + fmtInt(tot) +
    ' 次请求，峰值 ' + fmtInt(peak) + ' 次/天。</div>';
}
/* ovDonut 状态环：conic-gradient 画一圈，不引图表库。val 放环心，pct 决定颜色占比。 */
function ovDonut(pct, color, val){
  var p = Math.max(0, Math.min(100, Number(pct) || 0));
  var deg = (p * 3.6).toFixed(1);
  return '<div class="ring" style="background:conic-gradient(' + color + ' ' + deg +
    'deg, var(--hover) ' + deg + 'deg 360deg)"><span>' + esc(val) + '</span></div>';
}
/* ovHealthCard 账号监测：池子当前各种状态的占比环（可用 / 冷却 / 熔断 / 禁用 / 连败 / 低额）。 */
function ovHealthCard(){
  var st = S.status;
  if (!st) return "";
  var acc = st.accounts || [];
  var total = acc.length;
  if (!total) return "";
  var breaker = 0, fails = 0, low = 0;
  acc.forEach(function(a){
    if (futureTime(a.breaker_until)) breaker++;
    if ((a.consecutive_fails || 0) > 0) fails++;
    var c = creditRowOf(a.uid);
    if (c && c.ok && c.total > 0 && (Number(c.remain) || 0) <= c.total * 0.15) low++;
  });
  var items = [
    { k: "可用", n: st.healthy || 0, color: "var(--acc)" },
    { k: "冷却", n: st.cooling || 0, color: "var(--warn)" },
    { k: "熔断", n: breaker, color: "var(--danger)" },
    { k: "禁用", n: st.disabled || 0, color: "var(--fg4)" },
    { k: "连败", n: fails, color: "var(--warn)" },
    { k: "低额", n: low, color: "var(--danger)" }
  ];
  var cells = items.map(function(x){
    return '<div class="donut" title="' + esc(x.k + " " + x.n + " / " + total) + '">' +
      ovDonut(total ? x.n * 100 / total : 0, x.color, String(x.n)) +
      '<div class="lbl">' + esc(x.k) + '</div></div>';
  }).join("");
  return card("账号监测", "池子共 " + total + " 个号，各状态占比。环心是数量，颜色占比按全池算。",
    '<div class="donuts">' + cells + '</div>');
}
/* ovProducersCard 按客户端：账号数来自号池，请求 / token 来自区间统计。 */
function ovProducersCard(){
  var st = S.status;

      '<td>' + producerTag({ producer: x.producer }) + (x.servable ? "" : ' <span class="tag warn">只读</span>') + realmRow + '</td>' +
      '<td class="num">' + fmtInt(x.total) + '</td>' +
      '<td class="num">' + (x.healthy === x.total ? fmtInt(x.healthy)
        : '<span style="color:var(--warn)">' + fmtInt(x.healthy) + '</span>') + '</td>' +
      '<td class="num">' + fmtInt(req) + '</td>' +
      '<td class="num">' + (req ? fmtPct((Number(p.success) || 0) / req) : "—") + '</td>' +
      '<td class="num">' + fmtInt(p.total_tokens) + '</td>' +
      '<td style="width:170px"><span class="sharetrack"><i style="width:' + pct.toFixed(1) + '%"></i></span></td>' +
      '</tr>';

    '<div class="tablewrap"><table><thead><tr><th>客户端</th><th class="num">账号</th><th class="num">可用</th>' +
    '<th class="num">请求</th><th class="num">成功率</th><th class="num">Tokens</th><th>请求占比</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>');
}
/* ovModelsCard 模型用量：区间内按请求数排序的模型 Top N，带请求 / token 占比条。
   与「请求统计」页的按模型表同源（/v1/stats 的 models），这里只取前几名做速览。 */
function ovModelsCard(){
  var s = S.stats;
  if (!s) return "";
  var list = (s.models || []).slice();
  if (!list.length) return "";
  list.sort(function(a, b){
    var d = (Number(b.requests) || 0) - (Number(a.requests) || 0);
    if (d) return d;
    return String(a.model || "") < String(b.model || "") ? -1 : (String(a.model || "") > String(b.model || "") ? 1 : 0);
  });
  var tot = list.reduce(function(a, x){ return a + (Number(x.requests) || 0); }, 0) || 1;
  var maxReq = Number(list[0].requests) || 0;
  var top = list.slice(0, 8);
  var rows = top.map(function(m){
    var req = Number(m.requests) || 0;
    var pct = req * 100 / tot;
    var rate = m.credits || "";
    return '<tr>' +
      '<td><span class="mono">' + esc(m.model) + '</span>' +
        (rate ? ' <span class="tag mut">' + esc(rate) + '</span>' : "") + '</td>' +
      '<td class="num">' + fmtInt(req) + '</td>' +
      '<td class="num">' + (req ? fmtPct((Number(m.success) || 0) / req) : "—") + '</td>' +
      '<td class="num">' + fmtInt(m.total_tokens) + '</td>' +
      '<td class="num">' + fmtPct(m.cache_hit_rate) + '</td>' +
      '<td style="width:180px"><span class="sharetrack"><i style="width:' +
        (maxReq ? (req * 100 / maxReq).toFixed(1) : 0) + '%"></i></span></td>' +
      '<td class="num hint">' + fmtPct(pct / 100) + '</td>' +
      '</tr>';
  }).join("");
  var more = list.length > top.length
    ? '<div class="hint" style="margin-top:9px">另有 ' + (list.length - top.length) + ' 个模型未列出，完整清单看「请求统计」页。</div>'
    : "";
  return card("模型用量（Top " + top.length + " / " + list.length + "）",
    "按「" + ovRangeName() + "」区间内的请求数排序；占比条按榜首归一，最后一列是全区间请求份额。",
    '<div class="tablewrap"><table><thead><tr><th>模型</th><th class="num">请求</th><th class="num">成功率</th>' +
    '<th class="num">Tokens</th><th class="num">缓存命中</th><th>相对榜首</th><th class="num">份额</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' + more +
    '<div class="row" style="margin-top:11px"><button class="tiny" data-goto="stats">查看完整请求统计</button></div>');
}
/* ovChannelsCard 出口清单：主口 + 各专用口，状态 / 端口 / 格式 / 服务来源 / Base URL。 */
function ovChannelsCard(){
  var o = S.out;

}
/* ovCreditsCard 额度与积分：按客户端汇总剩余，并列出「读不到额度 / 剩余不到 15%」的号。 */
function ovCreditsCard(){
  var c = S.credits;
  if (!c) return "";
  var list = c.accounts || [];
  if (!list.length) return "";
  var groups = {};
  list.forEach(function(x){
    var k = x.producer || "none";
    var g = groups[k] || (groups[k] = { n: 0, ok: 0, credit: 0, token: 0, expiring: 0 });
    g.n++;
    if (x.ok) g.ok++;
    if (x.unit === "token") g.token += Number(x.remain) || 0;
    else g.credit += Number(x.remain) || 0;
    g.expiring += Number(x.expiring) || 0;
  });
  var rows = Object.keys(groups).map(function(k){
    var g = groups[k];
    var parts = [];
    if (g.credit) parts.push(fmtInt(Math.round(g.credit)) + " 积分");
    if (g.token) parts.push(fmtNum(g.token, "token") + " token");
    if (!parts.length) parts.push("—");
    return '<tr><td>' + producerTag({ producer: k }) + '</td>' +
      '<td class="num">' + g.ok + ' / ' + g.n + '</td>' +
      '<td class="num">' + esc(parts.join(" · ")) + '</td>' +
      '<td class="num">' + (g.expiring ? '<span style="color:var(--warn)">' + esc(fmtInt(Math.round(g.expiring))) + '</span>' : "0") + '</td></tr>';
  }).join("");
  var warn = list.filter(function(x){
    if (!x.ok) return true;
    return Number(x.total) > 0 && (Number(x.remain) || 0) <= Number(x.total) * 0.15;
  }).slice(0, 8);
  var warnRows = warn.map(function(x){
    var why = !x.ok ? (x.error || x.note || "额度读不到") : ("剩 " + fmtNum(x.remain, x.unit) +
      (x.unit === "token" ? " token" : " 积分") + " / 总 " + fmtNum(x.total, x.unit));
    return '<tr><td><b>' + esc(x.nickname || x.uid) + '</b></td>' +
      '<td>' + producerTag({ producer: x.producer }) + '</td>' +
      '<td class="hint">' + esc(why) + '</td></tr>';
  }).join("");
  var when = c.fetched_at ? fmtTime(c.fetched_at) : "—";
  var body = '<div class="tablewrap"><table><thead><tr><th>客户端</th><th class="num">可读 / 账号</th>' +
    '<th class="num">剩余合计</th><th class="num">快过期</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="hint" style="margin-top:9px">余额直查上游 billing（10 分钟缓存）· 上次 ' + esc(when) +
    (c.refreshing ? " · 正在后台重查…" : "") + '。zcode 的「token」是套餐 token，workbuddy 的是积分。</div>';
  if (warnRows){
    body += '<div class="sep"></div><div style="font-size:13px;font-weight:600;margin-bottom:9px">需要关注（' +
      warn.length + ' 个）</div><div class="tablewrap"><table><thead><tr><th style="width:220px">账号</th>' +
      '<th style="width:120px">客户端</th><th>原因</th></tr></thead><tbody>' + warnRows + '</tbody></table></div>';
  }
  return card("额度与积分", "按客户端汇总剩余额度；下方列出读不到额度或剩余不到 15% 的号。", body,
    '<button class="rf" data-action="credits-refresh" title="立刻重查每个号的积分余额">' + svg("refresh") + '刷新余额</button>');
}
/* ovSourcesCard 来源台账：三种来源各进来多少个号，占池子多少。 */

/* ovScheduleCard 定时任务摘要：只报「几个开着、几点跑」，改开关去运行态页。 */
function ovScheduleCard(){
  var sc = S.schedule;
  if (!sc) return "";
  var tasks = sc.tasks || [];
  if (!tasks.length) return "";
  var on = tasks.filter(function(t){ return t.enabled; });
  var chips = tasks.map(function(t){
    var hrs = (t.hours && t.hours.length)
      ? t.hours.map(function(h){ return (h < 10 ? "0" : "") + h + ":00"; }).join("/") : "—";
    return '<span class="chip" style="cursor:default" title="' + esc(t.note || "") + '">' +

    '<div class="row" style="margin-top:11px"><button class="tiny" data-goto="runtime">去运行态调整</button></div>');
}
function viewOverview(){
  var st = S.status, m = S.models || [];
  var total = st ? st.total : 0, healthy = st ? st.healthy : 0;
  var cooling = st ? st.cooling : 0, disabled = st ? st.disabled : 0;
  var title = "正在连接网关…", sub = "正在读取账号池与来源信息。";
  var dsk = S.desk || null;
  var dskRunning = !!(dsk && (dsk.running || dsk.external));
  if (DESKTOP && dsk && !dskRunning){
    title = "网关已停止";
    sub = dsk.error ? ("上次启动失败：" + dsk.error) : "网关现在不承接任何请求。在下面点「启动网关」即可恢复。";
  }
  if (st){
    if (total === 0){ title = "还没有账号"; sub = "从「获取源」把本机登录态、switch 账本或别的机器导出的文件加进来，网关才有号可用。"; }
    else if (healthy === 0){ title = "账号全部不可用"; sub = "池里有 " + total + " 个账号，但当前没有一个能接请求：全部在冷却 / 熔断 / 已禁用。"; }
    else { title = "网关运行中"; sub = "有 " + healthy + " 个账号可立即承接请求，共 " + total + " 个。"; }
  }
  var base = gwBase();
  var html = head(title, sub);
  if (DESKTOP) html += gwCard(dsk, dskRunning);
  if (DESKTOP && dsk && !dskRunning){
    return html + card("网关停着的时候", "",
      '<div class="sub" style="margin:0">账号池、来源台账、发布清单都存在磁盘上，网关一停只是不再承接请求，' +
      '数据不会丢。把网关启动起来，这一页就会恢复成完整的账号与模型视图。</div>');
  }
  var s = S.stats, t = (s && s.total) || {};
  var rn = ovRangeName();
  var realm = (st && st.realm_totals) || {};
  var cn = realm.cn || {}, gl = realm.global || {};
  var inFlight = 0;
  ((st && st.accounts) || []).forEach(function(a){ inFlight += (a.in_flight || 0); });
  // 正在跑的模型：后端 /status.live_models（按模型维度的在飞计数）。
  // 不用 accounts[].in_flight 反推——那个只说「哪个号在忙」，没有模型信息。
  var hotModels = (st && st.live_models) || {};
  var live = (s && s.live) || {};
  var winSec = live.window_sec || 60;
  var hotList = Object.keys(hotModels).sort(function(a, b){ return hotModels[b] - hotModels[a]; });
  var hotText = hotList.length ? (hotList.length === 1 ? hotList[0] : (hotList.length + " 个模型"))
    : (live.requests ? "—" : "空闲");
  html += '<div class="grid5">' +
    ovKpi("账号可用", fmtInt(healthy) + ' <span style="font-size:14px;font-weight:400;color:var(--fg3)">/ ' + fmtInt(total) + '</span>',
      "CN " + (cn.total || 0) + " · 国际 " + (gl.total || 0) + " · 冷却 " + cooling + " · 禁用 " + disabled) +
    ovKpi("对外模型", fmtInt(m.length), m.length ? "GET /v1/models" : "需要健康账号") +
    ovKpi(rn + "请求", fmtInt(t.requests), "成功 " + fmtInt(t.success) + " · 失败 " + fmtInt(t.failed), "ov.requests", "cum") +
    ovKpi(rn + " Tokens", ((s && s.partial_days) ? "≥" : "") + fmtInt(t.total_tokens),
      (s && s.partial_days) ? ("下限：" + s.partial_days + " 天缺输入 token · 缓存命中率 " + fmtPct(t.cache_hit_rate))
        : ("缓存命中率 " + fmtPct(t.cache_hit_rate)), "ov.tokens", "cum") +
    ovKpi("平均延迟", fmtDur(t.avg_latency_ms), "首字 " + fmtDur(t.avg_ttfb_ms) + " · 在飞 " + fmtInt(inFlight), "ov.latency", "avg") +
    '</div>';
  // 「正在发生」：与上面那排累计卡是两种东西。累计卡答「一共多少」（区间口径、
  // 该迟钝就迟钝）；这块答「此刻在干嘛」——在飞请求、正在跑的模型、最近 60 秒的
  // 速度。放在累计之上是因为它是概览真正实时的那部分。
  html += '<div class="row" style="margin-bottom:10px;align-items:center">' +
    statsRangeSeg() + statsLiveTag() + '</div>' +
    '<div class="livebar' + (inFlight > 0 ? ' on' : '') + '" data-live-bar="1">' +
    lbCell("lv.inflight", "在飞请求", fmtInt(inFlight), inFlight > 0 ? (inFlight + " 个正在跑") : "当前空闲") +
    lbCell("lv.model", "正在跑", hotText, hotList.length === 1 ? "1 个模型" : (hotList.length ? hotList.length + " 个模型" : "没有请求在跑")) +
    lbCell("lv.rate_tps", "实时速度", (live.tokens_per_sec ? Number(live.tokens_per_sec).toFixed(1) : "—"),
      live.tokens_per_sec ? "tok/s · 生成阶段" : "最近 " + winSec + "s 无输出") +
    lbCell("lv.rate_req", "近 " + winSec + "s 请求", fmtInt(live.requests || 0),
      "成功 " + fmtInt(live.success || 0) + " · 失败 " + fmtInt(live.failed || 0)) +
    lbCell("lv.rate_tok", "近 " + winSec + "s 生成", fmtInt(live.completion_tokens || 0),
      live.samples ? (live.samples + " 次观测") : "窗口内无观测") +
    '</div>' +
    '<div class="hint" style="margin:-4px 0 12px">「最近 ' + winSec + ' 秒」是滚动窗口，随每个请求落地而变；上面那排累计卡按下方区间统计，是累计口径。</div>';
  var trend = card("请求趋势（" + rn + "）", "每天一根柱，悬停看当天请求 / 成功 / 失败 / token。", ovTrend(s && s.series));
  var health = ovHealthCard();
  html += health ? ('<div class="grid2">' + trend + health + '</div>') : trend;
  html += ovProducersCard();
  html += ovModelsCard();
  html += ovChannelsCard();
  html += ovCreditsCard();
  html += ovSourcesCard();
  html += ovScheduleCard();
  var steps;
  if (total === 0) steps = [
    "打开「获取源」，先看「应用内登录态」能不能直接读（只有明文 json 才读得动）",
    "读不出来就走「switch 账本」：选中 WorkBuddy 账本，点「全部导入」",
    "拿到别的机器导出的文件，在「导入文件」里选好归属来源后粘进来",
    "回「账号池」确认账号已就位，再去「输出 API」挑格式、写端口"
  ];
  else if (healthy === 0) steps = [
    "打开「账号池」，看每个账号的冷却原因与到期时间",
    "被系统判定坏的号点「复活」；你自己手动摘掉的号点「启用」",
    "余额不足这类硬冷却是等签到恢复，急用就先去「获取源」补别的来源"
  ];
  else steps = [
    "在「输出 API」挑输出格式、写监听端口，可选地设模型前缀和费率后缀",
    "把 Base URL 和密钥填进要用的 AI 客户端（Codex / ZCode / Cherry Studio 都行）",
    "在客户端里拉一次模型列表，确认模型名带着你设的前缀"
  ];
  html += card("下一步", "", '<ol class="steps">' + steps.map(function(s){ return '<li>' + s + '</li>'; }).join("") + '</ol>');
  html += card("接入信息", "把这两项填进任意 OpenAI 兼容客户端即可。",
    kv([
      ["Base URL", copySpan(base + "/v1"), true],
      ["网关密钥", S.apiKey ? (S.apiKey) : "未设置（默认本机直连免密钥）"],
      ["模型列表", copySpan(base + "/v1/models"), true]
    ]));
  return html;
}

/* gwCard 网关开关：只在桌面程序里画。三种状态分开说话，别让用户猜——
   运行中（本窗口宿主）/ 运行中（别的进程，本窗口只当控制台）/ 已停止。 */
function gwCard(d, running){
  var busy = !!(d && d.starting);
  var external = !!(d && d.external && !(d && d.running));
  var state, desc;
  if (busy){
    state = "正在启动…";
    desc = "正在装配号池与监听端口，通常一两秒。";
  } else if (running && external){
    state = "运行中（外部进程）";
    desc = "端口上已经有一个网关在跑（例如计划任务拉起来的）。这个窗口现在只当控制台用，" +
           "点「停止网关」会停掉那个进程，之后可以用这里的「启动网关」重新拉起。";
  } else if (running){
    state = "运行中";
    desc = "网关由本窗口托管，监听 " + esc((d && d.listen) || "") + "。关掉窗口不会停掉它——" +
           "想停就点右边按钮。";
  } else {
    state = "已停止";
    desc = "网关当前不承接请求。点「启动网关」在当前进程里把它拉起来，不需要另开 exe。";
  }
  var btn = running
    ? '<button class="pri gwbtn" data-action="gw-stop"' + (busy ? " disabled" : "") + '>停止网关</button>'
    : '<button class="pri gwbtn" data-action="gw-start"' + (busy ? " disabled" : "") + '>启动网关</button>';
  var err = (d && d.error) ? '<div class="hint" style="color:#b4453f;margin-top:8px">' + esc(d.error) + '</div>' : "";
  return card("网关开关", "整个 free2api 的启停都在这里，不用去碰计划任务或命令行。",
    '<div class="gwrow">' +
      '<span class="gwdot' + (running ? " on" : "") + '"></span>' +
      '<div class="gwtext"><div class="t">' + esc(state) + '</div><div class="d">' + desc + '</div></div>' +
      btn +
    '</div>' + err);
}

/* ---------- 获取源 ---------- */

function kindTag(k){

/* probeRowHtml 探查表的一行（真实数据）。扫描动画完成后用的就是它，保证终态与以前一模一样。
   第二个参数只在扫描动画期间用：给刚检查完的行加一个勾（收尾后自然消失）。 */
function probeRowHtml(p, checked){
  var tick = checked ? '<span class="tick" style="color:var(--acc-fg);margin-right:6px;display:inline-flex;vertical-align:-2px">' + svg("check") + '</span>' : '';
  return '<tr class="' + (p.exists ? "" : "dim") + '">' +
    '<td>' + tick + '<b>' + esc(p.name) + '</b><div class="hint" style="margin:2px 0 0">' + esc(p.producer) + '</div></td>' +
    '<td class="mono" style="word-break:break-all">' + esc(p.path) + '</td>' +
    '<td>' + kindTag(p.kind) + '</td>' +
    '<td class="num">' + (p.readable ? p.accounts : "—") + '</td>' +
    '<td style="color:var(--fg3);font-size:12px">' + esc(p.note) + '</td></tr>';
}
/* scanProbeRowsHtml 扫描进行中的表格内容：逐行「等待 → 检查中 → 已检查」。
   刷新瞬间先把旧内容换成待检查行（只留名字），新数据一到就以新数据为准：已经检查完的
   行直接换成真实行并带一个勾——每出来一个就留住，全部点亮后就是刷新前的完整表格。 */
function scanProbeRowsHtml(){
  var sc = S.scan || { rows: [], at: 0, data: null };
  var hasData = !!(sc.data && sc.data.length);
  var rows = hasData ? sc.data : (sc.rows || []);
  var at = Math.min(sc.at, rows.length);
  var out = [];
  for (var i = 0; i < rows.length; i++){
    var it = rows[i] || {};
    if (hasData && i < at){ out.push(probeRowHtml(it, true)); continue; }
    var cur = (i === at);
    var ico = (i < at) ? '<span style="color:var(--acc-fg)">' + svg("check") + '</span>'
      : (cur ? '<span class="mini-spin"></span>' : '<span class="dot" style="background:var(--line3)"></span>');
    out.push('<tr class="scanrow ' + (i < at ? "done" : (cur ? "cur" : "todo")) + '">' +
      '<td><b>' + esc(it.name || "") + '</b>' +
        (it.producer ? '<div class="hint" style="margin:2px 0 0">' + esc(it.producer) + '</div>' : "") + '</td>' +
      '<td class="mono" style="color:var(--fg4)">—</td>' +
      '<td><span class="hint">—</span></td>' +
      '<td class="num">—</td>' +
      '<td style="color:var(--fg3);font-size:12px">' +
        '<span class="row" style="gap:7px;align-items:center">' + ico +
        esc(i < at ? "已检查" : (cur ? "检查中…" : "等待")) + '</span></td></tr>');
  }
  return out.join("");
}
function panelApp(d){

    '静态钥优先现场问客户端要，取不到时用内置常量，也可用环境变量 WORKBUDDY_AT_REST_SECRET 显式指定）。<br>' +
    '其余工具自己的号取不到时，正经办法是装一个 switch 类账本工具登录一次，再从「switch 账本」整批导入。</div>' +

// kcountLabel 源卡片的计数文案：源里的「存档数」与「真正能进号池的可用数」不是一回事

/* ---------- zcode 候选（这个账号当前能用什么、还剩多少，都在这里看） ---------- */
/* 与 workbuddy 候选的区别：zcode 的凭据不同构、上游不同，所以这张表多三列
   「可用模型 / 探活 / 额度」。探活与读额度都是**按需**触发（每号一次外网往返），
   不在打开页面时静默发生，也不做任何自动轮询。
   注意「可用模型」的判据是套餐/额度的 capabilities，不是 /models 能列出什么：
   周末活动的号 /models 能列 11 个，但只有 glm-5.3-flash 走额度覆盖。 */
var ZCODE_PROBE_VIEW = {
  ok:          { cls: "ok",   txt: "可用" },
  no_balance:  { cls: "warn", txt: "无额度" },
  bad_key:     { cls: "err",  txt: "凭据失效" },
  unreachable: { cls: "mut",  txt: "连不上" },
  error:       { cls: "err",  txt: "探活出错" }
};
function zcodeProbeTag(pr){
  if (!pr) return '<span class="tag mut">未探</span>';
  var v = ZCODE_PROBE_VIEW[pr.status] || { cls: "mut", txt: (pr.status || "未知") };
  var t = pr.msg || "";
  var bits = '<span class="tag ' + v.cls + '">' + esc(v.txt) + '</span>' +
    (pr.http ? ' <span class="tag mut">' + esc(String(pr.http)) + '</span>' : "");
  if (!t) return bits;
  var short = t.length > 42 ? t.slice(0, 42) + "…" : t;
  return '<span title="' + esc(t) + '">' + bits + '</span>' +
    '<div class="hint" style="margin:2px 0 0">' + esc(short) + '</div>';
}
function zcodeModelsCell(x){
  var ent  = (x.entitled_models && x.entitled_models.length) ? x.entitled_models : null;
  var live = (x.live_models && x.live_models.length) ? x.live_models : null;
  var snap = (x.model_ids && x.model_ids.length) ? x.model_ids : null;

  // 读过户/额度的号：以套餐覆盖为准（这才是上游真正放行的模型）。
  if (ent){
    var chips = ent.map(function(id){
      return '<span class="chip" style="cursor:default;padding:4px 11px;font-size:12px">' + esc(id) + '</span>';
    }).join("");
    var listable = (live || snap || []).length;
    var extra = listable > ent.length
      ? '<div class="hint" style="margin:6px 0 0">凭据另可列出 ' + listable + ' 个，但不在套餐覆盖内（调用会被上游拒）</div>'
      : "";
    return '<span class="tag ok">套餐覆盖</span> <b>' + ent.length + '</b> 个' +
      (x.plan_summary ? '<div class="hint" style="margin:3px 0 0">' + esc(x.plan_summary) + '</div>' : "") +
      '<div class="chips" style="margin:6px 0 0">' + chips + '</div>' + extra;
  }

  // 额度读了但没有任何权益（capabilities 为空）：说明上游没给这个号可用范围，
  // 别再说「未读额度」，那是两回事。
  if (x.quota){
    var ids0 = live || snap || [];
    return '<span class="tag warn">上游未给可用范围</span>' +
      (ids0.length ? '<div class="hint" style="margin:4px 0 0">凭据能列出 ' + ids0.length + ' 个，但套餐没说明覆盖哪些，调用能否通过要试</div>' : "") +
      '<div class="hint" style="margin:4px 0 0">额度已读：上游未返回任何权益条目</div>';
  }

  // 还没读额度：只能退到「凭据能列出什么」，明确标注这是弱证据。
  var ids = live || snap || [];
  if (!ids.length){
    return x.usable
      ? '<span class="hint" style="margin:0">未读额度，点「读全部额度」才准</span>'
      : '<span class="hint" style="margin:0">—</span>';
  }
  var show = ids.slice(0, 3).join(" · ") + (ids.length > 3 ? " …" : "");
  return '<b>' + ids.length + '</b> 个' +
    (live ? ' <span class="tag">实时列出</span>' : ' <span class="tag mut">账号快照</span>') +
    '<div class="hint mono" style="margin:2px 0 0;word-break:break-all">' + esc(show) + '</div>' +
    '<div class="hint" style="margin:3px 0 0">未读额度：这只是凭据能列出的，不保证套餐覆盖</div>';
}
function zcodeQuotaCell(x){
  if (x.quota_error) {
    return '<span class="tag err">读失败</span><div class="hint" style="margin:2px 0 0">' +
      esc(String(x.quota_error).slice(0, 42)) + '</div>';
  }
  var q = x.quota;
  if (!q) return '<span class="tag mut">未读</span>';
  var bs = q.balances || [];
  if (!bs.length) return '<span class="tag mut">上游未返回额度</span>';
  return bs.slice(0, 3).map(function(b){
    var nm = b.show_name || (b.entitlement && b.entitlement.name) || "额度";
    var tot = b.total_units || 0, used = b.used_units || 0;
    var left = (b.remaining_units === undefined || b.remaining_units === null)
      ? Math.max(tot - used, 0) : b.remaining_units;
    return '<div style="margin-bottom:3px"><b>' + esc(nm) + '</b> <span class="mono">剩 ' + esc(String(left)) + '</span>' +
      '<div class="hint" style="margin:1px 0 0">发放 ' + esc(String(tot)) + ' · 已用 ' + esc(String(used)) +
      (b.expires_at ? ' · 到期 ' + esc(fmtTime(b.expires_at)) : "") + '</div></div>';
  }).join("");
}
function panelZCandidates(c){
  var rows = c.map(function(x){
    var dim = x.imported ? "dim" : "";
    var first = x.imported ? '<span class="tag mut">已导入</span>'
      : '<input type="checkbox" data-cand="' + esc(x.id) + '"' + (S.checked[x.id] ? " checked" : "") + ' style="width:auto">';
    var bits = [];
    if (x.api_key_hint) bits.push("key " + x.api_key_hint);
    if (x.upstream) bits.push(x.upstream);
    return '<tr class="' + dim + '"><td style="width:56px">' + first + '</td>' +

/* ---------- 账号池 ---------- */
/* loadCredits 拉余额快照。后端是「先返回旧值 + 后台重查」的形态，所以
   refreshing 为真时再隔 3 秒看一次（最多 6 次，不做无限轮询）。
   和池里那个 credits 字段的区别：池内值是每日签到时写的，这里是按需直查上游。 */
async function loadCredits(force){
  if (S.creditsBusy) return;
  S.creditsBusy = true;
  try {
    S.credits = force
      ? await api("/admin/credits/refresh", { method: "POST", body: {} })
      : await api("/admin/credits");
  } catch (e) { S.credits = null; }
  finally { S.creditsBusy = false; }
  render();
  if (S.credits && S.credits.refreshing && S.creditsPolls < 6){
    S.creditsPolls += 1;
    setTimeout(function(){ loadCredits(false); }, 3000);
  } else if (S.credits && !S.credits.refreshing){
    S.creditsPolls = 0;
  }
}
function creditRowOf(uid){
  var list = (S.credits && S.credits.accounts) || [];
  for (var i = 0; i < list.length; i++){ if (list[i].uid === uid) return list[i]; }
  return null;
}
/* creditCell 余额单元格：优先用直查结果（权威），查不到才回落到池内值并标明。 */
function fmtCredit(n){
  // credit 是上游给的浮点扣费数，直接 toFixed/String 会漏出 33.59000000000001 这种尾巴。
  n = Number(n) || 0;
  if (!isFinite(n) || n === 0) return "0";
  if (Math.abs(n) >= 1000) return String(Math.round(n));
  if (Math.abs(n) >= 1) return String(Math.round(n * 100) / 100);
  return String(Math.round(n * 10000) / 10000);
}
function fmtNum(n, unit){
  n = Number(n) || 0;
  if (unit !== "token") return String(n);
  // token 数动辄上亿，按原样报会看错数量级；换中文单位。
  if (n >= 1e8) return (n / 1e8).toFixed(2) + " 亿";
  if (n >= 1e4) return (n / 1e4).toFixed(1) + " 万";
  return String(n);
}
function creditCell(a){
  var c = creditRowOf(a.uid);
  if (c && c.ok){
    var sub = [];
    if (c.total) sub.push("总量 " + fmtNum(c.total, c.unit));
    if (c.used) sub.push("已用 " + fmtNum(c.used, c.unit));
    if (c.expiring) sub.push("快过期 " + fmtNum(c.expiring, c.unit));
    // 读到额度用的是哪一层凭据（号池文件 / zcode 账本 / ZCode 应用登录态）。
    // 后两层是兜底，运维要知道这个数字是不是随号池文件走的那一份。
    if (c.cred_source) sub.push("凭据 " + c.cred_source);
    if (c.note) sub.push(c.note);
    return '<div style="font-weight:600">' + fmtNum(c.remain, c.unit) +
      (c.unit === "token" ? ' <span class="hint" style="font-weight:400">token</span>' : '') + '</div>' +
      (sub.length ? '<div class="hint" style="margin:2px 0 0">' + esc(sub.join(" · ")) + '</div>' : '');
  }
  if (c && c.note){
    return '<span class="hint">上游未给可用范围</span>' +
      (a.credits ? '<div class="hint" style="margin:2px 0 0">池内 ' + esc(a.credits) + '</div>' : '');
  }
  if (c && c.error){
    return '<span class="hint" title="' + esc(c.error) + '">查不到</span>' +
      (a.credits ? '<div class="hint" style="margin:2px 0 0">池内 ' + esc(a.credits) + '</div>' : '');
  }
  if (a.credits) return a.credits + '<div class="hint" style="margin:2px 0 0">池内值</div>';
  return '<span class="hint">—</span>';
}
/* modelCell 账号池的「可用模型」列：先把该号**当前真正能用**的模型亮出来。
读得到权益就列（zcode 由套餐 capabilities 决定），读不到就说清楚为什么。
workbuddy 侧没有逐号模型权益——它的目录是所有同构号共享的，去「输出 API」看。 */
function modelCell(a){
  var c = creditRowOf(a.uid);
  var ms = (c && c.entitled_models) || [];
  if (ms.length){
    return '<span class="tag ok">' + ms.length + ' 个</span>' +
      (c.plan_summary ? ' <span class="hint">' + esc(c.plan_summary) + '</span>' : '') +
      '<div class="hint" style="margin:2px 0 0;word-break:break-all">' +
      esc(ms.slice(0, 3).join(" · ")) + (ms.length > 3 ? " …" : "") + '</div>';
  }
  if (c && c.note) return '<span class="hint">上游未给范围</span>';
  if (c && c.error) return '<span class="hint" title="' + esc(c.error) + '">依赖额度</span>';
  if ((a.producer || "") === "zcode") return '<span class="hint" title="点右上角「刷新」读该号的套餐权益">待读权益</span>';
  return '<span class="hint" title="workbuddy 侧模型目录按客户端共享，去「输出 API」看清单">按客户端目录</span>';
}
/* expCell 账号 access token 的到期呈现：绝对时间 + 剩余天数。0 = 号池里没记，
   不编造（不是"永不过期"，只是这份 auth 文件没写 expiresAt）。 */
function expCell(a){
  var c = creditRowOf(a.uid);
  // zcode 号没有 refresh token（凭据是长期密钥），能回答"用到什么时候"的只有套餐到期，
  // 所以这里回落到额度那一路拿到的 expires_at，并标明这是套餐口径。
  var planTs = (!a.expires_at && c && c.expires_at) ? c.expires_at : 0;
  var ts = a.expires_at || planTs;
  if (!ts) return '<span class="hint">—</span>';
  var days = Math.floor((ts * 1000 - Date.now()) / 86400000);
  var tone = days < 0 ? "err" : (days <= 7 ? "warn" : "");
  var label = days < 0 ? "已过期 " + (-days) + " 天" : ("剩 " + days + " 天");
  return '<span class="mono">' + esc(fmtTime(ts)) + '</span>' +
    '<div class="hint" style="margin:2px 0 0"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' +
    label + (planTs ? " · 套餐" : "") + '</div>';
}
/* failCell 池表「成功/连败」列的第二格：连败（consecutive_fails）是账号当前真实信号，
   熔断失败数（breaker_fails）另计。原来这一格取的是不存在的 err_total，恒为 0，
   看着像「从没失败过」，会误导排障。连败为 0 时退回显示熔断失败数（有则显示）。 */
function failCell(a){
  var cf = a.consecutive_fails || 0;
  if (cf) return '<span style="color:var(--warn)">' + cf + '</span>';
  var bf = a.breaker_fails || 0;
  if (bf) return bf;
  return "0";
}
function failTitle(a){
  var parts = [];
  parts.push("成功 " + (a.success_count || 0) + " 次");
  parts.push("连续失败 " + (a.consecutive_fails || 0) + " 次");
  if (a.breaker_fails) parts.push("熔断累计失败 " + a.breaker_fails + " 次");
  if (a.in_flight) parts.push("在飞 " + a.in_flight);
  return parts.join(" · ");
}
function acctState(a){
  if (a.disabled) return '<span class="tag err">已禁用</span>';
  if (a.manual_disabled) return '<span class="tag warn">手动停用</span>';
  if (a.cooling) return '<span class="tag warn">冷却中</span>';
  if (futureTime(a.breaker_until)) return '<span class="tag warn">熔断中</span>';
  return '<span class="tag ok">可用</span>';
}
/* realmTags 域标签：正常情况下显示生效路由域；当凭证域（stored）与生效域不一致时
   显式写成 stored→routing 并给出原因，避免把「打不通」误读成「账号本身有问题」。 */
function realmTags(a){
  var c = creditRowOf(a.uid);
  var stored = c && c.realm_stored;
  if (stored && stored !== a.realm){
    return ' <span class="tag warn" title="该号凭证属于 ' + esc(stored) + '（' + esc(stored) +
      ' 域），但网关配置 global.enabled=false，已强制按 ' + esc(a.realm) + ' 域路由——上游必然拒绝">' +
      esc(stored) + '→' + esc(a.realm) + '</span>';
  }
  return a.realm ? ' <span class="tag">' + esc(a.realm) + '</span>' : "";
}
function acctReason(a){
  var r = a.reason || a.manual_reason || a.disabled_reason || "";
  // 余额查不到时把上游给的原因落到这一列：账号可用但余额读不出来，
  // 是配置/网络问题（如国际版号被按 CN 路由），不能只显示一个「查不到」。
  if (!r){
    var rc = creditRowOf(a.uid);
    if (rc && !rc.ok && rc.error) r = "余额查不到：" + rc.error;
  }
  if (a.cool_kind === "hard_credit" && !r) r = "余额不足，等签到恢复";
  if (a.cool_remaining_sec) r = "剩余 " + durNum(a.cool_remaining_sec) + (r ? " · " + r : "");
  if (futureTime(a.degrade_until) && !a.cooling && !a.disabled) r = "连败降权 · " + (r || "临时出池");
  return r || "—";
}
function acctActions(a){
  var out = "";
  if (a.disabled) out += '<button class="tiny" data-action="acct" data-op="revive" data-uid="' + esc(a.uid) + '">复活</button> ';
  if (a.manual_disabled) out += '<button class="tiny" data-action="acct" data-op="enable" data-uid="' + esc(a.uid) + '">启用</button>';
  else if (!a.disabled) out += '<button class="tiny" data-action="acct" data-op="disable" data-uid="' + esc(a.uid) + '">停用</button>';
  if (!out) out = '<span class="hint">—</span>';
  return out;
}
function viewPool(){
  var st = S.status;
  if (!st) return head("账号池", "正在读取账号池…");
  // 域筛选只对「内部还分域」的客户端成立；客户端没选/不分区时强制归位，
  // 免得留下一个看不见却仍在生效的筛选（列表少了行却没有对应的亮起的 chip）。
  if (S.poolClient === "all" || producerRealms(S.poolClient).length < 2){ if (S.poolRealm !== "all") S.poolRealm = "all"; }
  var allAccts = st.accounts || [];
  // 客户端与来源方式两排 chips 互相收窄：选了客户端，来源方式的计数只数这家；选了来源
  // 方式，客户端的计数也照样只数这种进来的号。两排各拿全池数并列，会出现「客户端 ZCode 7」
  // 旁边写「来源方式 全部 15」这种看着自相矛盾的画面——那才是口径没捋明白。
  var byClient = function(list){
    if (S.poolClient === "all") return list;
    return list.filter(function(a){ return (a.producer || "none") === S.poolClient; });
  };
  var byOrigin = function(list){
    if (S.poolFilter === "all") return list;
    return list.filter(function(a){
      var o = originOf(a.uid);
      if (S.poolFilter === "none") return !o || !o.method;
      return !!(o && o.method === S.poolFilter);
    });
  };
  var clientScoped = byClient(allAccts);
  var originScoped = byOrigin(allAccts);
  var oc = {}, annotated = 0;
  clientScoped.forEach(function(a){
    var o = originOf(a.uid);
    if (o && o.method){ oc[o.method] = (oc[o.method] || 0) + 1; annotated++; }
  });
  var realm = st.realm_totals || {};
  var cn = realm.cn || {}, gl = realm.global || {};
  var chips = [{ id: "all", n: clientScoped.length }].concat(METHOD_ORDER.map(function(m){
    return { id: m, n: oc[m] || 0 };
  })).concat([{ id: "none", n: Math.max(0, clientScoped.length - annotated) }]);
  var chipHtml = chips.map(function(c){
    var label = c.id === "all" ? "全部" : (c.id === "none" ? "未标注" : methodLabel(c.id));
    return '<button class="chip' + (S.poolFilter === c.id ? " on" : "") + '" data-filter="' + c.id + '">' +
      esc(label) + ' <span style="opacity:.6">' + c.n + '</span></button>';
  }).join("");
  // 客户端（producer）维度：与「来源方式」正交——方式说「怎么进来的」，
  // 客户端说「这是谁的号」。跨客户端不能互相顶替（凭据不同构）。
  var pt = st.producer_totals || [];
  var pc = {};
  originScoped.forEach(function(a){ var k = a.producer || "none"; pc[k] = (pc[k] || 0) + 1; });
  var clientChips = [{ id: "all", n: originScoped.length, name: "全部" }].concat(pt.map(function(x){
    var k = x.producer || "none";
    return { id: k, n: pc[k] || 0, name: (x.name || producerName(x.producer)) + (x.servable ? "" : "（只读）") };
  }));
  var clientHtml = clientChips.map(function(c){
    return '<button class="chip' + (S.poolClient === c.id ? " on" : "") + '" data-pclient="' + esc(c.id) + '">' +
      esc(c.name) + ' <span style="opacity:.6">' + c.n + '</span></button>';
  }).join("");
  // 域（realm）是「客户端内部的二级维度」：只有同一家内部还分域时才成立——今天的
  // workbuddy 底下分 CN 版（codebuddy.cn）与国际版 wba（workbuddy.ai）。zcode 只有一路
  // （cn）。所以这排只在「已选中某个客户端」时出现，计数也只数该客户端的号；选「全部」
  // 时整排不显示——否则会把 zcode 的号也算进「CN 版」，看着像 WorkBuddy 有 11 个 CN 号。
  var realmChips = null, realmHtml = "";
  if (S.poolClient !== "all"){
    // 域也吃「来源方式」这一刀的收窄：否则选了「switch 账本」再把客户端切到 WorkBuddy，
    // 域那排会把没选中的来源也算进去。域种类为 0（来源方式筛空了这家）时整排不显示。
    var bothScoped = byOrigin(clientScoped);
    var rc = {};
    bothScoped.forEach(function(a){ var r = a.realm || "cn"; rc[r] = (rc[r] || 0) + 1; });
    var rs = REALM_ORDER.filter(function(r){ return rc[r]; }).map(function(r){ return { id: r, n: rc[r] }; });
    if (rs.length > 1){
      realmChips = [{ id: "all", n: bothScoped.length, name: "全部" }].concat(rs.map(function(r){
        return { id: r.id, n: r.n, name: REALM_LABEL[r.id] || r.id };
      }));
      realmHtml = realmChips.map(function(c){
        return '<button class="chip' + (S.poolRealm === c.id ? " on" : "") + '" data-prealm="' + esc(c.id) + '">' +
          esc(c.name) + ' <span style="opacity:.6">' + c.n + '</span></button>';
      }).join("");
    }
  }
  var list = (st.accounts || []).filter(function(a){
    if (S.poolClient !== "all" && (a.producer || "none") !== S.poolClient) return false;
    if (S.poolRealm !== "all" && (a.realm || "cn") !== S.poolRealm) return false;
    if (S.poolFilter === "all") return true;
    var o = originOf(a.uid);
    if (S.poolFilter === "none") return !o || !o.method;
    return !!(o && o.method === S.poolFilter);
  });

    return '<tr class="' + (a.disabled || a.manual_disabled || a.cooling ? "dim" : "") + '">' +
      '<td><b>' + esc(a.nickname || a.uid) + '</b>' +

      '<td>' + methodTag(a.uid) + realmTags(a) + '</td>' +
      '<td>' + modelCell(a) + '</td>' +
      '<td class="num">' + creditCell(a) + '</td>' +

      '<td>' + acctState(a) + '</td>' +
      '<td style="color:var(--fg3);font-size:12px"><div class="clamp" title="' + esc(acctReason(a)) + '">' + esc(acctReason(a)) + '</div></td>' +
      '<td class="num" title="' + esc(failTitle(a)) + '">' + (a.success_count || 0) + ' / ' + failCell(a) + '</td>' +
      '<td>' + acctActions(a) + '</td></tr>';
  }).join("");
  var html = head("账号池", "池里所有账号：来源归属、积分余额（含快过期部分）、token 到期、健康状态。" +
    "停用只摘对话流量，签到与保活照常。");
  html += '<div class="grid4">' +
    statBox("账号总数", st.total, "路由域 cn " + (cn.total || 0) + " · global " + (gl.total || 0)) +
    statBox("可用", st.healthy, "可立即承接请求") +
    statBox("冷却中", st.cooling, "到期自动回池") +
    statBox("已禁用", st.disabled, "需要手动复活") +
    '</div>';
  var credWhen = (S.credits && S.credits.fetched_at) ? fmtTime(S.credits.fetched_at) : "查询中…";
  var credBar = '<div class="row" style="margin:12px 0 2px">' +
    '<span class="hint" style="margin:0">余额直查上游 billing（10 分钟缓存）· 上次 ' + esc(credWhen) +
    (S.credits && S.credits.refreshing ? " · 正在后台重查…" : "") + '</span>' +
    '<span class="grow"></span>' +
    '<button class="rf" data-action="credits-refresh" title="立刻重查每个号的积分余额，不等 10 分钟缓存">' +
      svg("refresh") + '刷新余额</button></div>' +
    '<div class="hint" style="margin:0 0 6px">「可用模型」= 该账号<b>当前真正能用</b>的模型（读得到套餐/权益就按权益算）；' +
    'workbuddy 侧的目录是所有同构号共享的，看「输出 API」的发布清单。</div>';
  var cooldownBtn = '<button class="withico" data-action="reset-cooldowns" ' +
    'title="把池里所有账号的冷却、熔断、连败计数清零。停用/手工禁用不动；即时生效，不用停服。">清空冷却</button>';
  html += card("账号清单", "",
    credBar +
    '<div class="chips"><span class="hint" style="margin:0 8px 0 0;align-self:center">客户端</span>' + clientHtml + '</div>' +

/* statBox 统计页/运行态的指标卡。key 非空时值与副文本挂 data-live，可局部更新。 */
/* statBox 统计页/运行态的指标卡。key 非空时值与副文本挂 data-live，可局部更新。

/* ---------- 输出 API ---------- */
/* 多出口（每个客户端一条独立 API）：出口 = 独立端口 + 自己的一套输出参数 +
   自己服务哪些客户端。全部放主口、还是给不同来源各开一个口，由用户在这里选。 */
function fmtOptions(sel, inheritLabel){
  var head = "";
  if (inheritLabel){
    head = '<option value=""' + (sel ? "" : " selected") + '>' + esc(inheritLabel) + '</option>';
  }
  return head + (S.out.formats || []).map(function(f){
    return '<option value="' + esc(f.id) + '"' + (sel === f.id ? " selected" : "") +
      (f.available ? "" : " disabled") + '>' + esc(f.name) + (f.available ? "" : "（待接入）") + '</option>';
  }).join("");
