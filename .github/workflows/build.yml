# build.yml 定时多架构打包发布 ghcr.io + amd64 离线 tar.gz artifact。
# 解决 issue #21「建议打包现成 docker 镜像」：NAS/离线环境拉不到 ghcr 时用 artifact。
# 参考 /tmp/free2api-build，适配本仓库（workflow 就住在仓库里，无需双 checkout 覆盖 Dockerfile）。
name: Build & Publish

on:
  schedule:
    # 每天北京时间 12:23 = UTC 04:23。
    # 不用整点 04:00：GitHub schedule 在整点高峰排队严重（实测连续三天迟到 5h+，
    # 2026-09-17 的 04:00 排队被静默丢弃、整天未跑），错峰 23 分降低排队延迟与丢弃率。
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    tags: ['v*'] # 打 tag 也触发发布

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create config.json for build
        run: cp config.example.json config.json

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写：github.repository 可能含大写（如 owner 段），需转小写
      - name: Compute image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 额外导出 amd64 离线 tar.gz：NAS 拉不到 ghcr 时用 artifact 部署。
      - name: Export offline tarball (amd64)
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile \
            --tag free2api:offline --output type=docker,dest=free2api-amd64.tar .
          gzip -f free2api-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: free2api-amd64
          path: free2api-amd64.tar.gz
          if-no-files-found: error
